
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON COAST V11</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#020817;color:white;font-family:Arial,"Malgun Gothic",sans-serif}
canvas{display:block}
.panel{background:rgba(3,14,32,.91);border:1px solid #35cfff99;border-radius:13px;padding:12px 15px;backdrop-filter:blur(7px)}
#hud{position:fixed;inset:0;pointer-events:none}
#brand{position:absolute;top:13px;left:13px}
#brand b{font-size:20px;letter-spacing:4px;color:#b8faff;text-shadow:0 0 15px #00dfff,0 0 30px #00aaff}
#brand small{display:block;color:#9bbbd3;font-size:10px;letter-spacing:2px;margin-top:5px}
#stats{position:absolute;right:13px;top:13px;text-align:right;font-size:12px;line-height:1.9}
#help{position:absolute;left:13px;bottom:13px;font-size:12px;line-height:1.8;color:#c9eaff}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#d9fcff}
#prompt{display:none;position:absolute;top:58%;left:50%;transform:translateX(-50%);background:#06243a;border:1px solid #4beaff;padding:12px 18px;border-radius:10px;white-space:nowrap}
#notice{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);color:#b9f8ff;text-shadow:0 0 10px #00dfff;white-space:nowrap}
#elevator{display:none;pointer-events:auto;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(370px,92vw);text-align:center}
#elevator h2{color:#8af5ff;letter-spacing:3px}
#floorDisplay{font-size:34px;margin:12px}
#floorInfo{font-size:12px;color:#a5c8dc;margin-bottom:12px}
#floors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:240px;overflow:auto}
button{cursor:pointer}
#floors button,#exitLift,#settings button{border:1px solid #48dfff;background:#092846;color:white;padding:11px;border-radius:8px}
#floors button:hover,#exitLift:hover,#settings button:hover{background:#12628b}
#exitLift{width:100%;margin-top:12px}
#lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#020817dd;pointer-events:auto}
#start{border:1px solid #54eaff;background:linear-gradient(120deg,#073451,#075a78);color:white;padding:18px 30px;border-radius:14px;font-size:17px;box-shadow:0 0 25px #00cfff66}
#settings{position:absolute;right:13px;bottom:13px;pointer-events:auto}
#settings button{font-size:11px;padding:8px 10px}
#clickHint{position:absolute;top:65%;left:50%;transform:translateX(-50%);color:#aeeeff;font-size:12px;white-space:nowrap}
</style>
</head>
<body>
<div id="hud">
 <div id="brand" class="panel">
  <b>NEON COAST</b>
  <small>V11 · MEGA HEIGHT CITY</small>
 </div>
 <div id="stats" class="panel">
  <div>일반 건물 <b>70</b></div>
  <div>평균 높이 <b>7,030m</b></div>
  <div>빔 타워 <b>10</b></div>
  <div>시민 <b>0</b></div>
  <div>중앙 랜드마크 <b>40,592m</b></div>
  <div id="heightText">고도 0m</div>
  <div id="buildingText">도시 탐색 중</div>
  <div id="fpsText">FPS --</div>
 </div>
 <div id="help" class="panel">
  <b>CONTROL</b><br>
  W A S D 이동 · 마우스 시점<br>
  SPACE 점프 · SHIFT 달리기<br>
  E 엘리베이터 탑승 / 재탑승<br>
  ESC 커서 표시 · 화면 클릭 재진입
 </div>
 <div id="cross">+</div>
 <div id="prompt">E 키를 눌러 엘리베이터 탑승</div>
 <div id="notice"></div>
 <div id="elevator" class="panel">
  <h2>SKY ELEVATOR</h2>
  <div id="floorDisplay">1F</div>
  <div id="floorInfo"></div>
  <div id="floors"></div>
  <button id="exitLift">내리기</button>
 </div>
 <div id="clickHint"></div>
 <div id="settings"><button id="quality">그래픽: 초경량</button></div>
 <div id="lock"><button id="start">NEON COAST 입장하기</button></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

/* =====================================
   ENGINE
===================================== */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020817);
scene.fog=new THREE.Fog(0x06172b,5000,46000);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,60000);
camera.position.set(0,2,110);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio,.75));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.45;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9edfff,0x101426,1.8));
const sun=new THREE.DirectionalLight(0x9acbff,1.2);
sun.position.set(-500,1200,700);
scene.add(sun);

const clock=new THREE.Clock();
const boxGeo=new THREE.BoxGeometry(1,1,1);
const dummy=new THREE.Object3D();

const basic=c=>new THREE.MeshBasicMaterial({color:c});
const standard=(c,e=0)=>new THREE.MeshStandardMaterial({
 color:c,emissive:e||c,emissiveIntensity:e?.8:0,
 metalness:.55,roughness:.3
});
const M={
 dark:standard(0x0b1b30),
 road:standard(0x111d2d),
 cyan:basic(0x48eaff),
 blue:basic(0x268fff),
 white:basic(0xe4fbff),
 gold:basic(0xffd477),
 pink:basic(0xff50d6),
 purple:basic(0x9b7cff)
};
const palette=[0x46eaff,0xff50d6,0x9b7cff,0xffd477,0x7fffd5];

function addBox(parent,w,h,d,material,x,y,z){
 const mesh=new THREE.Mesh(boxGeo,material);
 mesh.scale.set(w,h,d);
 mesh.position.set(x,y,z);
 parent.add(mesh);
 return mesh;
}
function setInstance(mesh,index,x,y,z,sx,sy,sz,rotation=0){
 dummy.position.set(x,y,z);
 dummy.scale.set(sx,sy,sz);
 dummy.rotation.set(0,rotation,0);
 dummy.updateMatrix();
 mesh.setMatrixAt(index,dummy.matrix);
}

/* =====================================
   GROUND AND CITY
===================================== */
addBox(scene,5000,3,5000,standard(0x03182b),0,-2,0);
addBox(scene,3200,1,2600,M.road,0,-.5,0);

const roadMarks=new THREE.InstancedMesh(boxGeo,M.gold,260);
let roadCount=0;
for(let x=-1500;x<=1500;x+=240){
 addBox(scene,8,.08,2400,M.dark,x,.03,0);
 for(let z=-1100;z<1100;z+=90){
  setInstance(roadMarks,roadCount++,x,.08,z,.12,.035,13);
 }
}
roadMarks.count=roadCount;
roadMarks.instanceMatrix.needsUpdate=true;
scene.add(roadMarks);

/* =====================================
   STARS
===================================== */
const starPositions=new Float32Array(1800*3);
for(let i=0;i<1800;i++){
 starPositions[i*3]=(Math.random()-.5)*9000;
 starPositions[i*3+1]=100+Math.random()*12000;
 starPositions[i*3+2]=(Math.random()-.5)*9000;
}
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute("position",new THREE.BufferAttribute(starPositions,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({
 color:0xc9f3ff,size:1.7,sizeAttenuation:false
})));

/* =====================================
   WATER REFLECTIONS
===================================== */
const waterLines=new THREE.InstancedMesh(boxGeo,basic(0x258fbd),140);
for(let i=0;i<140;i++){
 setInstance(waterLines,i,(Math.random()-.5)*2800,-.7,
 -1500-Math.random()*1000,3+Math.random()*35,.025,.035);
}
waterLines.instanceMatrix.needsUpdate=true;
scene.add(waterLines);

/* =====================================
   INSTANCED WINDOWS
===================================== */
const windowMeshes=palette.map(c=>{
 const m=new THREE.InstancedMesh(boxGeo,basic(c),70*450);
 m.count=0;
 scene.add(m);
 return m;
});
const windowCounts=[0,0,0,0,0];

function addWindow(color,x,y,z,sx,sy,sz){
 const m=windowMeshes[color%5];
 const i=windowCounts[color%5]++;
 if(i>=m.instanceMatrix.count)return;
 setInstance(m,i,x,y,z,sx,sy,sz);
 m.count=i+1;
}

/* =====================================
   INTERIOR ROOM
   One reusable room
===================================== */
const roomGroup=new THREE.Group();
scene.add(roomGroup);
let currentRoomType="";
let currentRoomFloor=0;

const roomFloor=standard(0x1c2e43);
const roomWall=standard(0x142d43);
const roomGlow=basic(0x58eaff);
const furniture=standard(0x263e55);
const roomGold=basic(0xffc878);

function clearRoom(){
 while(roomGroup.children.length){
  const obj=roomGroup.children.pop();
  if(obj.geometry)obj.geometry.dispose();
 }
 currentRoomType="";
}
function makeInterior(b,floor,type){
 clearRoom();
 const y=(floor-1)*4.5;
 const elevatorZ=b.z+b.liftZ;
 roomGroup.position.set(b.x,y,elevatorZ+12);
 currentRoomType=type;
 currentRoomFloor=floor;

 addBox(roomGroup,18,.25,20,roomFloor,0,0,0);
 addBox(roomGroup,18,5,.35,roomWall,0,2.5,-9.8);
 addBox(roomGroup,.35,5,20,roomWall,-8.8,2.5,0);
 addBox(roomGroup,.35,5,20,roomWall,8.8,2.5,0);

 addBox(roomGroup,17,.12,.12,roomGlow,0,4.7,-9.4);
 addBox(roomGroup,.12,.12,19,roomGlow,-8.2,4.7,0);
 addBox(roomGroup,.12,.12,19,roomGlow,8.2,4.7,0);

 const signColor=type==="레스토랑"?0xffb85c:
  type==="휴게실"?0x55eaff:
  type==="쇼핑 공간"?0xe18aff:
  type==="전망대"?0xffdf91:0x8bafff;
 addBox(roomGroup,6,1.2,.15,basic(signColor),0,3.9,-9.55);

 if(type==="레스토랑"){
  for(let i=0;i<3;i++){
   const x=-5+i*5,z=-3+(i%2)*5;
   addBox(roomGroup,2.8,.25,2,furniture,x,.9,z);
   addBox(roomGroup,.35,1,.35,roomGold,x-1,.45,z);
   addBox(roomGroup,.35,1,.35,roomGold,x+1,.45,z);
  }
  addBox(roomGroup,5,.35,1.2,roomGold,0,2.5,6);
 }else if(type==="휴게실"){
  for(let i=0;i<3;i++){
   const x=-5+i*5;
   addBox(roomGroup,3,.8,1.5,furniture,x,.65,-2);
   addBox(roomGroup,3,.15,1.5,roomGlow,x,.4,-2);
  }
  addBox(roomGroup,2,.5,2,roomGold,0,.4,4);
 }else if(type==="쇼핑 공간"){
  for(let i=0;i<4;i++){
   const x=-6+i*4;
   addBox(roomGroup,2.3,2.3,2,furniture,x,1.2,-3);
   addBox(roomGroup,2.4,.12,2.1,roomGlow,x,2.4,-3);
  }
 }else if(type==="전망대"){
  addBox(roomGroup,13,.15,1,roomGlow,0,2,-7);
  for(let i=0;i<4;i++){
   addBox(roomGroup,.18,3,.18,roomGlow,-6+i*4,1.5,6);
  }
  addBox(roomGroup,12,.15,1,roomGold,0,2,6);
 }else{
  addBox(roomGroup,5,.7,2,furniture,0,.55,-2);
  addBox(roomGroup,2,1.5,.5,roomGlow,0,2,-9.4);
  addBox(roomGroup,2,.8,2,roomGold,0,.5,3);
 }
}

/* =====================================
   ELEVATOR SYSTEM
===================================== */
const elevators=[];
const beamData=[];

function createElevator(x,z,w,d,h,index,isLandmark=false){
 const group=new THREE.Group();
 group.position.set(x,0,z);
 scene.add(group);

 const liftZ=d/2+3;
 const railMat=basic(isLandmark?0xffe9a1:0x48eaff);

 for(const sx of [-1,1]){
  for(const sz of [-1,1]){
   addBox(group,.12,h,.12,railMat,sx*1.9,h/2,liftZ+sz*1.3);
  }
 }
 addBox(group,3.8,h,.08,new THREE.MeshBasicMaterial({
  color:isLandmark?0xffd477:0x146b91,
  transparent:true,opacity:.13,depthWrite:false
 }),0,h/2,liftZ-1.3);

 const cabin=new THREE.Group();
 cabin.position.set(x,0,z+liftZ);
 scene.add(cabin);

 addBox(cabin,3.2,.18,2.4,M.dark,0,.1,0);
 addBox(cabin,3.2,.1,2.4,railMat,0,3.2,0);
 const glass=new THREE.MeshBasicMaterial({
  color:isLandmark?0xffd477:0x45dfff,
  transparent:true,opacity:.22
 });
 addBox(cabin,3.1,3,.08,glass,0,1.6,-1.17);
 addBox(cabin,.08,3,2.3,glass,-1.55,1.6,0);
 addBox(cabin,.08,3,2.3,glass,1.55,1.6,0);
 const left=addBox(cabin,1.5,3,.12,railMat,-.75,1.6,1.2);
 const right=addBox(cabin,1.5,3,.12,railMat,.75,1.6,1.2);

 return {
  index,x,z,w,d,h,group,cabin,left,right,liftZ,
  isLandmark,
  maxFloor:Math.max(2,Math.floor(h/4.5)),
  activeFloor:1,targetY:0,moving:false,
  door:1,doorTarget:1,stops:[],floorTypes:{},
  name:isLandmark?"CENTRAL MEGA LANDMARK":"건물 "+index
 };
}

/* =====================================
   BUILDING HEIGHTS
   70 BUILDINGS, EXACT AVERAGE 7,030M
===================================== */
const heights=[];
for(let i=0;i<35;i++){
 const h=4000+Math.random()*6000;
 heights.push(h,14060-h);
}
for(let i=heights.length-1;i>0;i--){
 const j=Math.floor(Math.random()*(i+1));
 [heights[i],heights[j]]=[heights[j],heights[i]];
}

const buildings=[];
for(let i=0;i<70;i++){
 const a=i*2.39996;
 const r=500+(i%5)*115+Math.random()*55;
 const x=Math.cos(a)*r;
 const z=Math.sin(a)*r;
 const w=30+Math.random()*18;
 const d=30+Math.random()*18;
 const h=heights[i];
 const color=palette[i%5];
 const glow=basic(color);

 const group=new THREE.Group();
 group.position.set(x,0,z);
 scene.add(group);

 addBox(group,w,h,d,standard(0x0b1b30),0,h/2,0);

 // 외벽 모서리 빛
 for(const sx of [-1,1]){
  for(const sz of [-1,1]){
   addBox(group,.18,h,.18,glow,sx*(w/2-.1),h/2,sz*(d/2-.1));
  }
 }

 // 창문은 인스턴싱으로 처리
 for(let y=35;y<h-10;y+=90){
  addWindow(i,x,y,z+d/2+.1,w*.82,.16,.08);
  addWindow(i,x,y,z-d/2-.1,w*.82,.16,.08);
  addWindow(i,x+w/2+.1,y,z,.08,.16,d*.82);
  addWindow(i,x-w/2-.1,y,z,.08,.16,d*.82);
 }

 // 외벽 가로 네온 라인
 for(let y=250;y<h;y+=500){
  addBox(group,w,.2,.2,glow,0,y,d/2+.1);
  addBox(group,w,.2,.2,glow,0,y,-d/2-.1);
 }

 // 옥상 테두리
 addBox(group,w,.22,.22,glow,0,h+.15,d/2);
 addBox(group,w,.22,.22,glow,0,h+.15,-d/2);
 addBox(group,.22,.22,d,glow,w/2,h+.15,0);
 addBox(group,.22,.22,d,glow,-w/2,h+.15,0);

 const elevator=createElevator(x,z,w,d,h,i+1);
 elevator.group=group;
 elevator.liftZ=d/2+3;
 elevator.cabin.position.set(x,0,z+elevator.liftZ);

 const max=elevator.maxFloor;
 elevator.stops=[1];
 for(let p=.2;p<1;p+=.2){
  elevator.stops.push(Math.max(2,Math.round(max*p)));
 }
 elevator.stops.push(max);
 elevator.stops=[...new Set(elevator.stops)];

 const types=["로비","레스토랑","휴게실","쇼핑 공간","휴게실"];
 elevator.stops.forEach((f,j)=>{
  elevator.floorTypes[f]=types[j%types.length];
 });

 // 층별 발코니와 엘리베이터 접근 표시
 for(const f of elevator.stops){
  const fy=(f-1)*4.5;
  addBox(group,w*.65,.2,5,M.dark,0,fy,elevator.liftZ+4);
  addBox(group,w*.65,.12,.12,glow,0,fy+.16,elevator.liftZ+6.4);
 }

 // 빔 타워 10개
 if(i<10){
  const pivot=new THREE.Group();
  pivot.position.set(0,h+5,0);
  group.add(pivot);

  const beamMat=new THREE.MeshBasicMaterial({
   color,transparent:true,opacity:.13,
   depthWrite:false,side:THREE.DoubleSide
  });
  const coreMat=new THREE.MeshBasicMaterial({
   color:0xe5fcff,transparent:true,opacity:.55,
   depthWrite:false,side:THREE.DoubleSide
  });

  const cone=new THREE.Mesh(
   new THREE.CylinderGeometry(.1,24,1200,8,1,true),beamMat
  );
  cone.position.y=600;
  pivot.add(cone);

  const core=new THREE.Mesh(
   new THREE.CylinderGeometry(.05,2.5,1200,6,1,true),coreMat
  );
  core.position.y=600;
  pivot.add(core);

  const side=new THREE.Mesh(
   new THREE.CylinderGeometry(.1,9,1000,8,1,true),beamMat
  );
  side.rotation.z=.5;
  side.position.y=550;
  pivot.add(side);

  beamData.push({pivot,phase:i*.8});
 }

 buildings.push(elevator);
}
windowMeshes.forEach(m=>m.instanceMatrix.needsUpdate=true);

/* =====================================
   CENTRAL LANDMARK: 40,592M
   LONG ROUNDED RECTANGLE
===================================== */
const LANDMARK_HEIGHT=40592;
const landmark=new THREE.Group();
landmark.position.set(0,0,0);
scene.add(landmark);

const shape=new THREE.Shape();
const W=115,H=95,R=42;
shape.moveTo(-W/2+R,-H/2);
shape.lineTo(W/2-R,-H/2);
shape.quadraticCurveTo(W/2,-H/2,W/2,-H/2+R);
shape.lineTo(W/2,H/2-R);
shape.quadraticCurveTo(W/2,H/2,W/2-R,H/2);
shape.lineTo(-W/2+R,H/2);
shape.quadraticCurveTo(-W/2,H/2,-W/2,H/2-R);
shape.lineTo(-W/2,-H/2+R);
shape.quadraticCurveTo(-W/2,-H/2,-W/2+R,-H/2);

const landmarkGeo=new THREE.ExtrudeGeometry(shape,{
 depth:LANDMARK_HEIGHT,
 bevelEnabled:false,
 curveSegments:14
});
landmarkGeo.rotateX(-Math.PI/2);

const iceMat=new THREE.MeshStandardMaterial({
 color:0x8cecff,emissive:0x1b9fff,
 emissiveIntensity:1.6,metalness:.3,roughness:.18
});
landmark.add(new THREE.Mesh(landmarkGeo,iceMat));

// 중앙의 초강력 빛줄기
for(const x of [-37,0,37]){
 const strip=addBox(landmark,x===0?3.2:1.3,
  LANDMARK_HEIGHT,.9,basic(x===0?0xffffff:0x43eaff),
  x,LANDMARK_HEIGHT/2,47);
 strip.material.transparent=true;
 strip.material.opacity=x===0?1:.95;
}

// 양옆 세로 라인
for(const z of [-48,48]){
 for(const x of [-56,56]){
  addBox(landmark,1.5,LANDMARK_HEIGHT,1.5,
   basic(0x68f4ff),x,LANDMARK_HEIGHT/2,z);
 }
}

// 랜드마크 가로 구분 조명
for(let y=2500;y<LANDMARK_HEIGHT;y+=2500){
 addBox(landmark,120,12,100,basic(0x8cf6ff),0,y,0);
}

// 8개의 회전 링
const landmarkRings=[];
for(let i=0;i<8;i++){
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(90+i*17,2.2,8,90),
  basic(i%2?0x48eaff:0xffe5a2)
 );
 ring.position.y=2200+i*4600;
 ring.rotation.x=Math.PI/2;
 landmark.add(ring);
 landmarkRings.push(ring);
}

// 꼭대기 전망대
addBox(landmark,180,12,160,basic(0x7defff),
 0,LANDMARK_HEIGHT-10,0);
addBox(landmark,145,5,130,basic(0xffffff),
 0,LANDMARK_HEIGHT-2,0);

// 꼭대기 빛 기둥
const beacon=new THREE.Mesh(
 new THREE.CylinderGeometry(.4,55,2200,14,1,true),
 new THREE.MeshBasicMaterial({
  color:0xffffff,transparent:true,opacity:.23,
  side:THREE.DoubleSide,depthWrite:false
 })
);
beacon.position.y=LANDMARK_HEIGHT+1100;
landmark.add(beacon);

// 랜드마크 외곽의 보조 광선
const landmarkBeams=[];
for(let i=0;i<8;i++){
 const beam=new THREE.Mesh(
  new THREE.CylinderGeometry(.3,12,8000,8,1,true),
  new THREE.MeshBasicMaterial({
   color:i%2?0x48eaff:0xffe9a1,
   transparent:true,opacity:.12,
   side:THREE.DoubleSide,depthWrite:false
  })
 );
 beam.position.set(
  Math.cos(i*Math.PI/4)*170,
  LANDMARK_HEIGHT*.53,
  Math.sin(i*Math.PI/4)*170
 );
 beam.rotation.z=(Math.random()-.5)*.3;
 landmark.add(beam);
 landmarkBeams.push(beam);
}

// 랜드마크 엘리베이터
const landmarkLift=createElevator(
 0,0,115,95,LANDMARK_HEIGHT,999,true
);
landmarkLift.group=landmark;
landmarkLift.liftZ=50;
landmarkLift.cabin.position.set(0,0,50);
landmarkLift.stops=[
 1,500,1000,1500,2000,2500,3000,3500,
 4000,4500,5000,5500,6000,6500,7000,
 7500,8000,8500,9000
];
landmarkLift.stops=landmarkLift.stops.filter(
 f=>f<=landmarkLift.maxFloor
);
landmarkLift.stops.push(landmarkLift.maxFloor);
landmarkLift.stops=[...new Set(landmarkLift.stops)];
landmarkLift.floorTypes={
 1:"로비",500:"쇼핑 공간",1000:"휴게실",
 1500:"레스토랑",2000:"휴게실",2500:"전망대",
 3000:"쇼핑 공간",3500:"휴게실",4000:"레스토랑",
 4500:"휴게실",5000:"전망대",5500:"휴게실",
 6000:"레스토랑",6500:"전망대",7000:"휴게실",
 7500:"쇼핑 공간",8000:"레스토랑",8500:"전망대",
 9000:"전망대"
};
landmarkLift.maxFloor=Math.floor(LANDMARK_HEIGHT/4.5);
landmarkLift.name="중앙 메가 랜드마크";

elevators.push(...buildings,landmarkLift);

/* =====================================
   AIR TRANSPORT
===================================== */
const vehicles=[];
for(let i=0;i<8;i++){
 const g=new THREE.Group();
 scene.add(g);
 addBox(g,6,1,2.6,M.dark,0,0,0);
 addBox(g,5,.12,2.3,M.cyan,0,.55,0);
 vehicles.push({
  g,r:600+Math.random()*900,
  a:Math.random()*6.28,
  y:90+Math.random()*180,
  speed:.018+Math.random()*.012
 });
}

/* =====================================
   PLAYER / UI
===================================== */
const $=id=>document.getElementById(id);
let selected=null;
let inElevator=false;
let gameStarted=false;
let pointerLocked=false;
let yaw=0,pitch=0,velocityY=0,grounded=true;
let lowQuality=true;
const keys={};

function notice(t){
 $("notice").textContent=t;
 clearTimeout(notice.timer);
 notice.timer=setTimeout(()=>$("notice").textContent="",2400);
}

function nearestElevator(){
 let best=null,dist=Infinity;
 for(const b of elevators){
  const dx=camera.position.x-b.x;
  const dz=camera.position.z-(b.z+b.liftZ+5);
  const d=Math.hypot(dx,dz);
  if(d<dist){dist=d;best=b;}
 }
 return {building:best,distance:dist};
}

function renderFloors(){
 const b=selected;
 $("floors").innerHTML="";
 $("floorDisplay").textContent=b.activeFloor+"F";
 $("floorInfo").textContent=
  `${b.name} · ${b.isLandmark?"40,592m":Math.round(b.h)+"m"}`;

 for(const f of b.stops){
  const btn=document.createElement("button");
  btn.textContent=f+"F";
  btn.onclick=()=>goFloor(f);
  $("floors").appendChild(btn);
 }
}

function openElevatorUI(){
 $("elevator").style.display="block";
 $("clickHint").textContent="";
 if(document.pointerLockElement)document.exitPointerLock();
 renderFloors();
}
function closeElevatorUI(){
 $("elevator").style.display="none";
 if(gameStarted)renderer.domElement.requestPointerLock();
}
function enterElevator(b){
 selected=b;
 inElevator=true;
 clearRoom();
 b.cabin.position.y=(b.activeFloor-1)*4.5;
 camera.position.set(b.x,b.cabin.position.y+2,b.z+b.liftZ+1);
 openElevatorUI();
 notice(b.name+" 엘리베이터 탑승");
}
function goFloor(f){
 const b=selected;
 if(!b||b.moving)return;
 if(f===b.activeFloor){
  notice("이미 도착한 층이야");
  return;
 }
 b.activeFloor=f;
 b.targetY=(f-1)*4.5;
 b.moving=true;
 b.doorTarget=0;
 closeElevatorUI();
 notice(f+"층으로 이동 중");
}
function exitElevator(){
 const b=selected;
 if(!inElevator||!b||b.moving||b.door<.95)return;

 inElevator=false;
 $("elevator").style.display="none";

 const type=b.floorTypes[b.activeFloor]||"휴게실";
 makeInterior(b,b.activeFloor,type);

 // 엘리베이터 문 앞의 층별 공간에 내림
 camera.position.set(
  b.x,
  b.cabin.position.y+2,
  b.z+b.liftZ+6
 );
 yaw=0;
 pitch=0;
 renderer.domElement.requestPointerLock();
 notice(b.activeFloor+"층 · "+type);
}
$("exitLift").onclick=exitElevator;

function interact(){
 if(inElevator){
  if($("elevator").style.display==="none")openElevatorUI();
  else closeElevatorUI();
  return;
 }

 // 모든 층에서 현재 층과 가까운 엘리베이터 탐색
 let best=null,bestDist=Infinity;
 for(const b of elevators){
  const dx=camera.position.x-b.x;
  const dz=camera.position.z-(b.z+b.liftZ+6);
  const horizontal=Math.hypot(dx,dz);
  const floorY=(b.activeFloor-1)*4.5+2;
  const vertical=Math.abs(camera.position.y-floorY);
  const d=horizontal+vertical*1.4;
  if(d<bestDist){bestDist=d;best=b;}
 }
 if(best&&bestDist<22){
  const nearFloor=Math.max(1,Math.round((camera.position.y-2)/4.5)+1);
  const available=best.stops.reduce((a,f)=>
   Math.abs(f-nearFloor)<Math.abs(a-nearFloor)?f:a,
   best.stops[0]
  );
  best.activeFloor=available;
  enterElevator(best);
 }else{
  notice("엘리베이터 입구 가까이 이동해 줘");
 }
}

/* =====================================
   POINTER LOCK
   ESC THEN CLICK SCREEN TO RE-ENTER
===================================== */
$("start").onclick=()=>{
 gameStarted=true;
 $("lock").style.display="none";
 renderer.domElement.requestPointerLock();
};

renderer.domElement.addEventListener("click",()=>{
 if(gameStarted&&!inElevator&&
    $("elevator").style.display==="none"&&
    !pointerLocked){
  renderer.domElement.requestPointerLock();
 }
});

document.addEventListener("pointerlockchange",()=>{
 pointerLocked=document.pointerLockElement===renderer.domElement;
 $("clickHint").textContent=
  gameStarted&&!pointerLocked&&!inElevator?
  "화면을 클릭하면 다시 게임으로 돌아가":"";
});

document.addEventListener("mousemove",e=>{
 if(!pointerLocked||inElevator)return;
 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=THREE.MathUtils.clamp(pitch,-1.4,1.4);
});
document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="Space")e.preventDefault();
 if(e.code==="KeyE"&&!e.repeat)interact();
});
document.addEventListener("keyup",e=>keys[e.code]=false);

/* =====================================
   PLAYER MOVEMENT
===================================== */
function updatePlayer(dt){
 if(inElevator){
  if(selected){
   camera.position.set(
    selected.x,
    selected.cabin.position.y+2,
    selected.z+selected.liftZ+1
   );
   camera.rotation.set(0,0,0);
  }
  return;
 }
 if(!pointerLocked)return;

 const speed=keys.ShiftLeft?35:19;
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const move=new THREE.Vector3();

 if(keys.KeyW)move.add(forward);
 if(keys.KeyS)move.sub(forward);
 if(keys.KeyD)move.add(right);
 if(keys.KeyA)move.sub(right);

 if(move.lengthSq()>0){
  move.normalize().multiplyScalar(speed*dt);
  camera.position.add(move);
 }

 if(keys.Space&&grounded){
  velocityY=9;
  grounded=false;
 }
 velocityY-=24*dt;
 camera.position.y+=velocityY*dt;

 let ground=2;
 if(currentRoomType){
  const dx=Math.abs(camera.position.x-roomGroup.position.x);
  const dz=Math.abs(camera.position.z-roomGroup.position.z);
  if(dx<8.5&&dz<9){
   ground=roomGroup.position.y+2;
  }
 }
 if(camera.position.y<ground){
  camera.position.y=ground;
  velocityY=0;
  grounded=true;
 }

 camera.position.x=THREE.MathUtils.clamp(camera.position.x,-2400,2400);
 camera.position.z=THREE.MathUtils.clamp(camera.position.z,-2400,2400);
 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
}

/* =====================================
   ELEVATOR UPDATE
===================================== */
function updateElevators(dt){
 for(const b of elevators){
  if(!b.moving&&b.door===b.doorTarget)continue;

  b.door=THREE.MathUtils.damp(b.door,b.doorTarget,5,dt);
  b.left.position.x=-.75-b.door*1.05;
  b.right.position.x=.75+b.door*1.05;

  if(b.moving){
   const diff=b.targetY-b.cabin.position.y;
   const speed=b.isLandmark?1200:220;
   const step=Math.sign(diff)*Math.min(Math.abs(diff),speed*dt);
   b.cabin.position.y+=step;

   if(Math.abs(diff)<.3){
    b.cabin.position.y=b.targetY;
    b.moving=false;
    b.doorTarget=1;
    notice(b.activeFloor+"층 도착!");
    if(selected===b&&inElevator)openElevatorUI();
   }
  }
 }
}

/* =====================================
   GRAPHICS SETTING
===================================== */
$("quality").onclick=()=>{
 lowQuality=!lowQuality;
 renderer.setPixelRatio(Math.min(devicePixelRatio,lowQuality?.75:1));
 $("quality").textContent=lowQuality?
  "그래픽: 초경량":"그래픽: 표준";
};

/* =====================================
   ANIMATION
===================================== */
let frameCount=0,fpsTime=0;
let uiTimer=0;

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const t=clock.elapsedTime;

 updatePlayer(dt);
 updateElevators(dt);

 for(const b of beamData){
  b.pivot.rotation.y=Math.sin(t*.3+b.phase)*1.2;
  b.pivot.rotation.z=Math.sin(t*.4+b.phase)*.6;
 }

 // 랜드마크 링 애니메이션
 landmarkRings.forEach((ring,i)=>{
  ring.rotation.y=t*(i%2?-.32:.32);
  ring.rotation.x=Math.PI/2+Math.sin(t*.25+i)*.06;
 });
 beacon.material.opacity=.18+Math.sin(t*2)*.08;
 iceMat.emissiveIntensity=1.35+Math.sin(t*1.8)*.3;

 for(const v of vehicles){
  v.a+=dt*v.speed;
  v.g.position.set(
   Math.cos(v.a)*v.r,
   v.y+Math.sin(t+v.a)*2,
   Math.sin(v.a)*v.r
  );
  v.g.rotation.y=-v.a;
 }

 uiTimer+=dt;
 if(uiTimer>.15){
  uiTimer=0;
  if(!inElevator){
   const near=nearestElevator();
   // 현재 층 높이와 입구 높이를 함께 확인
   let usable=false;
   if(near.building){
    const expected=(near.building.activeFloor-1)*4.5+2;
    usable=near.distance<18&&Math.abs(camera.position.y-expected)<12;
   }
   $("prompt").style.display=usable?"block":"none";
  }else{
   $("prompt").style.display="none";
  }
  $("heightText").textContent=
   "고도 "+Math.max(0,Math.round(camera.position.y))+"m";
  $("buildingText").textContent=inElevator?
   selected.name+" 엘리베이터":
   currentRoomType?currentRoomType:"도시 탐색 중";
 }

 frameCount++;
 fpsTime+=dt;
 if(fpsTime>=1){
  $("fpsText").textContent="FPS "+frameCount;
  frameCount=0;
  fpsTime=0;
 }

 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
