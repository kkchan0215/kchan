<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>글 게시판</title>
<style>
body{font-family:sans-serif;background:linear-gradient(135deg,#f3e8ff,#e0ccff);margin:0}
header{background:#b388ff;color:white;padding:20px;text-align:center;font-size:24px}
.box{background:#f8f2ff;margin:15px auto;padding:15px;width:90%;max-width:500px;border-radius:15px}
input, textarea{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:1px solid #d6b3ff}
button{width:100%;padding:10px;background:#b388ff;color:white;border:none;border-radius:10px;font-size:16px}
.feed{width:90%;max-width:500px;margin:10px auto}
.card{background:#e6d6ff;padding:15px;margin-bottom:15px;border-radius:15px}
.detail{background:#f8f2ff;padding:20px;margin:20px auto;width:90%;max-width:600px;border-radius:15px;display:none}
.delete-btn{background:#ff6b6b;margin-top:8px}
.link-btn{background:#999;margin-top:5px}
</style>
</head>
<body>

<header>💜 글 게시판 💜</header>

<div class="box" id="loginBox">
  <input type="text" id="loginId" placeholder="아이디">
  <input type="password" id="loginPw" placeholder="비밀번호">
  <button onclick="login()">로그인</button>
  <button class="link-btn" onclick="showSignup()">회원가입</button>
</div>

<div class="box" id="signupBox" style="display:none">
  <input type="text" id="newId" placeholder="새 아이디">
  <input type="password" id="newPw" placeholder="새 비밀번호">
  <button onclick="signup()">가입하기</button>
  <button class="link-btn" onclick="showLogin()">로그인 화면으로</button>
</div>

<div class="box" id="writeBox" style="display:none">
  <div id="welcome"></div>
  <input type="text" id="title" placeholder="제목">
  <textarea id="content" rows="3" placeholder="글 내용을 입력하세요"></textarea>
  <button onclick="addPost()">게시하기</button>
  <button onclick="logout()" style="background:#999;margin-top:8px">로그아웃</button>
  <button onclick="deleteAllPosts()" id="adminBtn" style="display:none;background:#ff3b3b;margin-top:8px">전체 글 삭제</button>
</div>

<div class="feed" id="feed"></div>
<div class="detail" id="detailView"></div>

<script>
const ADMIN_ACCOUNT_ID="kangchan215";   // 👑 관리자 아이디
const ADMIN_PASSWORD="kk215gksk!!^^";       // 👑 관리자 전용 비번

function showSignup(){loginBox.style.display="none";signupBox.style.display="block";}
function showLogin(){signupBox.style.display="none";loginBox.style.display="block";}

function signup(){
  const id=newId.value.trim();
  const pw=newPw.value.trim();
  if(!id||!pw){alert("입력하세요");return;}
  let users=JSON.parse(localStorage.getItem("users"))||{};
  if(users[id]){alert("이미 존재");return;}
  users[id]=pw;
  localStorage.setItem("users",JSON.stringify(users));
  alert("가입 완료!");
  showLogin();
}

function login(){
  const id=loginId.value.trim();
  const pw=loginPw.value.trim();
  let users=JSON.parse(localStorage.getItem("users"))||{};

  let isAdmin=false;

  if(id===ADMIN_ACCOUNT_ID && pw===ADMIN_PASSWORD){
    isAdmin=true;
  }else if(users[id]===pw){
    isAdmin=false;
  }else{
    alert("로그인 실패");
    return;
  }

  localStorage.setItem("user",JSON.stringify({id,isAdmin}));
  showUser();
}

function logout(){localStorage.removeItem("user");location.reload();}
function getUser(){return JSON.parse(localStorage.getItem("user"));}

function showUser(){
  const user=getUser();
  if(!user)return;
  loginBox.style.display="none";
  signupBox.style.display="none";
  writeBox.style.display="block";
  welcome.innerText="로그인: "+user.id;
  if(user.isAdmin)adminBtn.style.display="block";
}

function addPost(){
  const user=getUser();
  const title=document.getElementById("title").value.trim();
  const content=document.getElementById("content").value.trim();
  if(!title||!content){alert("입력하세요");return;}
  const post={author:user.id,title,content,time:new Date().toLocaleString()};
  let posts=JSON.parse(localStorage.getItem("posts"))||[];
  posts.unshift(post);
  localStorage.setItem("posts",JSON.stringify(posts));
  displayPosts();
  title.value="";content.value="";
}

function displayPosts(){
  const posts=JSON.parse(localStorage.getItem("posts"))||[];
  feed.innerHTML="";
  posts.forEach((p,i)=>{
    feed.innerHTML+=`
      <div class="card">
        <h3 onclick="openDetail(${i})">${p.title}</h3>
        <div>작성자: ${p.author}</div>
        <p onclick="openDetail(${i})">${p.content.substring(0,40)}...</p>
        <button class="delete-btn" onclick="deletePost(${i},'${p.author}')">삭제</button>
      </div>`;
  });
}

function deletePost(i,author){
  const user=getUser();
  if(!user.isAdmin && user.id!==author){alert("자기 글만 삭제 가능");return;}
  let posts=JSON.parse(localStorage.getItem("posts"))||[];
  posts.splice(i,1);
  localStorage.setItem("posts",JSON.stringify(posts));
  displayPosts();
}

function deleteAllPosts(){
  const user=getUser();
  if(!user.isAdmin)return;
  if(confirm("모든 글 삭제?")){
    localStorage.removeItem("posts");
    displayPosts();
  }
}

function openDetail(i){
  const posts=JSON.parse(localStorage.getItem("posts"))||[];
  const p=posts[i];
  detailView.innerHTML=`<h2>${p.title}</h2><div>${p.author}</div><p>${p.content}</p><button onclick="closeDetail()">닫기</button>`;
  detailView.style.display="block";
  feed.style.display="none";
  writeBox.style.display="none";
}

function closeDetail(){
  detailView.style.display="none";
  feed.style.display="block";
  writeBox.style.display="block";
}

showUser();
displayPosts();
</script>

</body>
</html>
