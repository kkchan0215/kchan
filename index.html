<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>글 게시판</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{font-family:sans-serif;background:#f3ecff;margin:0;padding:20px}
.card{background:#E6D6FF;padding:15px;margin-bottom:15px;border-radius:15px}
button{padding:6px 10px;border:none;border-radius:8px;background:#b57cff;color:white;margin-top:5px}
input,textarea{width:100%;margin:5px 0;padding:8px;border-radius:8px;border:1px solid #ccc}
</style>
</head>
<body>

<h2>💜 글 게시판 💜</h2>

<div id="auth">
  <input id="email" placeholder="이메일">
  <input id="password" type="password" placeholder="비밀번호">
  <button onclick="signup()">회원가입</button>
  <button onclick="login()">로그인</button>
</div>

<div id="write" style="display:none">
  <input id="title" placeholder="제목">
  <textarea id="content" placeholder="내용"></textarea>
  <button onclick="addPost()">글 추가</button>
  <button id="adminDeleteAll" style="display:none;background:red" onclick="deleteAll()">전체 글 삭제</button>
</div>

<div id="feed"></div>

<script>
// 🔥 Firebase 설정값 넣기
const firebaseConfig = {
  apiKey: "여기에",
  authDomain: "여기에",
  projectId: "여기에",
  storageBucket: "여기에",
  messagingSenderId: "여기에",
  appId: "여기에"
};
firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

// ⭐ 관리자 계정 이메일
const ADMIN_EMAIL="kkchan0215";

let currentUser=null;
let currentName="";

auth.onAuthStateChanged(async user=>{
  if(user){
    currentUser=user;
    document.getElementById("auth").style.display="none";
    document.getElementById("write").style.display="block";

    const doc=await db.collection("users").doc(user.uid).get();
    currentName=doc.data().name;

    if(user.email===ADMIN_EMAIL){
      adminDeleteAll.style.display="block";
    }

    loadPosts();
  }
});

function signup(){
  auth.createUserWithEmailAndPassword(email.value,password.value)
  .then(cred=>{
    const name=prompt("닉네임 입력");
    db.collection("users").doc(cred.user.uid).set({name:name});
  });
}

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value);
}

function addPost(){
  db.collection("posts").add({
    title:title.value,
    content:content.value,
    uid:currentUser.uid,
    name:currentName,
    time:new Date(),
    likes:[]
  });
}

function loadPosts(){
  db.collection("posts").orderBy("time","desc")
  .onSnapshot(snap=>{
    feed.innerHTML="";
    snap.forEach(doc=>{
      const p=doc.data();
      feed.innerHTML+=`
      <div class="card">
        <h3>${p.title}</h3>
        <p>${p.content}</p>
        <div>작성자: ${p.name}</div>

        <button onclick="like('${doc.id}',${JSON.stringify(p.likes||[])})">
          ❤️ ${p.likes?.length||0}
        </button>

        ${p.uid===currentUser.uid || currentUser.email===ADMIN_EMAIL
          ? `<button onclick="del('${doc.id}')">삭제</button>`:""}

        <div>
          <input id="cmt-${doc.id}" placeholder="댓글쓰기">
          <button onclick="addComment('${doc.id}')">댓글</button>
          <div id="comments-${doc.id}"></div>
        </div>
      </div>`;
      loadComments(doc.id);
    });
  });
}

function del(id){
  db.collection("posts").doc(id).delete();
}

function deleteAll(){
  db.collection("posts").get().then(snap=>{
    snap.forEach(doc=>doc.ref.delete());
  });
}

function like(id,likes){
  const ref=db.collection("posts").doc(id);
  if(likes.includes(currentUser.uid)){
    ref.update({likes:firebase.firestore.FieldValue.arrayRemove(currentUser.uid)});
  }else{
    ref.update({likes:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)});
  }
}

function addComment(postId){
  const text=document.getElementById("cmt-"+postId).value;
  db.collection("posts").doc(postId).collection("comments").add({
    text:text,
    name:currentName,
    time:new Date()
  });
}

function loadComments(postId){
  db.collection("posts").doc(postId).collection("comments")
  .orderBy("time")
  .onSnapshot(snap=>{
    const box=document.getElementById("comments-"+postId);
    box.innerHTML="";
    snap.forEach(d=>{
      box.innerHTML+=`<div>💬 ${d.data().name}: ${d.data().text}</div>`;
    });
  });
}
</script>
</body>
</html>
