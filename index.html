<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>나만의 일기장</title>
<style>
body { font-family: Arial; background:#f3e5f5; color:#4a148c; padding:20px;}
h1 {text-align:center;}
button {background:#8e24aa;color:white;border:none;padding:8px 14px;border-radius:5px;margin-top:5px;cursor:pointer;}
input, textarea, select {width:100%;padding:6px;margin:5px 0;border:1px solid #ce93d8;border-radius:4px;}
.card {background:#f8eafc;border:1px solid #ce93d8;padding:10px;margin:10px 0;border-radius:6px;}
.hidden {display:none;}
</style>
</head>
<body>

<h1>💜 나만의 일기장 💜</h1>

<div id="authBox">
  <h3>로그인</h3>
  <input id="loginId" placeholder="아이디">
  <input id="loginPw" type="password" placeholder="비밀번호">
  <button onclick="login()">로그인</button>

  <h3>회원가입</h3>
  <input id="joinId" placeholder="아이디">
  <input id="joinPw" type="password" placeholder="비밀번호">
  <button onclick="register()">회원가입</button>
</div>

<div id="diaryBox" class="hidden">
  <button onclick="logout()">로그아웃</button>

  <h3>그룹 만들기</h3>
  <input id="newGroup" placeholder="그룹 이름">
  <button onclick="addGroup()">그룹 생성</button>

  <h3>그룹 선택</h3>
  <select id="groupSelect" onchange="renderPosts()"></select>

  <h3>일기 쓰기</h3>
  <input id="title" placeholder="제목">
  <textarea id="content" rows="4" placeholder="내용"></textarea>
  <button onclick="addPost()">저장</button>

  <h3>내 일기 목록</h3>
  <div id="posts"></div>
</div>

<script>
let users = JSON.parse(localStorage.getItem("users") || "{}");
let posts = JSON.parse(localStorage.getItem("posts") || "[]");
let groups = JSON.parse(localStorage.getItem("groups") || "[]");
let currentUser = localStorage.getItem("currentUser");

function saveData(){
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("posts", JSON.stringify(posts));
  localStorage.setItem("groups", JSON.stringify(groups));
}

function register(){
  const id = joinId.value.trim();
  const pw = joinPw.value.trim();
  if(!id || !pw) return alert("입력하세요");
  if(users[id]) return alert("이미 존재하는 아이디");
  users[id] = pw;
  saveData();
  alert("회원가입 완료!");
}

function login(){
  const id = loginId.value.trim();
  const pw = loginPw.value.trim();
  if(users[id] && users[id] === pw){
    currentUser = id;
    localStorage.setItem("currentUser", id);
    alert("로그인 완료!");
    showDiary();
  } else alert("로그인 실패");
}

function logout(){
  localStorage.removeItem("currentUser");
  location.reload();
}

function showDiary(){
  authBox.classList.add("hidden");
  diaryBox.classList.remove("hidden");
  if(groups.length===0){
    groups.push("기본그룹");
    saveData();
  }
  updateGroupSelect();
  renderPosts();
}

function addGroup(){
  const g = newGroup.value.trim();
  if(!g) return;
  if(!groups.includes(g)) groups.push(g);
  saveData();
  updateGroupSelect();
  groupSelect.value = g;
  newGroup.value="";
  renderPosts();
}

function updateGroupSelect(){
  const sel = groupSelect;
  sel.innerHTML="";
  groups.forEach(g=>{
    sel.innerHTML += `<option value="${g}">${g}</option>`;
  });
}

function addPost(){
  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();
  const group = groupSelect.value;
  if(!title || !content) return alert("입력하세요");
  posts.push({title, content, user: currentUser, group});
  saveData();
  renderPosts();
}

function renderPosts(){
  const group = groupSelect.value;
  postsDiv.innerHTML="";
  posts.forEach((p,i)=>{
    if(p.user===currentUser && p.group===group){
      postsDiv.innerHTML += `
        <div class="card">
          <b>${p.title}</b><br>${p.content}<br>
          <button onclick="deletePost(${i})">삭제</button>
        </div>`;
    }
  });
}

function deletePost(i){
  posts.splice(i,1);
  saveData();
  renderPosts();
}

if(currentUser) showDiary();
</script>

</body>
</html>
