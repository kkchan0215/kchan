<html lang="ko">
<head>

<title>성경 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

*{box-sizing:border-box}
body{margin:0;background:#f3f5fa;color:#222b42;font-family:'Gowun Dodum',sans-serif}

header h1{font-size:29px;margin:0}
header p{opacity:.9;margin:8px 0 0}
main{max-width:700px;margin:22px auto;padding:0 14px}
.card{background:white;border-radius:22px;padding:23px;margin-bottom:16px;box-shadow:0 6px 25px #1c2c5010}
h2{margin-top:0}
.books{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.book{border:2px solid #e8eaf2;border-radius:16px;padding:20px 8px;text-align:center;background:white;font-family:inherit;cursor:pointer}
.book b{font-size:21px;display:block}
.book.selected{border-color:#5066cb;background:#f1f3ff;color:#344ba8}
button{font-family:inherit;font-size:16px;font-weight:bold;border:0;border-radius:13px;padding:14px;cursor:pointer}
.primary{background:#465dc4;color:white}
.light{background:#edf0fb;color:#4054ad}
.full{width:100%;margin-top:12px}
.info{font-size:13px;color:#858ca0}
.progress{height:8px;background:#edf0f6;border-radius:20px;overflow:hidden;margin:15px 0}
.progress div{height:100%;background:#5369ce;width:0;transition:.3s}
.question{font-size:21px;line-height:1.65;margin:25px 0}
input{width:100%;padding:16px;border:2px solid #e4e7f0;border-radius:13px;font:17px 'Gowun Dodum';outline:none}
input:focus{border-color:#5268ce}
.actions{display:flex;gap:10px;margin-top:12px}
.actions button{flex:1}
.hidden{display:none}
.tag{display:inline-block;background:#eef1ff;color:#4359bd;padding:5px 11px;border-radius:20px;font-size:13px}
.score{font-size:43px;color:#455dc4;font-weight:bold;text-align:center}
.review{border-bottom:1px solid #eee;padding:13px 0}
.good{color:#19845a}.bad{color:#d34b58}
</style>
</head>

<header>
<h1>성경 퀴즈</h1>
<p>말씀을 기억하고 직접 풀어보세요</p>
</header>
<main>
<section class="card" id="home">
<h2>① 성경 선택</h2>
<div class="books">
<button class="book selected" onclick="pickBook('사도행전',this)"><b>사도행전</b><small>50문제</small></button>
<button class="book" onclick="pickBook('마태복음',this)"><b>마태복음</b><small>50문제</small></button>
</div>
<p class="info">② 쉬움·보통·어려움 문제가 무작위로 섞여 출제됩니다.</p>
<button class="primary full" onclick="start()">퀴즈 시작하기 →</button>
</section>

<section class="card hidden" id="quiz">
<div style="display:flex;justify-content:space-between;align-items:center">
<span class="tag" id="level"></span>
<span class="info" id="count"></span>
</div>
<div class="progress"><div id="bar"></div></div>
<div class="question" id="question"></div>
<input id="answer" placeholder="정답을 입력하세요" autocomplete="off">
<div class="actions">
<button class="light" onclick="skip()">건너뛰기</button>
<button class="primary" onclick="check()">정답 확인</button>
</div>
<p class="info" id="feedback"></p>
</section>

<section class="card hidden" id="result">
<h2 style="text-align:center">퀴즈 완료!</h2>
<div class="score" id="score"></div>
<p id="summary" style="text-align:center"></p>
<button class="primary full" onclick="review()">채점 결과 보기</button>
<button class="light full" onclick="location.reload()">처음으로</button>
</section>

<section class="card hidden" id="reviews">
<h2>채점 결과</h2>
<div id="reviewList"></div>
<button class="primary full" onclick="location.reload()">처음으로</button>
</section>
</main>

["예수님이 세례를 받으실 때 하늘에서 들린 말씀은 누구의 음성이었나요?",["하나님의 음성","아버지의 음성"]],

]),
...make("어려움",[
["마태복음 1장에서 예수님의 이름을 임마누엘이라고 부른다는 예언은 누구를 통해 주어졌나요?","이사야"],
["동방박사들이 예루살렘에 와서 찾은 분은 누구인가요?",["유대인의 왕으로 나신 이","유대인의 왕"]],
["예수님이 광야에서 첫 번째 시험을 받으실 때 돌을 무엇으로 만들라는 유혹을 받으셨나요?",["떡","빵"]],
["예수님이 광야에서 성전 꼭대기에서 뛰어내리라는 시험을 받을 때 인용하신 말씀은 무엇을 하지 말라는 것이었나요?",["주 너의 하나님을 시험하지 말라","하나님을 시험하지 말라"]],

["예수님께서 비유로 말씀하신 열 처녀 중 슬기로운 처녀는 몇 명인가요?",["다섯","5명"]],
["달란트 비유에서 한 달란트를 받은 종은 그 돈을 어떻게 했나요?",["땅에 감추었다","땅에 묻었다"]],
["마태복음에서 예수님은 마지막 심판 때 양과 염소를 무엇으로 구분하신다고 말씀하셨나요?",["오른편과 왼편","오른쪽과 왼쪽"]]
])]
};

let book="사도행전",questions=[],pos=0,records=[],locked=false;
function pickBook(name,el){
 book=name;
 document.querySelectorAll(".book").forEach(b=>b.classList.remove("selected"));
 el.classList.add("selected");
}
function shuffle(arr){
 let a=[...arr];
 for(let i=a.length-1;i>0;i--){
 let j=Math.floor(Math.random()*(i+1));
 [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function start(){
 questions=shuffle(bank[book]);
 pos=0;records=[];locked=false;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("reviews").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 show();
}
function show(){
 locked=false;
 let q=questions[pos];
 document.getElementById("level").textContent=q.level+" 난이도 · "+book;
 document.getElementById("count").textContent=(pos+1)+" / "+questions.length;
 document.getElementById("bar").style.width=(pos/questions.length*100)+"%";
 document.getElementById("question").textContent=(pos+1)+". "+q.q;
 document.getElementById("answer").value="";
 document.getElementById("answer").disabled=false;
 document.getElementById("feedback").textContent="";
 document.getElementById("answer").focus();
}
function norm(s){
 return s.toLowerCase().replace(/\s/g,"").replace(/[.,!?·~'"]/g,"");
}
function check(){
 if(locked)return;
 let input=document.getElementById("answer").value.trim();
 if(!input){document.getElementById("feedback").textContent="답을 입력해 주세요.";return}
 let q=questions[pos],n=norm(input);
 let ok=q.a.some(a=>norm(a)===n);
 records.push({q:q.q,input,ok,answer:q.a[0]});
 locked=true;
 document.getElementById("answer").disabled=true;
 document.getElementById("feedback").innerHTML=ok?
 '<span class="good">정답입니다!</span>':
 '<span class="bad">아쉬워요. 정답: '+q.a[0]+'</span>';
 setTimeout(next,1000);
}
function skip(){
 if(locked)return;
 let q=questions[pos];
 records.push({q:q.q,input:"건너뜀",ok:false,answer:q.a[0]});
 locked=true;
 document.getElementById("answer").disabled=true;
 document.getElementById("feedback").innerHTML='<span class="bad">정답: '+q.a[0]+'</span>';
 setTimeout(next,1000);
}
function next(){
 pos++;
 if(pos>=questions.length){finish();return}
 show();
}
function finish(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 let correct=records.filter(x=>x.ok).length;
 document.getElementById("score").textContent=correct+" / "+questions.length;
 document.getElementById("summary").textContent=book+" · 정답률 "+Math.round(correct/questions.length*100)+"%";
}
function review(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("reviews").classList.remove("hidden");
 let wrong=records.filter(x=>!x.ok);
 document.getElementById("reviewList").innerHTML=wrong.length?
 wrong.map((x,i)=>`<div class="review">
 <b>${i+1}. ${x.q}</b>
 <p class="bad">내 답: ${x.input}</p>
 <p class="good">정답: ${x.answer}</p>
 </div>`).join(""):"<p class='good'>모든 문제를 맞혔어요!</p>";
}
document.getElementById("answer").addEventListener("keydown",e=>{
 if(e.key==="Enter")check();
});
</script>
