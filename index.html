<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>나만의 일기장</title>
<style>
body{font-family:sans-serif;background:#f3e5f5;color:#4a148c;padding:20px}
button{background:#8e24aa;color:white;border:none;padding:6px 12px;border-radius:5px;margin-top:5px;cursor:pointer}
input,textarea{width:100%;padding:6px;margin:5px 0;border:1px solid #ce93d8;border-radius:4px}
.hidden{display:none}
.groupBox{display:inline-block;background:#ce93d8;color:white;padding:10px 15px;border-radius:8px;margin:5px;cursor:pointer}
.groupBox.active{background:#6a1b9a}
.card{background:#f8eafc;border:1px solid #ce93d8;padding:10px;margin:10px 0;border-radius:6px;cursor:pointer}
.modalBg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);justify-content:center;align-items:center}
.modalBox{background:#f8eafc;padding:20px;width:300px;border-radius:10px;position:relative}
.menu{position:absolute;right:10px;top:10px;cursor:pointer;font-weight:bold}
.deleteMenu{display:none;margin-top:10px}
</style>
</head>
<body>

<h1>💜 나만의 일기장 💜</h1>

<div id="authBox">
  <input id="loginId" placeholder="아이디">
  <input id="loginPw" type="password" placeholder="비밀번호">
  <button id="loginBtn">로그인</button>
  <input id="joinId" placeholder="아이디">
  <input id="joinPw" type="password" placeholder="비밀번호">
  <button id="joinBtn">회원가입</button>
</div>

<div id="diaryBox" class="hidden">
  <button id="logoutBtn">로그아웃</button>
  <input id="newGroup" placeholder="새 그룹 이름">
  <button id="addGroupBtn">그룹 생성</button>
  <button id="deleteGroupBtn">현재 그룹 삭제</button>
  <div id="groupArea"></div>

  <input id="title" placeholder="제목">
  <textarea id="content" rows="4" placeholder="내용"></textarea>
  <button id="savePostBtn">저장</button>

  <h3>내 글 목록</h3>
  <div id="posts"></div>
</div>

<div id="modalBg" class="modalBg">
  <div class="modalBox">
    <span class="menu" id="menuBtn">⋮</span>
    <h2 id="modalTitle"></h2>
    <p id="modalContent"></p>
    <div id="deleteMenu" class="deleteMenu">
      <button id="deleteBtn">삭제</button>
    </div>
    <button id="closeBtn">닫기</button>
  </div>
</div>

<script>
const loginBtn=document.getElementById("loginBtn");
const joinBtn=document.getElementById("joinBtn");
const logoutBtn=document.getElementById("logoutBtn");
const addGroupBtn=document.getElementById("addGroupBtn");
const deleteGroupBtn=document.getElementById("deleteGroupBtn");
const savePostBtn=document.getElementById("savePostBtn");
const postsDiv=document.getElementById("posts");
const groupArea=document.getElementById("groupArea");
const modalBg=document.getElementById("modalBg");
const modalTitle=document.getElementById("modalTitle");
const modalContent=document.getElementById("modalContent");
const deleteMenu=document.getElementById("deleteMenu");
const menuBtn=document.getElementById("menuBtn");
const deleteBtn=document.getElementById("deleteBtn");
const closeBtn=document.getElementById("closeBtn");

let users=JSON.parse(localStorage.getItem("users")||"{}");
let posts=JSON.parse(localStorage.getItem("posts")||"[]");
let groups=JSON.parse(localStorage.getItem("groups")||"{}");
let currentUser=localStorage.getItem("currentUser");
let currentGroup=null;
let currentPostIndex=null;

function saveAll(){
localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("posts",JSON.stringify(posts));
localStorage.setItem("groups",JSON.stringify(groups));
}

function renderGroups(){
groupArea.innerHTML="";
if(!groups[currentUser]) groups[currentUser]=["기본그룹"];
groups[currentUser].forEach(g=>{
const box=document.createElement("div");
box.className="groupBox"+(g===currentGroup?" active":"");
box.textContent=g;
box.onclick=()=>{currentGroup=g;renderGroups();renderPosts();};
groupArea.appendChild(box);
});
if(!currentGroup) currentGroup=groups[currentUser][0];
}

function renderPosts(){
postsDiv.innerHTML="";
posts.forEach((p,i)=>{
if(p.user===currentUser && p.group===currentGroup){
const div=document.createElement("div");
div.className="card";
div.textContent=p.title;
div.onclick=()=>openModal(i);
postsDiv.appendChild(div);
}
});
}

function openModal(i){
const p=posts[i];
currentPostIndex=i;
modalTitle.textContent=p.title;
modalContent.textContent=p.content;
modalBg.style.display="flex";
}

function closeModal(){modalBg.style.display="none";deleteMenu.style.display="none";}
menuBtn.onclick=()=>deleteMenu.style.display=deleteMenu.style.display==="block"?"none":"block";
deleteBtn.onclick=()=>{posts.splice(currentPostIndex,1);saveAll();closeModal();renderPosts();}
closeBtn.onclick=closeModal;

joinBtn.onclick=()=>{
if(!joinId.value||!joinPw.value) return alert("입력하세요");
if(users[joinId.value]) return alert("이미 존재");
users[joinId.value]=joinPw.value;saveAll();alert("회원가입 완료!");
};

loginBtn.onclick=()=>{
if(users[loginId.value]===loginPw.value){
currentUser=loginId.value;localStorage.setItem("currentUser",currentUser);
alert("로그인 완료!");showDiary();
}else alert("로그인 실패");
};

logoutBtn.onclick=()=>{localStorage.removeItem("currentUser");location.reload();};

addGroupBtn.onclick=()=>{
if(newGroup.value&&!groups[currentUser].includes(newGroup.value)){
groups[currentUser].push(newGroup.value);saveAll();renderGroups();
}
};

deleteGroupBtn.onclick=()=>{
if(currentGroup==="기본그룹") return alert("기본그룹은 삭제 불가");
groups[currentUser]=groups[currentUser].filter(g=>g!==currentGroup);
posts=posts.filter(p=>!(p.user===currentUser&&p.group===currentGroup));
currentGroup=groups[currentUser][0];
saveAll();renderGroups();renderPosts();
};

savePostBtn.onclick=()=>{
if(!title.value||!content.value) return alert("입력하세요");
posts.push({title:title.value,content:content.value,user:currentUser,group:currentGroup});
saveAll();renderPosts();
};

function showDiary(){
authBox.classList.add("hidden");
diaryBox.classList.remove("hidden");
renderGroups();renderPosts();
}

if(currentUser) showDiary();
</script>
</body>
</html>
