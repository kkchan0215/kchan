<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON COAST — ULTIMATE CITY</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#030814;color:#eafaff;font-family:Arial,"Malgun Gothic",sans-serif}
canvas{display:block}
#start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#174b70,#071525 55%,#020711)}
#start section{text-align:center;padding:35px}
#start h1{font-size:clamp(38px,7vw,76px);letter-spacing:10px;margin:0;color:#e8fbff;text-shadow:0 0 15px #42dfff,0 0 45px #168dff,0 0 90px #168dff}
#start p{color:#b4d9ec;line-height:2;letter-spacing:2px}
button{cursor:pointer;color:#eafaff;background:#102d47;border:1px solid #3a9bc8;border-radius:9px;padding:10px 14px}
button:hover{background:#17628b;box-shadow:0 0 15px #21cfff}
#enter{margin-top:18px;padding:16px 44px;background:linear-gradient(110deg,#087cae,#55d8f1);border:0;font-size:16px;box-shadow:0 0 30px #159bdb}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#06182bdc;border:1px solid #4dcbff66;border-radius:13px;backdrop-filter:blur(10px);box-shadow:0 8px 30px #0008,0 0 18px #008bd522}
#brand{position:absolute;top:16px;left:16px;padding:13px 17px}
#brand b{letter-spacing:3px;color:#a7efff;text-shadow:0 0 12px #19bfff}
#brand small{display:block;color:#7395b2;margin-top:4px;font-size:10px;letter-spacing:2px}
#info{position:absolute;top:16px;right:16px;padding:12px 15px;text-align:right;font-size:12px;color:#9bbbd4}
#info strong{color:#fff;font-size:15px}
#help{position:absolute;bottom:16px;left:16px;padding:12px 15px;font-size:12px;line-height:1.8;color:#b1cce0}
#cross{position:absolute;left:50%;top:50%;width:7px;height:7px;border:1px solid #e8fcff;border-radius:50%;transform:translate(-50%,-50%)}
#notice{position:absolute;top:82px;left:50%;transform:translateX(-50%);padding:10px 16px;display:none}
#lift{position:fixed;z-index:20;right:clamp(10px,2vw,24px);top:50%;transform:translateY(-50%);width:min(280px,calc(100vw - 24px));max-height:calc(100dvh - 28px);overflow:hidden;padding:15px;display:none;pointer-events:auto}
#lift h3{margin:0;color:#9deaff}
#lift p{font-size:12px;color:#9bb8d1}
#floors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-height:min(42dvh,420px);overflow-y:auto;overflow-x:hidden;padding:2px}
#liftClose{width:100%;margin-top:10px;flex:0 0 auto}
@media(max-width:600px){
 #lift{right:10px;width:min(260px,calc(100vw - 20px));padding:12px}
 #floors{grid-template-columns:repeat(4,minmax(0,1fr));max-height:38dvh}
}
#viewLabel{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:9px 15px;display:none;color:#baf1ff;letter-spacing:2px}
#unlock{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);padding:12px 18px;display:none;font-size:12px}
#quality{position:absolute;right:16px;bottom:16px;padding:8px 12px;font-size:11px;color:#9ecce2}
</style>
</head>
<body>

<div id="start">
<section>
<h1>NEON COAST</h1>
<p>THE CITY OF LIGHT<br>미래 도시의 가장 높은 곳을 탐험하세요.</p>
<button id="enter">도시 입장하기</button>
</section>
</div>

<div id="hud">
<div id="brand" class="panel"><b>NEON COAST</b><small>FUTURE CITY · REAL LIGHT EDITION</small></div>
<div id="info" class="panel">현재 위치<br><strong id="pos">CITY PLAZA</strong></div>
<div id="help" class="panel">WASD 이동 · 마우스 시점<br>SPACE 점프 · SHIFT 달리기<br>E 엘리베이터 · ESC 마우스 해제</div>
<div id="cross"></div>
<div id="notice" class="panel"></div>
<div id="viewLabel" class="panel">JAVE TOWER · SKY OBSERVATORY</div>
<div id="unlock" class="panel">화면을 클릭하면 다시 조작</div>
<div id="quality" class="panel">OPTIMIZED RENDER</div>
<div id="lift" class="panel">
<h3 id="liftName">ELEVATOR</h3>
<p id="liftDesc">이동할 층을 선택하세요.</p>
<div id="floors"></div>
<button id="liftClose">엘리베이터에서 내리기</button>
</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030914);
scene.fog=new THREE.FogExp2(0x102b43,.00012);

const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,9000);
camera.position.set(0,1.7,150);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance",
 stencil:false,
 depth:true
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,.85));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.9;
renderer.shadowMap.enabled=false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc9edff,0x24364a,3.2));
const sun=new THREE.DirectionalLight(0xb9e7ff,2.1);
sun.position.set(-300,800,300);
scene.add(sun);
const cityFill=new THREE.PointLight(0x55bfff,1800,1800);
cityFill.position.set(0,260,150);
scene.add(cityFill);
const towerFill=new THREE.PointLight(0x3acfff,2400,1250);
towerFill.position.set(0,1450,0);
scene.add(towerFill);

const mat=(c,e=0,r=.35,m=.5)=>new THREE.MeshStandardMaterial({
 color:c,emissive:c,emissiveIntensity:e,roughness:r,metalness:m
});
const dark=mat(0x101d2c,.12,.42,.8);
const cyan=mat(0x27dfff,1.65,.3,.7);
const ice=mat(0xa6f2ff,1.45,.28,.72);
const gold=mat(0xffd58c,1.7,.3,.65);
const pink=mat(0xff62db,1.35,.3,.65);
const blue=mat(0x168dff,1.2,.35,.6);
const glass=new THREE.MeshPhysicalMaterial({
 color:0x387da0,metalness:.45,roughness:.12,
 transparent:true,opacity:.34,side:THREE.DoubleSide,
 depthWrite:false
});

function box(w,h,d,material,x=0,y=0,z=0,parent=scene){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}
function cylinder(rt,rb,h,material,x,y,z,parent=scene,segments=24){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),material);
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}
function gradientWall(w,h,d,x,y,z,parent){
 const m=new THREE.Mesh(makeGradientGeometry(w,h,d),gradientMaterial);
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}
function torus(parent,r,y,t,material){
 const m=new THREE.Mesh(new THREE.TorusGeometry(r,t,8,72),material);
 m.rotation.x=Math.PI/2;
 m.position.y=y;
 parent.add(m);
 return m;
}

// 지면
const ground=box(5000,2,5000,mat(0x07111d),0,-1,0);
const roadMat=mat(0x1b3043,.28,.8,.2);

for(let i=-4;i<=4;i++){
 box(32,.12,2400,roadMat,i*260,.05,0);
 box(2400,.12,32,roadMat,0,.06,i*260);
 box(.3,.08,2400,cyan,i*260-15,.14,0);
 box(2400,.08,.3,cyan,0,.15,i*260-15);
}

// 별
{
 const n=260;
 const p=new Float32Array(n*3);
 for(let i=0;i<n;i++){
  p[i*3]=(Math.random()-.5)*4400;
  p[i*3+1]=250+Math.random()*1000;
  p[i*3+2]=(Math.random()-.5)*4400;
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute("position",new THREE.BufferAttribute(p,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({
  color:0xa8dcff,size:2.1,sizeAttenuation:true
 })));
}

// 건물 외벽 그라데이션
function makeGradientGeometry(w,h,d){
 const g=new THREE.BoxGeometry(w,h,d);
 const p=g.attributes.position;
 const colors=[];
 const low=new THREE.Color(0x13cfff);
 const mid=new THREE.Color(0x2465ff);
 const high=new THREE.Color(0xa72cff);
 const top=new THREE.Color(0xffbd62);

 for(let i=0;i<p.count;i++){
  const t=THREE.MathUtils.clamp((p.getY(i)+h/2)/h,0,1);
  const c=t<.36?low.clone().lerp(mid,t/.36):
   t<.76?mid.clone().lerp(high,(t-.36)/.4):
   high.clone().lerp(top,(t-.76)/.24);
  colors.push(c.r,c.g,c.b);
 }
 g.setAttribute("color",new THREE.Float32BufferAttribute(colors,3));
 return g;
}

const gradientMaterial=new THREE.MeshStandardMaterial({
 color:0x080d17,
 vertexColors:false,
 emissive:0x020711,
 emissiveIntensity:.12,
 metalness:.82,
 roughness:.28,
 side:THREE.DoubleSide
});

const facadeMaterial=new THREE.MeshStandardMaterial({
 color:0xffffff,
 vertexColors:true,
 emissive:0x173b70,
 emissiveIntensity:2.0,
 metalness:.68,
 roughness:.18,
 side:THREE.DoubleSide
});

const buildings=[];
const floors=[];
const FLOOR_CELL=64;
const floorGrid=new Map();

function key(ix,iz){return ix+","+iz;}

// 바닥 인스턴스
const floorGeometry=new THREE.BoxGeometry(1,.2,1);
const floorMaterial=mat(0x31566e,.55,.35,.65);
const MAX_FLOORS=18000;
const floorInstances=new THREE.InstancedMesh(
 floorGeometry,floorMaterial,MAX_FLOORS
);
floorInstances.count=0;
scene.add(floorInstances);
const dummy=new THREE.Object3D();
let floorInstanceCount=0;

function addFloor(x,z,w,d,topY){
 const f={x,z,w,d,y:topY};
 floors.push(f);

 const x0=Math.floor((x-w/2)/FLOOR_CELL);
 const x1=Math.floor((x+w/2)/FLOOR_CELL);
 const z0=Math.floor((z-d/2)/FLOOR_CELL);
 const z1=Math.floor((z+d/2)/FLOOR_CELL);

 for(let ix=x0;ix<=x1;ix++){
  for(let iz=z0;iz<=z1;iz++){
   const k=key(ix,iz);
   let list=floorGrid.get(k);
   if(!list)floorGrid.set(k,list=[]);
   list.push(f);
  }
 }

 if(floorInstanceCount<MAX_FLOORS){
  dummy.position.set(x,topY-.1,z);
  dummy.scale.set(w,1,d);
  dummy.updateMatrix();
  floorInstances.setMatrixAt(floorInstanceCount++,dummy.matrix);
 }
}

function addCollisionFloor(x,z,w,d,topY){
 const f={x,z,w,d,y:topY};
 floors.push(f);
 const x0=Math.floor((x-w/2)/FLOOR_CELL);
 const x1=Math.floor((x+w/2)/FLOOR_CELL);
 const z0=Math.floor((z-d/2)/FLOOR_CELL);
 const z1=Math.floor((z+d/2)/FLOOR_CELL);
 for(let ix=x0;ix<=x1;ix++){
  for(let iz=z0;iz<=z1;iz++){
   const k=key(ix,iz);
   let list=floorGrid.get(k);
   if(!list)floorGrid.set(k,list=[]);
   list.push(f);
  }
 }
}
function finishFloors(){
 floorInstances.count=floorInstanceCount;
 floorInstances.instanceMatrix.needsUpdate=true;
}

// 반복 창문
const windowGeo=new THREE.BoxGeometry(1,1,1);
const windowMeshes={
 ice:new THREE.InstancedMesh(windowGeo,ice,16000),
 cyan:new THREE.InstancedMesh(windowGeo,cyan,16000),
 gold:new THREE.InstancedMesh(windowGeo,gold,5000)
};
const windowCounts={ice:0,cyan:0,gold:0};

for(const m of Object.values(windowMeshes))scene.add(m);

function addWindow(type,x,y,z,w,h,d){
 const m=windowMeshes[type];
 const i=windowCounts[type];
 if(i>=m.instanceMatrix.count)return;
 dummy.position.set(x,y,z);
 dummy.scale.set(w,h,d);
 dummy.updateMatrix();
 m.setMatrixAt(i,dummy.matrix);
 windowCounts[type]++;
}

// 건물 70개
function createBuilding(i,x,z,w,d,h){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);

 const wall=.9, doorW=6.4, doorH=4.2;

 gradientWall(w,h,wall,0,h/2,-d/2,g);
 gradientWall(wall,h,d,w/2,h/2,0,g);
 gradientWall(wall,h,d,-w/2,h/2,0,g);
 gradientWall((w-doorW)/2,h,wall,-(w+doorW)/4,h/2,d/2,g);
 gradientWall((w-doorW)/2,h,wall,(w+doorW)/4,h/2,d/2,g);
 gradientWall(doorW,h-doorH,wall,0,(h+doorH)/2,d/2,g);

 box(w*.32,h*.94,.16,dark,-w*.33,h/2,d/2+.08,g);
 box(w*.32,h*.94,.16,dark,w*.33,h/2,d/2+.08,g);
 box(.16,h*.94,d*.86,dark,w/2+.08,h/2,0,g);
 box(.16,h*.94,d*.86,dark,-w/2-.08,h/2,0,g);

 box(.22,doorH,.28,cyan,-doorW/2,h/2,d/2+.22,g);
 box(.22,doorH,.28,ice,doorW/2,h/2,d/2+.22,g);
 box(doorW,.22,.28,gold,0,doorH,d/2+.22,g);

 // 모서리 네온 라인
 for(const sx of [-1,1]){
  for(const sz of [-1,1]){
   box(.075,h+.5,.075,mat(0x7cbbd0,.48,.4,.65),sx*(w/2-.25),h/2,sz*(d/2-.25),g);
  }
 }

 // 층별 창문
 const count=Math.max(12,Math.floor(h/5));
 const fh=h/count;

 for(let f=1;f<count;f++){
  const y=f*fh;
  addWindow(f%5===0?"gold":"ice",x,y,z+d/2+.2,w*.67,.14,.2);
  addWindow("cyan",x-w*.39,y,z+d/2+.2,.12,.12,.2);
  addWindow("cyan",x+w*.39,y,z+d/2+.2,.12,.12,.2);
 }

 // 수평 발광 띠
 box(w+.25,.075,.12,mat(0x6eb5c8,.8,.38,.65),0,h*.28,d/2+.12,g);
 box(w+.25,.06,.12,mat(0x9b78bb,.65,.4,.62),0,h*.68,d/2+.12,g);
 box(w+.25,.08,.12,mat(0xd0b78e,.7,.38,.65),0,h,d/2+.12,g);

 // 지붕
 box(w+1,.5,d+1,dark,0,h+.25,0,g);
 torus(g,Math.max(w,d)*.52,h+.55,.08,mat(0x73b9cb,.7,.4,.65));

 // 내부 층 바닥
 for(let f=0;f<count;f++){
  addFloor(x,z,w-1.3,d-1.3,f*fh);
  if(f>0 && f%3===0){
   box(w*.55,.10,.16,f%2?cyan:gold,0,f*fh-.18,0,g);
  }
 }

 // 엘리베이터 샤프트
 const sx=w/2+2.5;
 box(4,h+1,4,glass,sx,h/2,0,g);
 box(.2,h+1,.2,cyan,sx-2,h/2,0,g);
 box(.2,h+1,.2,cyan,sx+2,h/2,0,g);

 const cabin=new THREE.Group();
 g.add(cabin);
 box(3.1,3.3,3.1,mat(0x14516d,1),0,0,0,cabin);
 box(3.3,.12,3.3,cyan,0,-1.65,0,cabin);
 box(3.3,.12,3.3,ice,0,1.65,0,cabin);
 cabin.position.set(sx,1.8,0);

 for(let f=0;f<count;f++){
  addFloor(x+sx,z,5,5,f*fh);
 }

 buildings.push({
  x,z,w,d,h,count,fh,sx,cabin,g,
  name:"SKY "+String(i+1).padStart(2,"0")
 });
}

for(let i=0;i<70;i++){
 const band=Math.floor(i/10);
 const slot=i%10;
 const a=slot*(Math.PI*2/10)+band*.105;
 const r=270+band*105;
 const x=Math.cos(a)*r;
 const z=Math.sin(a)*r;

 createBuilding(
  i,x,z,
  23+(i%4)*2,
  23+(i%3)*2,
  230+(i%9)*35
 );
}

// 제이브 타워
const JH=3960,JB=132,JD=96;
const jave=new THREE.Group();
scene.add(jave);

function javeWidth(y){
 const t=THREE.MathUtils.clamp(y/JH,0,1);
 return JB*(1-Math.pow(t,1.18)*.986);
}

{
 const positions=[];
 const colors=[];
 const indices=[];
 const N=120;

 const c1=new THREE.Color(0x32106f);
 const c2=new THREE.Color(0x7024d6);
 const c3=new THREE.Color(0xc13cff);
 const c4=new THREE.Color(0xff9cf5);

 for(let i=0;i<=N;i++){
  const t=i/N;
  const y=t*JH;
  const w=javeWidth(y);
  const d=JD*(w/JB);

  const c=t<.35?c1.clone().lerp(c2,t/.35):
   t<.75?c2.clone().lerp(c3,(t-.35)/.4):
   c3.clone().lerp(c4,(t-.75)/.25);

  for(const p of [
   [-w/2,y,-d/2],[w/2,y,-d/2],
   [w/2,y,d/2],[-w/2,y,d/2]
  ]){
   positions.push(...p);
   colors.push(c.r,c.g,c.b);
  }
 }

 for(let i=0;i<N;i++){
  for(let s=0;s<4;s++){
   const a=i*4+s;
   const b=i*4+(s+1)%4;
   const c=(i+1)*4+(s+1)%4;
   const d=(i+1)*4+s;
   indices.push(a,b,d,b,c,d);
  }
 }

 const geo=new THREE.BufferGeometry();
 geo.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
 geo.setAttribute("color",new THREE.Float32BufferAttribute(colors,3));
 geo.setIndex(indices);
 geo.computeVertexNormals();

 const material=new THREE.MeshStandardMaterial({
  color:0xffffff,
  vertexColors:true,
  emissive:0x8a20d8,
  emissiveIntensity:3.1,
  metalness:.72,
  roughness:.1,
  transparent:false,
  opacity:1,
  depthWrite:true,
  side:THREE.DoubleSide
 });

 jave.add(new THREE.Mesh(geo,material));
}

// 타워 수직 발광선
for(let side=0;side<4;side++){
 const pts=[];
 for(let i=0;i<=100;i++){
  const t=i/100;
  const y=t*JH;
  const w=javeWidth(y);
  const d=JD*w/JB;
  const x=side===0?-w/2-1:side===1?w/2+1:0;
  const z=side===2?-d/2-1:side===3?d/2+1:0;
  pts.push(new THREE.Vector3(x,y,z));
 }

 const curve=new THREE.CatmullRomCurve3(pts);
 jave.add(new THREE.Mesh(
  new THREE.TubeGeometry(curve,180,1.45,6,false),mat(0xd34cff,7)
 ));
 jave.add(new THREE.Mesh(
  new THREE.TubeGeometry(curve,180,.5,6,false),mat(0xffa8ff,6)
 ));
}

// 지상 출입구 네온 게이트
const javeGate=new THREE.Group();
jave.add(javeGate);
javeGate.position.set(0,0,JD/2+1.2);
box(3,22,2,cyan,-18,11,0,javeGate);
box(3,22,2,ice,18,11,0,javeGate);
box(39,3,2,gold,0,22,0,javeGate);
box(31,.35,1.2,pink,0,2,0,javeGate);
const gateGlow=new THREE.PointLight(0x39dfff,85,150);
gateGlow.position.set(0,13,JD/2+15);
scene.add(gateGlow);

// 타워 층별 발판
const JFLOORS=880;
for(let f=0;f<JFLOORS;f++){
 const y=f*4.5;
 const w=javeWidth(y);
 const d=JD*w/JB;
 if(w>7&&d>7)addFloor(0,0,w-3,d-3,y);
}

// 타워 엘리베이터
const railPoints=[];
for(let i=0;i<=100;i++){
 const y=JH*i/100;
 railPoints.push(new THREE.Vector3(
  javeWidth(y)/2+3,y,JD*.15
 ));
}
const railCurve=new THREE.CatmullRomCurve3(railPoints);
jave.add(new THREE.Mesh(
 new THREE.TubeGeometry(railCurve,200,2.1,8,false),glass
));
jave.add(new THREE.Mesh(
 new THREE.TubeGeometry(railCurve,200,.55,8,false),cyan
));

const javeCabin=new THREE.Group();
jave.add(javeCabin);
javeCabin.position.set(javeWidth(0)/2+3,0,JD*.15);
box(5,5,5,mat(0x155a80,3),0,0,0,javeCabin);
box(5.3,.15,5.3,cyan,0,-2.5,0,javeCabin);
box(5.3,.15,5.3,gold,0,2.5,0,javeCabin);

// 전망대
const topY=JH-55;
const observatory=new THREE.Group();
observatory.position.y=topY;
jave.add(observatory);

torus(observatory,112,0,.9,cyan);
torus(observatory,72,-.5,.55,gold);

const skyGlass=new THREE.Mesh(
 new THREE.CylinderGeometry(124,124,.3,112),
 new THREE.MeshPhysicalMaterial({
  color:0xb9efff,
  metalness:.08,
  roughness:.025,
  transparent:true,
  opacity:.19,
  transmission:.72,
  thickness:.35,
  clearcoat:1
 })
);
skyGlass.position.y=2.7;
observatory.add(skyGlass);

// 외부 전망 데크
const outerDeck=new THREE.Mesh(

 );

 pivot.add(cone);

 const core=new THREE.Mesh(
  new THREE.CylinderGeometry(.5,.7,length,6),
  new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8})
 );
 core.rotation.x=Math.PI/2;
 core.position.z=-length/2;
 pivot.add(core);

 beamPivots.push({pivot,phase});
}

// 바닥 충돌 탐색
function findFloor(previousY){
 const feetBefore=previousY-1.7;
 const feetNow=player.y-1.7;

 let best=0;

 if(feetBefore>=-.6&&feetNow<=.15){
  best=0;
 }

 const ix=Math.floor(player.x/FLOOR_CELL);
 const iz=Math.floor(player.z/FLOOR_CELL);
 const list=floorGrid.get(key(ix,iz));

 if(list){
  for(let i=0;i<list.length;i++){
   const f=list[i];

   if(
    Math.abs(player.x-f.x)<=f.w/2-.2&&
    Math.abs(player.z-f.z)<=f.d/2-.2&&
    feetBefore>=f.y-.5&&
    feetNow<=f.y+.15&&
    f.y>best
   ){
    best=f.y;
   }
  }
 }

 return best;
}

// 플레이어
const player={x:0,y:1.7,z:150};
const keys={};

let vy=0;
let onGround=true;
let yaw=0;
let pitch=0;
let locked=false;

let insideLift=false;
let activeLift=null;
let liftTarget=0;
let liftMoving=false;

function lockPointer(){
 renderer.domElement.requestPointerLock?.();
}
function unlockPointer(){
 if(document.pointerLockElement)document.exitPointerLock();
}

document.addEventListener("pointerlockchange",()=>{
 locked=document.pointerLockElement===renderer.domElement;
 $("unlock").style.display=locked?"none":"block";
});

document.addEventListener("mousemove",e=>{
 if(!locked||insideLift)return;
 yaw-=e.movementX*.002;
 pitch=THREE.MathUtils.clamp(pitch-e.movementY*.002,-1.4,1.4);
});

renderer.domElement.addEventListener("click",()=>{
 if(!locked&&!insideLift&&$("start").style.display==="none"){
  lockPointer();
 }
});

$("enter").onclick=()=>{
 $("start").style.display="none";
 lockPointer();
};

document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="Escape")unlockPointer();
 if(e.code==="KeyE"&&!insideLift)tryLift();
});

document.addEventListener("keyup",e=>{
 keys[e.code]=false;
});

function notify(msg){
 $("notice").textContent=msg;
 $("notice").style.display="block";
 clearTimeout(notify.timer);
 notify.timer=setTimeout(()=>$("notice").style.display="none",2000);
}

function nearestElevator(){
 let best=null;
 let dist=Infinity;

 for(const b of buildings){
  const x=b.x+b.sx;
  const z=b.z;
  const d=Math.hypot(player.x-x,player.z-z);
  if(d<dist){
   dist=d;
   best={type:"normal",b,x,z,dist:d};
  }
 }

 const y=THREE.MathUtils.clamp(player.y,0,JH);
 const x=javeWidth(y)/2+3;
 const z=JD*.15;
 const d=Math.hypot(player.x-x,player.z-z);

 if(d<dist){
  best={type:"jave",x,z,dist:d};
 }

 return best;
}

function tryLift(){
 const lift=nearestElevator();

 if(!lift||lift.dist>14){
  notify("엘리베이터 가까이에서 E를 누르세요");
  return;
 }

 activeLift=lift;
 insideLift=true;
 unlockPointer();

 $("lift").style.display="block";
 $("floors").innerHTML="";

 $("liftName").textContent=lift.type==="jave"
  ?"JAVE TOWER ELEVATOR"
  :lift.b.name+" ELEVATOR";

 $("liftDesc").textContent="이동할 층을 선택하세요.";

 const max=lift.type==="jave"?868:lift.b.count;
 const step=lift.type==="jave"?20:Math.max(1,Math.ceil(max/28));
 const stops=[];

 for(let f=0;f<=max;f+=step)stops.push(f);
 if(!stops.includes(max))stops.push(max);

 for(const f of stops){
  const button=document.createElement("button");
  button.textContent=f===0?"G":f+"F";
  button.onclick=()=>goFloor(f);
  $("floors").appendChild(button);
 }
}

function javeLiftY(f){
 return f>=868?topY+3.05:f*4.5;
}

function goFloor(f){
 if(!activeLift)return;
 liftTarget=f;
 liftMoving=true;
 $("liftDesc").textContent=f+"층으로 이동 중...";
}

function exitLift(){
 if(!activeLift)return;

 if(activeLift.type==="jave"){
  const y=javeLiftY(liftTarget);
  const w=javeWidth(y);

  if(liftTarget>=868){
   player.x=0;
   player.z=0;
   player.y=topY+4.84;
   $("viewLabel").style.display="block";
  }else{
   player.x=w/2-5;
   player.z=JD*.15;
   player.y=y+1.7;
   $("viewLabel").style.display="block";
  }
 }else{
  const b=activeLift.b;
  player.x=b.x+b.sx;
  player.z=b.z;
  player.y=liftTarget*b.fh+1.7;
  $("viewLabel").style.display="none";
 }

 vy=0;
 onGround=true;
 insideLift=false;
 liftMoving=false;
 activeLift=null;

 $("lift").style.display="none";
 notify("도착했습니다.");
}

$("liftClose").onclick=exitLift;

function updateLift(dt){
 if(!insideLift||!activeLift||!liftMoving)return;

 const current=activeLift.type==="jave"
  ?javeCabin.position.y
  :activeLift.b.cabin.position.y;

 const target=activeLift.type==="jave"
  ?javeLiftY(liftTarget)
  :liftTarget*activeLift.b.fh;

 const next=THREE.MathUtils.damp(current,target,1.5,dt);

 if(activeLift.type==="jave"){
  javeCabin.position.y=next;
  javeCabin.position.x=javeWidth(next)/2+3;
  javeCabin.position.z=JD*(javeWidth(next)/JB)*.15;
  player.x=javeCabin.position.x;
  player.z=javeCabin.position.z;
 }else{
  activeLift.b.cabin.position.y=next;
  player.x=activeLift.b.x+activeLift.b.sx;
  player.z=activeLift.b.z;
 }

 player.y=next+1.7;
 camera.position.set(player.x,player.y,player.z);

 if(Math.abs(next-target)<1.2){
  liftMoving=false;
  $("liftDesc").textContent="도착했습니다. 아래 버튼을 눌러 내리세요.";
 }
}

// 플레이어 이동
function updatePlayer(dt){
 if(insideLift)return;

 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 const previousY=player.y;

 const forward=new THREE.Vector3(
  -Math.sin(yaw),0,-Math.cos(yaw)
 );
 const right=new THREE.Vector3(
  Math.cos(yaw),0,-Math.sin(yaw)
 );

 const move=new THREE.Vector3();

 if(keys.KeyW)move.add(forward);
 if(keys.KeyS)move.sub(forward);
 if(keys.KeyD)move.add(right);
 if(keys.KeyA)move.sub(right);

 if(move.lengthSq()>0){
  move.normalize();
  move.multiplyScalar(
   (keys.ShiftLeft||keys.ShiftRight?32:18)*dt
  );
  player.x+=move.x;
  player.z+=move.z;
 }

 if(keys.Space&&onGround){
  vy=13;
  onGround=false;
 }

 vy-=29*dt;
 player.y+=vy*dt;

 const floor=findFloor(previousY);

 if(vy<=0&&player.y-1.7<=floor+.12){
  player.y=floor+1.7;
  vy=0;
  onGround=true;
 }else{
  onGround=false;
 }

 if(player.y<1.7){
  player.y=1.7;
  vy=0;
  onGround=true;
 }

 player.x=THREE.MathUtils.clamp(player.x,-2400,2400);
 player.z=THREE.MathUtils.clamp(player.z,-2400,2400);

 camera.position.set(player.x,player.y,player.z);

 const lift=nearestElevator();
 if(lift&&lift.dist<14&&!insideLift){
  $("notice").textContent="E 키를 눌러 엘리베이터 이용";
  $("notice").style.display="block";
 }else if(!insideLift){
  $("notice").style.display="none";
 }
}

// 폭죽
const particleCount=240;
const firePos=new Float32Array(particleCount*3);
const fireVel=new Float32Array(particleCount*3);
const fireLife=new Float32Array(particleCount);
const fireColor=new Float32Array(particleCount*3);

const fireGeo=new THREE.BufferGeometry();
fireGeo.setAttribute("position",new THREE.BufferAttribute(firePos,3));
fireGeo.setAttribute("color",new THREE.BufferAttribute(fireColor,3));

const firePoints=new THREE.Points(
 fireGeo,
 new THREE.PointsMaterial({
  size:4.5,vertexColors:true,transparent:true,
  opacity:.9,depthWrite:false
 })
);
scene.add(firePoints);

let fireIndex=0;

function burst(){
 const origin=[
  (Math.random()-.5)*35,
  JH+30+Math.random()*80,
  (Math.random()-.5)*35
 ];

 const color=new THREE.Color().setHSL(Math.random(),.9,.65);

 for(let n=0;n<32;n++){
  const i=(fireIndex++)%particleCount;
  const a=Math.random()*Math.PI*2;
  const u=Math.random()*2-1;
  const s=15+Math.random()*30;
  const q=Math.sqrt(1-u*u);

  firePos[i*3]=origin[0];
  firePos[i*3+1]=origin[1];
  firePos[i*3+2]=origin[2];

  fireVel[i*3]=Math.cos(a)*q*s;
  fireVel[i*3+1]=u*s;
  fireVel[i*3+2]=Math.sin(a)*q*s;

  fireLife[i]=1.5+Math.random();

  fireColor[i*3]=color.r;
  fireColor[i*3+1]=color.g;
  fireColor[i*3+2]=color.b;
 }
}

let burstTimer=0;
function updateFireworks(dt){
 burstTimer+=dt;
 if(burstTimer>2.8){
  burstTimer=0;
  burst();
 }

 for(let i=0;i<particleCount;i++){
  if(fireLife[i]<=0)continue;
  fireLife[i]-=dt;
  fireVel[i*3+1]-=10*dt;
  firePos[i*3]+=fireVel[i*3]*dt;
  firePos[i*3+1]+=fireVel[i*3+1]*dt;
  firePos[i*3+2]+=fireVel[i*3+2]*dt;
 }

 fireGeo.attributes.position.needsUpdate=true;
}

// 자동 렌더링 품질 조절
let lastFrame=0;
let frameSamples=0;
let sampleTime=0;
let adaptiveScale=Math.min(devicePixelRatio,.85);

const clock=new THREE.Clock();

function animate(now=0){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);
 const t=clock.elapsedTime;

 if(insideLift)updateLift(dt);
 else updatePlayer(dt);

 for(const b of beamPivots){
  b.pivot.rotation.y=Math.sin(t*.22+b.phase)*.9;
  b.pivot.rotation.x=Math.cos(t*.17+b.phase)*.4;
  b.pivot.rotation.z=Math.sin(t*.13+b.phase)*.25;
 }

 topLight.intensity=12+Math.sin(t*2)*4;

 updateFireworks(dt);

 $("pos").textContent=insideLift
  ?"ELEVATOR"
  :Math.round(player.x)+", "+Math.round(player.z);

 frameSamples++;
 sampleTime+=dt;

 if(sampleTime>2){
  const fps=frameSamples/sampleTime;

  if(fps<27){
   adaptiveScale=Math.max(.5,adaptiveScale-.08);
   renderer.setPixelRatio(adaptiveScale);
  }else if(fps>48){
   adaptiveScale=Math.min(Math.min(devicePixelRatio,.85),adaptiveScale+.025);
   renderer.setPixelRatio(adaptiveScale);
  }

  $("quality").textContent="RENDER "+Math.round(fps)+" FPS";
  frameSamples=0;
  sampleTime=0;
 }

 if(now-lastFrame<1000/45)return;
 lastFrame=now;

 renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 if($("lift").style.display==="block"){
  $("lift").style.maxHeight=Math.max(180,innerHeight-28)+"px";
 }
});
</script>
