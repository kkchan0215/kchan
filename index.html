<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌍 나만의 세계지도</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Malgun Gothic",sans-serif;
  background:#eef5ff;
  color:#17263a;
}

header{
  background:linear-gradient(135deg,#287cff,#65c7ff);
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:6px 0 0;
  font-size:13px;
}

.toolbar{
  background:white;
  padding:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  box-shadow:0 3px 12px #0001;
  position:relative;
  z-index:1000;
}

input,select,button{
  border:1px solid #d5e2f2;
  border-radius:10px;
  padding:10px;
  font-size:14px;
}

input{
  min-width:180px;
  flex:1;
}

button{
  background:#287cff;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

button.gray{
  background:#718096;
}

#map{
  height:calc(100vh - 150px);
  min-height:550px;
}

#panel{
  position:absolute;
  right:15px;
  top:150px;
  width:270px;
  background:white;
  border-radius:16px;
  box-shadow:0 8px 30px #0003;
  padding:16px;
  z-index:999;
  display:none;
}

#panel h2{
  margin:0 0 12px;
  font-size:20px;
}

#panel label{
  display:block;
  margin-top:10px;
  font-size:12px;
  font-weight:bold;
}

#countryColor{
  width:100%;
  height:42px;
  padding:3px;
}

#countryNote{
  width:100%;
  margin-top:5px;
}

.panelButtons{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.panelButtons button{
  flex:1;
}

.city-label{
  background:white;
  border:1px solid #777;
  border-radius:5px;
  padding:2px 5px;
  font-size:11px;
  box-shadow:0 1px 4px #0003;
}

.city-dot{
  width:8px;
  height:8px;
  background:#e63946;
  border:2px solid white;
  border-radius:50%;
  box-shadow:0 1px 4px #0005;
}

#loading{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:15px 20px;
  border-radius:14px;
  box-shadow:0 5px 20px #0003;
  z-index:1500;
}

@media(max-width:700px){
  #panel{
    top:auto;
    bottom:15px;
    right:10px;
    left:10px;
    width:auto;
  }

  #map{
    height:calc(100vh - 175px);
  }
}
</style>
</head>

<body>

<header>
  <h1>🌍 나만의 세계지도</h1>
  <p>나라를 클릭해서 직접 색칠하고 도시도 찾아보세요!</p>
</header>

<div class="toolbar">

  <input
    id="search"
    placeholder="🔎 나라 또는 도시 검색">

  <button onclick="searchPlace()">검색</button>

  <button onclick="toggleCities()">
    🏙️ 도시 표시
  </button>

  <button onclick="resetMap()" class="gray">
    🌎 전체보기
  </button>

  <button onclick="resetAll()" class="gray">
    ♻️ 초기화
  </button>

</div>

<div id="map"></div>

<div id="loading">🌍 지도 불러오는 중...</div>

<div id="panel">

  <h2 id="selectedName">나라</h2>

  <label>나라 색상</label>
  <input id="countryColor" type="color" value="#74b9ff">

  <label>메모</label>
  <input
    id="countryNote"
    placeholder="예: 내가 만든 나라"
  >

  <div class="panelButtons">
    <button onclick="saveCountry()">💾 적용</button>
    <button onclick="closePanel()" class="gray">닫기</button>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map",{
  minZoom:2,
  maxZoom:8,
  worldCopyJump:true
}).setView([25,0],2);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:"© OpenStreetMap contributors",
    maxZoom:19
  }
).addTo(map);

let countryLayer;
let selectedLayer=null;
let countryData={};
let citiesLayer=null;
let citiesVisible=false;

const COUNTRY_URL =
"https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson";

const CITIES_URL =
"https://cdn.jsdelivr.net/gh/drei01/geojson-world-cities@master/cities.geojson";


/* ---------------------------
   저장된 나라 설정 불러오기
---------------------------- */

try{
  countryData =
    JSON.parse(localStorage.getItem("myWorldCountries")) || {};
}catch(e){
  countryData={};
}


/* ---------------------------
   기본 국가 스타일
---------------------------- */

function getCountryCode(feature){

  const p=feature.properties || {};

  return String(
    p.ISO_A2_EH ||
    p.ISO_A2 ||
    p.ADM0_A3 ||
    p.NAME ||
    ""
  ).toUpperCase();
}


function getCountryName(feature){

  const p=feature.properties || {};

  return (
    p.NAME ||
    p.ADMIN ||
    p.NAME_EN ||
    "알 수 없는 나라"
  );
}


function getStyle(feature){

  const code=getCountryCode(feature);
  const saved=countryData[code];

  return {
    fillColor:saved?.color || "#79bfff",
    fillOpacity:.72,
    color:"#ffffff",
    weight:1
  };
}


/* ---------------------------
   세계 국가 지도
---------------------------- */

fetch(COUNTRY_URL)

.then(r=>r.json())

.then(data=>{

  countryLayer=L.geoJSON(data,{

    style:getStyle,

    onEachFeature:function(feature,layer){

      const name=getCountryName(feature);
      const code=getCountryCode(feature);

      layer.countryName=name;
      layer.countryCode=code;

      layer.bindTooltip(
        name,
        {
          sticky:true,
          direction:"top"
        }
      );

      layer.on({

        mouseover:function(e){

          if(selectedLayer!==e.target){

            e.target.setStyle({
              fillOpacity:.95,
              weight:2
            });

          }

        },

        mouseout:function(e){

          if(selectedLayer!==e.target){
            countryLayer.resetStyle(e.target);
          }

        },

        click:function(e){

          selectCountry(e.target);

        }

      });

    }

  }).addTo(map);

  document.getElementById("loading").style.display="none";

})

.catch(err=>{

  document.getElementById("loading").textContent=
    "⚠️ 지도를 불러오지 못했습니다.";

  console.error(err);

});


/* ---------------------------
   나라 선택
---------------------------- */

function selectCountry(layer){

  if(selectedLayer){
    countryLayer.resetStyle(selectedLayer);
  }

  selectedLayer=layer;

  layer.setStyle({
    fillColor:"#ffd166",
    fillOpacity:1,
    color:"#ff9f1c",
    weight:3
  });

  const code=layer.countryCode;
  const saved=countryData[code];

  document.getElementById("selectedName").textContent=
    "🌎 "+layer.countryName;

  document.getElementById("countryColor").value=
    saved?.color || "#79bfff";

  document.getElementById("countryNote").value=
    saved?.note || "";

  document.getElementById("panel").style.display="block";

  map.fitBounds(layer.getBounds(),{
    padding:[40,40],
    maxZoom:5
  });

}


/* ---------------------------
   나라 설정 저장
---------------------------- */

function saveCountry(){

  if(!selectedLayer)return;

  const code=selectedLayer.countryCode;

  countryData[code]={
    color:document.getElementById("countryColor").value,
    note:document.getElementById("countryNote").value
  };

  localStorage.setItem(
    "myWorldCountries",
    JSON.stringify(countryData)
  );

  countryLayer.resetStyle(selectedLayer);

  selectedLayer.setStyle({
    fillColor:countryData[code].color,
    fillOpacity:.9,
    color:"#ffffff",
    weight:1
  });

  alert(
    "💾 "+selectedLayer.countryName+
    " 설정이 저장됐어요!"
  );

}


/* ---------------------------
   패널 닫기
---------------------------- */

function closePanel(){

  document.getElementById("panel").style.display="none";

  if(selectedLayer){
    countryLayer.resetStyle(selectedLayer);
    selectedLayer=null;
  }

}


/* ---------------------------
   도시 표시
---------------------------- */

async function toggleCities(){

  if(citiesVisible){

    if(citiesLayer){
      map.removeLayer(citiesLayer);
    }

    citiesVisible=false;

    return;
  }

  if(citiesLayer){

    citiesLayer.addTo(map);
    citiesVisible=true;
    return;

  }

  document.getElementById("loading").style.display="block";
  document.getElementById("loading").textContent=
    "🏙️ 도시 데이터를 불러오는 중...";

  try{

    const response=await fetch(CITIES_URL);
    const data=await response.json();

    citiesLayer=L.geoJSON(data,{

      pointToLayer:function(feature,latlng){

        const name=
          feature.properties?.NAME ||
          feature.properties?.name ||
          "도시";

        return L.marker(latlng,{
          icon:L.divIcon({
            className:"",
            html:'<div class="city-dot"></div>',
            iconSize:[8,8],
            iconAnchor:[4,4]
          })
        }).bindTooltip(
          "🏙️ "+name,
          {
            direction:"top"
          }
        );

      }

    });

    citiesLayer.addTo(map);
    citiesVisible=true;

  }catch(e){

    alert(
      "도시 데이터를 불러오지 못했습니다."
    );

    console.error(e);

  }

  document.getElementById("loading").style.display="none";

}


/* ---------------------------
   나라 / 도시 검색
---------------------------- */

async function searchPlace(){

  const keyword=
    document.getElementById("search")
    .value
    .trim()
    .toLowerCase();

  if(!keyword)return;

  /* 나라 검색 */

  if(countryLayer){

    let foundCountry=null;

    countryLayer.eachLayer(layer=>{

      if(!foundCountry &&
         layer.countryName &&
         layer.countryName.toLowerCase().includes(keyword)){

        foundCountry=layer;

      }

    });

    if(foundCountry){

      selectCountry(foundCountry);
      return;

    }

  }


  /* 도시 검색 */

  if(!citiesLayer){

    await toggleCities();

  }

  let foundCity=null;

  if(citiesLayer){

    citiesLayer.eachLayer(layer=>{

      const name=
        layer.getTooltip()?.getContent() || "";

      if(
        !foundCity &&
        name.toLowerCase().includes(keyword)
      ){

        foundCity=layer;

      }

    });

  }

  if(foundCity){

    map.setView(
      foundCity.getLatLng(),
      8
    );

    foundCity.openTooltip();

    return;

  }

  alert("🔎 찾지 못했어요.");

}


/* ---------------------------
   전체보기
---------------------------- */

function resetMap(){

  map.setView([25,0],2);

  if(selectedLayer){

    countryLayer.resetStyle(selectedLayer);
    selectedLayer=null;

  }

  document.getElementById("panel").style.display="none";

}


/* ---------------------------
   모든 국가 설정 초기화
---------------------------- */

function resetAll(){

  if(!confirm(
    "⚠️ 직접 설정한 모든 나라 색상과 메모를 삭제할까요?"
  ))return;

  localStorage.removeItem("myWorldCountries");

  countryData={};

  if(countryLayer){

    countryLayer.eachLayer(layer=>{
      countryLayer.resetStyle(layer);
    });

  }

  closePanel();

  alert("♻️ 모든 나라 설정이 초기화됐어요.");

}

</script>

</body>
</html>
