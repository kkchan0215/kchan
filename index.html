<script type="module">
import * as THREE from "three";

/* 기본 설정 */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020713);
scene.fog = new THREE.FogExp2(0x061326,0.000025);

const camera = new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,100000);
camera.position.set(0,2,500);

const renderer = new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,0.8));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const clock=new THREE.Clock();
const boxGeo=new THREE.BoxGeometry(1,1,1);
const dummy=new THREE.Object3D();

function material(color,emissive=color,intensity=0.5){
 return new THREE.MeshStandardMaterial({
  color,emissive,emissiveIntensity:intensity,
  metalness:0.65,roughness:0.25
 });
}
function basic(color){
 return new THREE.MeshBasicMaterial({color});
}
function box(parent,x,y,z,w,h,d,mat){
 const m=new THREE.Mesh(boxGeo,mat);
 m.position.set(x,y,z);
 m.scale.set(w,h,d);
 parent.add(m);
 return m;
}

scene.add(new THREE.HemisphereLight(0x9bdcff,0x071020,1.25));
const sun=new THREE.DirectionalLight(0x9bcfff,1.2);
sun.position.set(200,500,300);
scene.add(sun);

/* 도시 바닥 */
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(24000,24000),
 material(0x071321,0x071321,0.15)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-2;
scene.add(ground);

/* 도로 */
function roadLine(x1,z1,x2,z2,color=0x168bb5){
 const geo=new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(x1,0,z1),
  new THREE.Vector3(x2,0,z2)
 ]);
 scene.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color,transparent:true,opacity:.5})));
}
for(let n=-6000;n<=6000;n+=500){
 roadLine(n,-6000,n,6000,0x124a69);
 roadLine(-6000,n,6000,n,0x124a69);
}
for(let n=-6000;n<=6000;n+=2000){
 box(scene,n,0,0,75,.5,12000,basic(0x0c1b2b));
 box(scene,0,0,n,12000,.5,75,basic(0x0c1b2b));
 roadLine(n-5,-6000,n-5,6000,0x25bfff);
 roadLine(-6000,n-5,6000,n-5,0x25bfff);
}

/* 별 */
const starPositions=[];
for(let i=0;i<1000;i++){
 starPositions.push(
  (Math.random()-.5)*18000,
  1000+Math.random()*7000,
  (Math.random()-.5)*18000
 );
}
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute("position",new THREE.Float32BufferAttribute(starPositions,3));
const stars=new THREE.Points(
 starGeo,
 new THREE.PointsMaterial({color:0xa8e5ff,size:9,transparent:true,opacity:.7})
);
scene.add(stars);

/* 간판 텍스처 */
function signTexture(text,color){
 const canvas=document.createElement("canvas");
 canvas.width=512;canvas.height=128;
 const ctx=canvas.getContext("2d");
 ctx.fillStyle="#06182a";
 ctx.fillRect(0,0,512,128);
 ctx.strokeStyle="#"+color.toString(16).padStart(6,"0");
 ctx.lineWidth=5;ctx.strokeRect(4,4,504,120);
 ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.font="bold 35px Arial";
 ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=20;
 ctx.fillStyle="#effcff";
 ctx.fillText(text,256,65);
 const tex=new THREE.CanvasTexture(canvas);
 tex.colorSpace=THREE.SRGBColorSpace;
 return tex;
}

const names=[
"AURIX ONE","VELORA TOWER","NEXUS 88","ELVANT CENTER","LUMIÈRE",
"ASTRA NOVA","NOVELLE","ARDEN HEIGHTS","MIRA HEIGHTS","VANTAGE",
"ORBITAL PLAZA","LUXEN TOWER","CROWNIX","ZENITH POINT","SOLVÉ",
"AETHER ONE","NOVA CREST","SKYLINE 07","VERTEX HOUSE","CELESTIA",
"ARCADIA TOWER","MONOLITH","BLUE HORIZON","ECLIPSE ONE","OPAL HEIGHTS",
"PRISM TOWER","AURORA CENTER","VIREN","NEXORA","SOLARIS",
"ELYSIUM","GRAND VELA","ASTRON","LUMEN HOUSE","VIVANT",
"CIRRUS TOWER","ONYX PLAZA","SAPPHIRE ONE","MERIDIAN","ALTO HEIGHTS",
"ZENORA","INFINITE 21","CLOUD NINE","VISTA ONE","NEBULA TOWER",
"ARION","LUCENT","AURELIA","NORTHSTAR","SKYFORGE",
"CRYSTAL EDGE","ORION HEIGHTS","MONTARA","AVENUE 9","VELLUM",
"SILVA TOWER","AERIS","CENTAUR","SOLENE","EON CENTER",
"BLUE ARC","RADIANT ONE","VANTERA","CIRRUS 88","AQUILA",
"MIRAGE TOWER","AURORA 9","GRAVITY ONE","LUMINA","INFINITY CREST"
];

const colors=[0x20d9ff,0x987cff,0x42ffd1,0xff8ed6,0xffcf65,0x64aaff,0xc1f4ff];
const buildings=[];

/* 창문을 건물별 인스턴스로 생성 */
function makeWindows(group,w,d,h,color){
 const rows=Math.max(5,Math.floor(h/100));
 const count=rows*24;
 const mesh=new THREE.InstancedMesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshBasicMaterial({color}),
  count
 );
 let index=0;
 const step=h/rows;
 for(let y=step/2;y<h;y+=step){
  for(let k=-2;k<=2;k++){
   const x=k*w*.16;
   for(const side of [-1,1]){
    dummy.position.set(x,y,side*(d/2+1));
    dummy.scale.set(7,17,2);
    dummy.updateMatrix();
    mesh.setMatrixAt(index++,dummy.matrix);

    const z=k*d*.16;
    dummy.position.set(side*(w/2+1),y,z);
    dummy.scale.set(2,17,7);
    dummy.updateMatrix();
    mesh.setMatrixAt(index++,dummy.matrix);
   }
  }
 }
 mesh.count=index;
 mesh.instanceMatrix.needsUpdate=true;
 group.add(mesh);
}

/* 건물 만들기 */
function makeBuilding(i,x,z,h){
 const group=new THREE.Group();
 group.position.set(x,0,z);
 scene.add(group);

 const color=colors[i%colors.length];
 const dark=material(0x101e32,0x0a1c32,.4);
 const glow=material(color,color,2.5);
 const w=100+(i%5)*13;
 const d=90+(i%4)*16;
 const style=i%7;

 box(group,0,h/2,0,w,h,d,dark);

 // 건물마다 다른 외형
 if(style===0){
  box(group,0,h*.5,0,w+18,14,d+18,glow);
  box(group,0,h+18,0,w*.7,36,d*.7,glow);
 }else if(style===1){
  box(group,0,h*.96,0,w*.8,h*.08,d*.8,glow);
  box(group,0,h+90,0,5,180,5,glow);
 }else if(style===2){
  for(let k=1;k<=4;k++)box(group,0,h*k/5,0,w+12,8,d+12,glow);
 }else if(style===3){
  box(group,0,h*.5,0,w*.55,h*.94,d*.55,material(0x183a54,color,1));
  box(group,0,h*.98,0,w*.9,16,d*.9,glow);
 }else if(style===4){
  for(let k=0;k<3;k++)box(group,0,h*(.35+k*.22),0,w*(1.15-k*.12),12,d*(1.15-k*.12),glow);
 }else if(style===5){
  box(group,w*.4,h/2,0,7,h,d+10,glow);
  box(group,-w*.4,h/2,0,7,h,d+10,glow);
 }else{
  box(group,0,h*.5,0,w*1.13,12,d*1.13,glow);
  box(group,0,h*.99,0,w*.95,14,d*.95,glow);
 }

 // 모서리 조명
 for(const sx of [-1,1]){
  for(const sz of [-1,1]){
   box(group,sx*w*.47,h/2,sz*d*.47,3,h,3,glow);
  }
 }

 // 옥상 링
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(Math.min(w,d)*.48,3,6,32),
  glow
 );
 ring.rotation.x=Math.PI/2;
 ring.position.y=h+25;
 group.add(ring);

 // 창문
 makeWindows(group,w,d,h,color);

 // 이름 간판
 const sign=new THREE.Mesh(
  new THREE.PlaneGeometry(Math.min(w*1.6,170),34),
  new THREE.MeshBasicMaterial({
   map:signTexture(names[i],color),
   transparent:true,
   side:THREE.DoubleSide
  })
 );
 sign.position.set(0,Math.max(80,h*.82),d/2+4);
 group.add(sign);

 // 엘리베이터 샤프트
 const lx=w*.58,lz=d*.58;
 box(group,lx,h/2,lz,18,h+10,18,material(0x18334c,color,1.1));
 box(group,lx,h/2,lz+10,4,h,3,glow);

 buildings.push({
  name:names[i],x,z,h,w,d,
  liftX:x+lx,liftZ:z+lz,
  isLandmark:false
 });
}

/* 일반 건물 높이 평균 5000m */
let seed=98123;
function random(){
 seed=(seed*16807)%2147483647;
 return(seed-1)/2147483646;
}
const heights=[];
for(let i=0;i<35;i++){
 const a=3000+random()*4000;
 heights.push(a,10000-a);
}
for(let i=0;i<70;i++){
 const angle=i*2.399963;
 const radius=750+(i%5)*210;
 makeBuilding(
  i,
  Math.cos(angle)*radius,
  Math.sin(angle)*radius,
  heights[i]
 );
}

/* 제이브 타워 */
const LMH=10299;
const LMW=250,LMD=210;
const landmark=new THREE.Group();
scene.add(landmark);

const lmDark=material(0x10243c,0x082b48,.8);
const lmBlue=material(0x30dfff,0x16caff,4);
const lmPink=material(0xff55d4,0xff20b5,3);
const lmGold=material(0xffd16a,0xffb638,2.8);

box(landmark,0,LMH/2,0,LMW,LMH,LMD,lmDark);
box(landmark,0,LMH*.52,0,LMW*.46,LMH*.96,LMD*.48,material(0x173d58,0x0c6690,1.8));

for(const s of [-1,1]){
 box(landmark,s*LMW*.46,LMH/2,0,8,LMH,LMD+10,lmBlue);
 box(landmark,0,LMH/2,s*LMD*.46,LMW+10,LMH,8,lmBlue);
}

// 타워의 층층이 빛 띠
const lmBands=[];
for(let y=350;y<LMH;y+=650){
 const band=box(landmark,0,y,0,LMW+24,9,LMD+24,lmBlue);
 lmBands.push(band);
}

// 수직 네온 라인
for(let i=0;i<8;i++){
 const a=i*Math.PI/4;
 box(
  landmark,
  Math.sin(a)*125,
  LMH/2,
  Math.cos(a)*105,
  5,LMH,5,
  i%2?lmPink:lmBlue
 );
}

// 왕관
box(landmark,0,LMH+70,0,LMW*.75,130,LMD*.75,lmBlue);
box(landmark,0,LMH+200,0,18,260,18,lmPink);
const crown=new THREE.Mesh(new THREE.TorusGeometry(170,8,8,64),lmGold);
crown.rotation.x=Math.PI/2;
crown.position.y=LMH+90;
landmark.add(crown);

// 이름 간판
const lmSign=new THREE.Mesh(
 new THREE.PlaneGeometry(210,65),
 new THREE.MeshBasicMaterial({
  map:signTexture("JAVE TOWER",0x42e2ff),
  side:THREE.DoubleSide
 })
);
lmSign.position.set(0,LMH*.87,LMD/2+8);
landmark.add(lmSign);

// 제이브 타워 엘리베이터
box(landmark,145,LMH/2,0,20,LMH,20,material(0x173c57,0x38dfff,1.5));
box(landmark,156,LMH/2,0,4,LMH,4,lmPink);

buildings.push({
 name:"JAVE TOWER",
 x:0,z:0,h:LMH,w:LMW,d:LMD,
 liftX:145,liftZ:0,
 isLandmark:true
});

// 랜드마크 광장
const plaza=new THREE.Mesh(
 new THREE.CylinderGeometry(300,340,12,48),
 material(0x10263c,0x0c6b94,.8)
);
plaza.position.y=4;
scene.add(plaza);
const plazaRing=new THREE.Mesh(
 new THREE.TorusGeometry(325,5,8,80),
 lmBlue
);
plazaRing.rotation.x=Math.PI/2;
plazaRing.position.y=12;
scene.add(plazaRing);

/* 태극기 LED 텍스처 */
function makeFlagTexture(){
 const c=document.createElement("canvas");
 c.width=400;c.height=260;
 const ctx=c.getContext("2d");
 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,400,260);

 // 태극 문양
 ctx.save();
 ctx.translate(200,130);
 ctx.fillStyle="#cd2e3a";
 ctx.beginPath();ctx.arc(0,0,63,Math.PI,0);ctx.fill();
 ctx.fillStyle="#0047a0";
 ctx.beginPath();ctx.arc(0,0,63,0,Math.PI);ctx.fill();
 ctx.fillStyle="#cd2e3a";
 ctx.beginPath();ctx.arc(0,-31.5,31.5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#0047a0";
 ctx.beginPath();ctx.arc(0,31.5,31.5,0,Math.PI*2);ctx.fill();
 ctx.restore();

 function trigram(x,y,rot,broken=false){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.fillStyle="#111";
  for(let i=0;i<3;i++){
   if(broken){
    ctx.fillRect(-27,-25+i*18,22,8);
    ctx.fillRect(5,-25+i*18,22,8);
   }else{
    ctx.fillRect(-27,-25+i*18,54,8);
   }
  }
  ctx.restore();
 }
 trigram(65,55,-.58,true);
 trigram(335,55,.58,false);
 trigram(65,205,.58,false);
 trigram(335,205,-.58,true);

 const tex=new THREE.CanvasTexture(c);
 tex.colorSpace=THREE.SRGBColorSpace;
 return tex;
}

const flagTexture=makeFlagTexture();
const flagMaterial=new THREE.MeshBasicMaterial({
 map:flagTexture,
 side:THREE.DoubleSide,
 toneMapped:false
});
const flags=[];

function addFlag(x,y,z,rotation){
 const geo=new THREE.PlaneGeometry(115,72,18,8);
 const pos=geo.attributes.position;
 const original=pos.array.slice();
 const mesh=new THREE.Mesh(geo,flagMaterial);
 mesh.position.set(x,y,z);
 mesh.rotation.y=rotation;
 landmark.add(mesh);
 flags.push({geo,pos,original,phase:Math.random()*6});
}

// 네 면의 태극기 LED
for(let y=700;y<LMH-400;y+=1350){
 addFlag(0,y,LMD/2+8,0);
 addFlag(0,y,-LMD/2-8,Math.PI);
 addFlag(LMW/2+8,y,0,Math.PI/2);
 addFlag(-LMW/2-8,y,0,-Math.PI/2);
}

/* 움직이는 빔 */
const beams=[];
for(let i=0;i<10;i++){
 const a=i*Math.PI*2/10;
 const g=new THREE.Group();
 g.position.set(Math.cos(a)*1900,0,Math.sin(a)*1900);
 scene.add(g);
 box(g,0,120,0,30,240,30,material(0x183b55,0x1b9cc9,1));
 const vertical=box(g,0,350,0,12,450,12,material(0x45eaff,0x20dfff,4));
 const horizontal=box(g,0,350,0,450,12,12,material(0xff57d1,0xff32bd,3));
 beams.push({vertical,horizontal,phase:i});
}

/* 엘리베이터 실내 */
const room=new THREE.Group();
scene.add(room);
let inside=false;
let currentLift=null;
let currentFloor=0;

function clearRoom(){
 while(room.children.length){
  const obj=room.children[0];
  room.remove(obj);
  if(obj.geometry)obj.geometry.dispose();
 }
}

function buildRoom(b,floor){
 clearRoom();
 currentFloor=floor;
 const type=["LOUNGE","RESTAURANT","SHOPPING","SKY LOUNGE"][floor%4];
 const y=floor*4.5;
 room.position.set(b.liftX+55,y,b.liftZ+55);

 const floorMat=material(0x1a344b,0x0b506e,.7);
 const wallMat=material(0x203b54,0x0a2945,.5);
 const accent=material(0x36ddff,0x21cfff,3);

 box(room,0,0,0,130,4,130,floorMat);
 box(room,0,35,-63,130,70,4,wallMat);
 box(room,-63,35,0,4,70,130,wallMat);
 box(room,63,35,0,4,70,130,wallMat);
 box(room,0,70,0,130,4,130,wallMat);
 box(room,0,3,0,115,2,115,accent);

 const sign=new THREE.Mesh(
  new THREE.PlaneGeometry(95,25),
  new THREE.MeshBasicMaterial({
   map:signTexture(type,0x39dcff),
   side:THREE.DoubleSide
  })
 );
 sign.position.set(0,43,-60);
 room.add(sign);

 if(type==="RESTAURANT"){
  for(let i=0;i<4;i++){
   box(room,-35+i*23,13,15,17,4,17,material(0x405b70));
   box(room,-35+i*23,22,15,3,16,3,accent);
  }
 }else if(type==="SHOPPING"){
  for(let i=0;i<5;i++){
   box(room,-45+i*22,20,-20,12,35,20,material(0x254c65,0x0d7093,.8));
  }
 }else{
  for(let i=0;i<3;i++){
   box(room,-30+i*30,12,15,22,14,20,material(0x385b70));
   box(room,-30+i*30,21,5,22,5,4,accent);
  }
 }
}

/* 엘리베이터 메뉴 */
function openLift(b){
 currentLift=b;
 document.getElementById("panel").style.display="block";
 document.getElementById("liftTitle").textContent=b.name+" · ELEVATOR";

 const floors=document.getElementById("floors");
 floors.innerHTML="";

 const maxFloor=Math.max(2,Math.floor(b.h/4.5));
 const buttonCount=24;

 for(let i=0;i<buttonCount;i++){
  const floor=Math.round(i*(maxFloor-1)/(buttonCount-1));
  const btn=document.createElement("button");
  btn.textContent=(floor+1)+"F";
  btn.addEventListener("click",()=>goFloor(b,floor));
  floors.appendChild(btn);
 }
}

function goFloor(b,floor){
 inside=true;
 currentLift=b;
 buildRoom(b,floor);

 camera.position.set(room.position.x,room.position.y+2,room.position.z+30);
 camera.rotation.set(0,0,0);

 document.getElementById("panel").style.display="none";
 document.getElementById("location").textContent=b.name+" · "+(floor+1)+"F";
 showToast((floor+1)+"층 도착");
}

function exitLift(){
 if(!inside||!currentLift)return;
 const b=currentLift;
 inside=false;
 clearRoom();
 camera.position.set(b.liftX,Math.max(2,currentFloor*4.5+2),b.liftZ+45);
 document.getElementById("location").textContent="CITY CENTER";
 currentLift=null;
}

function nearestBuilding(){
 let best=null;
 let bestDist=Infinity;
 for(const b of buildings){
  const d=Math.hypot(camera.position.x-b.liftX,camera.position.z-b.liftZ);
  if(d<bestDist){bestDist=d;best=b;}
 }
 return bestDist<155?best:null;
}

function showToast(message){
 const el=document.getElementById("toast");
 el.textContent=message;
 setTimeout(()=>{if(el.textContent===message)el.textContent="";},1800);
}

document.getElementById("close").onclick=()=>{
 document.getElementById("panel").style.display="none";
};

/* 키보드와 마우스 */
const keys={};
let yaw=0,pitch=0,locked=false;
const speed=260;

document.addEventListener("keydown",e=>{
 keys[e.code]=true;

 if(e.code==="KeyE"){
  if(inside){
   exitLift();
  }else{
   const b=nearestBuilding();
   if(b)openLift(b);
  }
 }
});
document.addEventListener("keyup",e=>keys[e.code]=false);

document.addEventListener("mousemove",e=>{
 if(!locked||inside)return;
 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=THREE.MathUtils.clamp(pitch,-1.45,1.45);
 camera.rotation.order="YXZ";
 camera.rotation.set(pitch,yaw,0);
});

renderer.domElement.addEventListener("click",()=>{
 if(document.getElementById("start").style.display==="none"&&!locked){
  renderer.domElement.requestPointerLock();
 }
});

document.addEventListener("pointerlockchange",()=>{
 locked=document.pointerLockElement===renderer.domElement;
});

document.getElementById("enter").onclick=()=>{
 document.getElementById("start").style.display="none";
 renderer.domElement.requestPointerLock();
};

/* 애니메이션 */
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const t=clock.elapsedTime;

 if(!inside){
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const move=new THREE.Vector3();

  if(keys.KeyW)move.add(forward);
  if(keys.KeyS)move.sub(forward);
  if(keys.KeyD)move.add(right);
  if(keys.KeyA)move.sub(right);

  if(move.lengthSq()>0){
   move.normalize().multiplyScalar(speed*dt);
   camera.position.add(move);
  }
  if(keys.Space)camera.position.y+=speed*dt;
  if(keys.ShiftLeft||keys.ShiftRight)camera.position.y-=speed*dt;
  camera.position.y=Math.max(2,camera.position.y);
 }else{
  const step=speed*dt*.5;
  if(keys.KeyW)camera.position.z-=step;
  if(keys.KeyS)camera.position.z+=step;
  if(keys.KeyA)camera.position.x-=step;
  if(keys.KeyD)camera.position.x+=step;

  camera.position.x=THREE.MathUtils.clamp(camera.position.x,room.position.x-55,room.position.x+55);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,room.position.z-55,room.position.z+55);
  camera.position.y=room.position.y+2;
 }

 document.getElementById("altitude").textContent=Math.round(camera.position.y).toLocaleString();

 const near=inside?null:nearestBuilding();
 const prompt=document.getElementById("prompt");
 if(near){
  prompt.style.display="block";
  prompt.textContent="E 키를 눌러 "+near.name+" 엘리베이터 이용";
 }else{
  prompt.style.display="none";
 }

 // 빔 움직임
 for(const b of beams){
  const phase=t*.65+b.phase;
  b.vertical.position.y=350+Math.sin(phase)*230;
  b.vertical.position.x=Math.cos(phase*.7)*180;
  b.horizontal.position.y=350+Math.cos(phase)*230;
  b.horizontal.position.z=Math.sin(phase*.7)*180;
 }

 // 랜드마크 빛의 움직임
 lmBlue.emissiveIntensity=3.3+Math.sin(t*2)*.9;
 lmPink.emissiveIntensity=2.6+Math.sin(t*1.7+1)*.8;
 lmGold.emissiveIntensity=2+Math.sin(t*1.3)*.7;
 lmBands.forEach((band,i)=>{
  band.material.emissiveIntensity=2.5+Math.sin(t*2+i*.3)*1.4;
 });

 // 태극기 펄럭임
 for(const f of flags){
  const p=f.pos;
  const original=f.original;
  for(let i=0;i<p.count;i++){
   const x=original[i*3];
   const wave=Math.sin(t*3.2+x*.035+f.phase)*Math.pow((x+57)/115,1.3)*13;
   p.setZ(i,original[i*3+2]+wave);
  }
  p.needsUpdate=true;
  f.geo.computeVertexNormals();
 }

 stars.rotation.y=t*.0007;
 renderer.render(scene,camera);
}

animate();

/* 화면 크기 변경 */
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
