<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍀 초화려 행운 룰렛 🍀</title>

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Jua',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(
    -45deg,
    #ff69b4,
    #8a2be2,
    #00bfff,
    #00ff88,
    #ffd700,
    #ff4500
    );
    background-size:600% 600%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.bg-light{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    opacity:.4;
    animation:move 8s infinite alternate;
}

.bg1{
    width:250px;
    height:250px;
    background:white;
    top:10%;
    left:10%;
}

.bg2{
    width:300px;
    height:300px;
    background:yellow;
    bottom:10%;
    right:10%;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(80px,80px);}
}

.container{
    width:360px;
    text-align:center;
    padding:25px;
    border-radius:30px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px);
    box-shadow:
    0 0 30px #fff,
    0 0 60px #ff69b4,
    0 0 120px #00bfff;
}

.top{
    font-size:55px;
}

h1{
    color:#ff1493;
    margin:10px 0 20px;
}

.viewport{
    width:300px;
    height:100px;
    overflow:hidden;
    margin:auto;
    border-radius:20px;
    border:5px solid white;
    background:white;
}

.viewport.spinning{
    animation:rainbow .3s linear infinite;
}

@keyframes rainbow{
    0%{box-shadow:0 0 20px red;}
    20%{box-shadow:0 0 20px orange;}
    40%{box-shadow:0 0 20px yellow;}
    60%{box-shadow:0 0 20px lime;}
    80%{box-shadow:0 0 20px cyan;}
    100%{box-shadow:0 0 20px violet;}
}

.track{
    display:flex;
    align-items:center;
    height:100%;
}

.item{
    min-width:300px;
    height:100px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
}

.win{
    color:#00b050;
    text-shadow:
    0 0 10px #00ff88,
    0 0 30px #00ff88,
    0 0 50px #00ff88;
}

.lose{
    color:#ff3333;
    text-shadow:
    0 0 10px #ff8080,
    0 0 30px #ff8080;
}

button{
    margin-top:20px;
    padding:14px 30px;
    border:none;
    border-radius:20px;
    font-size:24px;
    color:white;
    cursor:pointer;
    background:linear-gradient(45deg,#ff69b4,#ff9900);
    transition:.2s;
}

button:hover{
    transform:scale(1.08);
}

#result{
    min-height:60px;
    margin-top:20px;
    font-size:38px;
}

.jackpot{
    animation:jackpot .5s infinite alternate;
}

@keyframes jackpot{
    from{
        transform:scale(1);
        text-shadow:0 0 10px #fff;
    }
    to{
        transform:scale(1.1);
        text-shadow:
        0 0 20px #fff,
        0 0 40px gold,
        0 0 80px gold;
    }
}

.firework{
    position:fixed;
    font-size:50px;
    animation:boom 2s forwards;
    pointer-events:none;
}

@keyframes boom{
    from{
        transform:scale(0);
        opacity:1;
    }
    to{
        transform:scale(5);
        opacity:0;
    }
}
</style>
</head>
<body>

<div class="bg-light bg1"></div>
<div class="bg-light bg2"></div>

<div class="container">

<div class="top">🐰🍀🐻</div>

<h1>초화려 행운 룰렛</h1>

<div class="viewport">
    <div class="track" id="track"></div>
</div>

<button onclick="spin()">🎰 돌리기</button>

<div id="result"></div>

</div>

<script>

const itemsBase=[
"꽝","꽝","꽝","꽝","꽝",
"꽝","꽝","꽝","꽝","꽝",
"당첨","당첨","당첨",
"당첨","당첨","당첨"
];

const track=document.getElementById("track");

for(let r=0;r<50;r++){

    const mix=[...itemsBase]
    .sort(()=>Math.random()-0.5);

    mix.forEach(t=>{

        const d=document.createElement("div");

        d.className="item";

        if(t==="당첨"){
            d.classList.add("win");
            d.innerHTML="🍀 당첨 🍀";
        }else{
            d.classList.add("lose");
            d.innerHTML="💥 꽝 💥";
        }

        track.appendChild(d);

    });

}

let spinning=false;

function spin(){

    if(spinning) return;

    spinning=true;

    document.querySelector(".viewport")
    .classList.add("spinning");

    document.getElementById("result").innerHTML="";

    const items=document.querySelectorAll(".item");

    const target=Math.floor(Math.random()*items.length);

    const move=target*300;

    track.style.transition=
    "transform 5s cubic-bezier(.12,.85,.18,1)";

    track.style.transform=
    `translateX(-${move}px)`;

    setTimeout(()=>{

        document.querySelector(".viewport")
        .classList.remove("spinning");

        const result=items[target].textContent;

        if(result.includes("당첨")){

            document.body.animate([
                {transform:'scale(1)'},
                {transform:'scale(1.04)'},
                {transform:'scale(1)'}
            ],{
                duration:700
            });

            document.getElementById("result").innerHTML=
            '<div class="jackpot">🏆🍀 JACKPOT 🍀🏆</div>';

            for(let i=0;i<80;i++){

                const f=document.createElement("div");

                f.className="firework";

                f.innerHTML=
                ["🎉","🎊","✨","🌟","💎","🍀","🏆"][Math.floor(Math.random()*7)];

                f.style.left=Math.random()*100+"vw";
                f.style.top=Math.random()*100+"vh";

                document.body.appendChild(f);

                setTimeout(()=>{
                    f.remove();
                },2000);
            }

        }else{

            document.getElementById("result").innerHTML=
            "😭💥 꽝 💥😭";

        }

        spinning=false;

    },5000);

}
</script>

</body>
</html>
