<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>나만의 일기장</title>
<style>
body { font-family: Arial; padding:20px; background:#2d0b3a; color:#f3e5f5; }
input, textarea, select { width:100%; margin-bottom:10px; padding:6px; border-radius:6px; border:none; }
button { padding:6px 12px; cursor:pointer; margin:3px; border:none; border-radius:6px; background:#9c27b0; color:white; }
button:hover { background:#ba68c8; }

header { margin-bottom:15px; }
.section-box { background:#4a148c; padding:12px; border-radius:10px; margin-bottom:12px; }
#message { color:#ffeb3b; font-weight:bold; }

.group-list button { background:#7b1fa2; }
.feed { display:grid; grid-template-columns: repeat(auto-fill,minmax(250px,1fr)); gap:12px; }

.post { background:#6a1b9a; padding:10px; border-radius:10px; position:relative; }
.post img { max-width:100%; border-radius:8px; margin-top:6px; }
.delete-btn { position:absolute; top:6px; right:8px; color:#ff8a80; cursor:pointer; }
.like-btn { cursor:pointer; color:#ffd54f; }
.comment { margin-left:10px; font-size:14px; }
.comment-box { display:flex; margin-top:6px; }
.comment-box input { flex:1; margin-right:5px; }
</style>
</head>
<body>

<header>
<h1>나만의 일기장</h1>
<button id="loginBtn">로그인</button>
<button id="signupBtn">회원가입</button>
<button id="logoutBtn">로그아웃</button>
<span id="currentUser"></span>
</header>

<div id="message"></div>

<section class="section-box" id="signupBox" style="display:none;">
<h2>회원가입</h2>
<input type="text" id="signupUsername" placeholder="닉네임">
<input type="password" id="signupPassword" placeholder="비밀번호">
<button id="signupSubmit">회원가입 완료</button>
</section>

<section class="section-box" id="loginBox" style="display:none;">
<h2>로그인</h2>
<input type="text" id="loginUsername" placeholder="닉네임">
<input type="password" id="loginPassword" placeholder="비밀번호">
<button id="loginSubmit">로그인 완료</button>
</section>

<section class="section-box">
<h2>그룹 만들기</h2>
<input type="text" id="groupName" placeholder="그룹 이름">
<button id="createGroupBtn">그룹 생성</button>
<div id="groups" class="group-list"></div>
<button id="allPostsBtn">전체 보기</button>
</section>

<section class="section-box">
<h2>글쓰기</h2>
<select id="groupSelect"></select>
<input type="text" id="postTitle" placeholder="제목">
<textarea id="postContent" rows="3" placeholder="내용"></textarea>
<input type="file" id="postImage">
<img id="previewImage" style="display:none;">
<button id="submitPostBtn">글 작성</button>
</section>

<section class="section-box">
<h2>피드</h2>
<div id="feed" class="feed"></div>
</section>

<script>
let users = JSON.parse(localStorage.getItem('users')||'[]');
let posts = JSON.parse(localStorage.getItem('posts')||'[]');
let groups = JSON.parse(localStorage.getItem('groups')||'[]');
let currentUser = JSON.parse(localStorage.getItem('currentUser')||'null');
let currentGroupFilter=null;

const save=()=>{localStorage.setItem('users',JSON.stringify(users));
localStorage.setItem('posts',JSON.stringify(posts));
localStorage.setItem('groups',JSON.stringify(groups));
localStorage.setItem('currentUser',JSON.stringify(currentUser));}

const msg=t=>{message.textContent=t;setTimeout(()=>message.textContent='',2500);}

function updateHeader(){currentUserSpan.textContent=currentUser?` 로그인: ${currentUser.username}`:'';}
function updateGroupSelect(){
groupSelect.innerHTML='<option value="">무소속</option>';
if(!currentUser) return;
groups.filter(g=>g.owner===currentUser.username).forEach(g=>{
let o=document.createElement('option');o.value=g.id;o.textContent=g.name;groupSelect.appendChild(o);});
}
function renderGroups(){
groupsDiv.innerHTML='';
if(!currentUser) return;
groups.filter(g=>g.owner===currentUser.username).forEach(g=>{
let b=document.createElement('button');b.textContent=g.name;
b.onclick=()=>{currentGroupFilter=g.id;renderFeed();};groupsDiv.appendChild(b);});
}
function renderFeed(){
feed.innerHTML='';
let list=currentGroupFilter?posts.filter(p=>p.groupId===currentGroupFilter):posts;
list.forEach(p=>{
let d=document.createElement('div');d.className='post';
d.innerHTML=`
${currentUser?.username===p.username?`<div class="delete-btn" onclick="deletePost('${p.id}')">삭제</div>`:''}
<b>${p.title}</b> (${p.username})<br>${p.content}
${p.imageUrl?`<img src="${p.imageUrl}">`:''}
<div><span class="like-btn" onclick="likePost('${p.id}')">👍 ${p.likes}</span></div>
<div class="comment-box"><input id="c_${p.id}" placeholder="댓글"><button onclick="addComment('${p.id}')">쓰기</button></div>
${p.comments.map(c=>`<div class="comment">${c.username}: ${c.text}</div>`).join('')}
`;
feed.appendChild(d);
});
}

function signUp(){
let u=signupUsername.value.trim(),p=signupPassword.value.trim();
if(!u||!p) return alert("입력!");
if(users.find(x=>x.username===u)) return alert("존재함");
users.push({username:u,password:p});save();msg("회원가입 완료 ✅");
}
function login(){
let u=loginUsername.value.trim(),p=loginPassword.value.trim();
let user=users.find(x=>x.username===u&&x.password===p);
if(!user) return alert("오류");
currentUser=user;save();updateHeader();updateGroupSelect();renderGroups();renderFeed();msg("로그인 완료 ✅");
}
function logout(){currentUser=null;save();updateHeader();renderFeed();msg("로그아웃");}
function createGroup(){
if(!currentUser) return alert("로그인");
let name=groupName.value.trim();if(!name) return;
groups.push({id:Date.now()+'',name,owner:currentUser.username});save();updateGroupSelect();renderGroups();
}
function submitPost(){
if(!currentUser) return alert("로그인");
let title=postTitle.value.trim(),content=postContent.value.trim(),gid=groupSelect.value;
if(!title||!content) return;
let file=postImage.files[0];
if(file){let r=new FileReader();r.onload=e=>addPost(title,content,e.target.result,gid);r.readAsDataURL(file);}
else addPost(title,content,'',gid);
postTitle.value='';postContent.value='';previewImage.style.display='none';
}
function addPost(title,content,img,gid){
posts.unshift({id:Date.now()+'',username:currentUser.username,title,content,imageUrl:img,groupId:gid,likes:0,comments:[]});
save();renderFeed();
}
function deletePost(id){posts=posts.filter(p=>p.id!==id);save();renderFeed();}
function likePost(id){let p=posts.find(p=>p.id===id);p.likes++;save();renderFeed();}
function addComment(id){let input=document.getElementById('c_'+id);let t=input.value.trim();if(!t)return;
posts.find(p=>p.id===id).comments.push({username:currentUser.username,text:t});save();renderFeed();}

postImage.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{previewImage.src=ev.target.result;previewImage.style.display='block';};r.readAsDataURL(f);};

signupBtn.onclick=()=>{signupBox.style.display='block';loginBox.style.display='none';}
loginBtn.onclick=()=>{loginBox.style.display='block';signupBox.style.display='none';}
logoutBtn.onclick=logout;
signupSubmit.onclick=signUp;
loginSubmit.onclick=login;
createGroupBtn.onclick=createGroup;
submitPostBtn.onclick=submitPost;
allPostsBtn.onclick=()=>{currentGroupFilter=null;renderFeed();}

const message=document.getElementById('message'),
currentUserSpan=document.getElementById('currentUser'),
groupsDiv=document.getElementById('groups'),
groupSelect=document.getElementById('groupSelect'),
feed=document.getElementById('feed'),
previewImage=document.getElementById('previewImage');

updateHeader();updateGroupSelect();renderGroups();renderFeed();
</script>

</body>
</html>
