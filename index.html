
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON COAST · FINAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050914;color:#eef7ff;font-family:Arial,"Malgun Gothic",sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(8,18,35,.82);border:1px solid rgba(110,190,255,.25);border-radius:15px;backdrop-filter:blur(14px);box-shadow:0 8px 35px #0007}
#brand{position:absolute;top:20px;left:22px;padding:14px 18px}
#brand strong{font-size:19px;letter-spacing:3px;color:#9ee8ff}
#brand small{display:block;color:#7899b9;margin-top:5px;letter-spacing:2px}

#stats b{color:white;font-size:16px}
#help{position:absolute;bottom:20px;left:20px;padding:12px 15px;font-size:12px;line-height:1.9;color:#a9c6df}
#crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid #d8f6ff;border-radius:50%;transform:translate(-50%,-50%);opacity:.7}
#message{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);padding:12px 20px;display:none;white-space:nowrap}
#elevator{position:absolute;right:20px;top:100px;width:250px;padding:16px;display:none;pointer-events:auto}
#elevator h3{margin:0 0 5px;color:#9ee8ff}

#startBox{text-align:center;padding:40px;max-width:520px}
#startBox h1{font-size:clamp(32px,7vw,60px);letter-spacing:5px;margin:0;color:#c9f3ff;text-shadow:0 0 30px #26bfff}
#startBox p{color:#a7c5dc;line-height:1.8}
#startBtn{font-size:16px;padding:14px 35px;margin-top:15px;background:linear-gradient(110deg,#087fb0,#42c8ed);border:0;color:white}
#unlockHint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;padding:15px 22px;pointer-events:none}
#toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);padding:10px 16px;display:none}
</style>
</head>
<body>
<div id="start">
 <div id="startBox">
  <h1>NEON COAST</h1>
  <p>THE CITY OF LIGHT<br>미래의 도시를 자유롭게 탐험하세요.</p>
  <button id="startBtn">도시 입장하기</button>
 </div>
</div>

<div id="hud">
 <div id="brand" class="panel"><strong>NEON COAST</strong><small>FUTURE CITY PROJECT</small></div>
 <div id="stats" class="panel">위치 <b id="position">도시 광장</b><br>이동 모드 <b>EXPLORER</b></div>
 <div id="help" class="panel">
  WASD 이동 · 마우스 시점<br>
  SPACE 점프 · SHIFT 달리기<br>

  ESC 또는 화면 클릭으로 마우스 해제
 </div>

  <p id="liftInfo">이동할 층을 선택하세요.</p>
  <div id="floorList"></div>
  <button id="closeElevator">닫기</button>
 </div>
 <div id="unlockHint" class="panel">마우스가 해제되었습니다 · 화면을 클릭하면 다시 조작합니다</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050914);
scene.fog=new THREE.FogExp2(0x071322,.00034);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,12000);
camera.position.set(0,2,120);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,.85));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9acfff,0x101a32,1.5));
const moon=new THREE.DirectionalLight(0x91cfff,1.5);
moon.position.set(-300,700,200);scene.add(moon);

const glow=(color,intensity=2)=>new THREE.MeshStandardMaterial({
 color,emissive:color,emissiveIntensity:intensity,metalness:.55,roughness:.25
});
const dark=new THREE.MeshStandardMaterial({color:0x101d2d,metalness:.8,roughness:.3});
const glass=new THREE.MeshPhysicalMaterial({
 color:0x17334a,metalness:.45,roughness:.12,transparent:true,opacity:.55
});
const white=glow(0x9eeaff,1.5);
const blue=glow(0x159bff,2.7);
const cyan=glow(0x00eaff,3.5);
const gold=glow(0xffd58b,2.8);

function box(parent,w,h,d,mat,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);parent.add(m);return m;
}
function line(parent,a,b,r,mat){
 const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);
 const dir=new THREE.Vector3().subVectors(B,A);
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,dir.length(),8),mat);
 m.position.copy(A).add(B).multiplyScalar(.5);
 m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
 parent.add(m);return m;
}
function addGlowRing(parent,r,y,t,mat){
 const m=new THREE.Mesh(new THREE.TorusGeometry(r,t,8,96),mat);
 m.rotation.x=Math.PI/2;m.position.y=y;parent.add(m);return m;
}

// 바닥과 도시 도로
const ground=box(scene,5000,2,5000,new THREE.MeshStandardMaterial({color:0x07111e,roughness:.9}),0,-1,0);
const roadMat=new THREE.MeshStandardMaterial({color:0x111f30,metalness:.3,roughness:.7});
for(let i=-4;i<=4;i++){
 box(scene,34,.15,2500,roadMat,i*260,.05,0);
 box(scene,2500,.15,34,roadMat,0,.06,i*260);
 for(let j=-9;j<=9;j++){
  box(scene,1,.17,12,glow(0x23516a,.6),i*260,.15,j*130);
 }
}
for(let i=0;i<500;i++){
 const x=(Math.random()-.5)*4500,z=(Math.random()-.5)*4500;
 const star=new THREE.Mesh(new THREE.SphereGeometry(.7+Math.random()*1.4,5,5),glow(0x83caff,1.4));
 star.position.set(x,250+Math.random()*700,z);scene.add(star);
}

// 걸을 수 있는 층 데이터
const platforms=[];
const buildings=[];
const colliders=[];
let nearestLift=null;
let activeLift=null;
let inElevator=false;
let elevatorTarget=null;
let elevatorY=0;
let elevatorMoving=false;

function addPlatform(x,y,z,w,d,material=dark){
 const p=box(scene,w,.7,d,material,x,y,z);
 platforms.push({x,z,y:y+.35,w,d});
 return p;
}

// 일반 건물: V8 느낌의 짙은 외벽, 세로 모서리 조명, 층별 발판
function createBuilding(index,x,z,w,d,h){
 const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);
 const floors=Math.max(8,Math.floor(h/4.5));
 const floorHeight=h/floors;

 box(group,w,h,d,dark,0,h/2,0);
 // 전면 유리 패널
 box(group,w*.96,h*.98,.18,glass,0,h/2,d/2+.1);
 // 모서리 세로 라인
 for(const sx of [-1,1]){
  for(const sz of [-1,1]){
   box(group,.65,h+.5,.65,blue,sx*(w/2-.35),h/2,sz*(d/2-.35));
  }
 }
 // 창문 띠
 for(let f=1;f<floors;f++){
  const y=f*floorHeight;
  box(group,w*.92,.22,.24,glow(0x70cfff,.8),0,y,d/2+.22);
 }
 // 실제 층별 발판: 건물 내부 바닥
 for(let f=0;f<floors;f++){
  const y=f*floorHeight;
  const deck=box(group,w-.9,.55,d-.9,
    new THREE.MeshStandardMaterial({color:0x263b4e,metalness:.65,roughness:.45}),
    0,y+.1,0);
  platforms.push({
   x:x,z:z,y:y+.38,w:w-.9,d:d-.9
  });
  // 층마다 가장자리 조명
  if(f%2===0){
   box(group,w-.8,.12,.12,cyan,0,y+.42,d/2-.5);
  }
 }
 // 옥상 테두리
 box(group,w+.5,.45,.5,blue,0,h+.1,d/2);
 box(group,w+.5,.45,.5,blue,0,h+.1,-d/2);
 box(group,.5,.45,d,blue,w/2,h+.1,0);
 box(group,.5,.45,d,blue,-w/2,h+.1,0);

 // 외벽에 붙은 엘리베이터 샤프트
 const shaftX=w/2+1.8,shaftZ=d/2+2;
 box(group,4,h+2,4,glass,shaftX,h/2,shaftZ);
 box(group,.18,h+2,.18,cyan,shaftX-2,h/2,shaftZ);
 box(group,.18,h+2,.18,cyan,shaftX+2,h/2,shaftZ);
 const cabin=new THREE.Group();group.add(cabin);
 box(cabin,3.2,3.5,3.2,glow(0x174b6b,1),0,0,0);
 box(cabin,3.25,.12,3.25,cyan,0,-1.75,0);
 box(cabin,3.25,.12,3.25,cyan,0,1.75,0);
 cabin.position.set(shaftX,1.8,shaftZ);
 buildings.push({group,x,z,w,d,h,floors,floorHeight,shaftX,shaftZ,cabin,index,name:"SKY "+String(index+1).padStart(2,"0")});
 return buildings[buildings.length-1];
}

// 70개 일반 건물, 넓게 배치
for(let i=0;i<70;i++){
 const angle=i*2.399;
 const ring=390+Math.floor(i/14)*145+(Math.random()*45);
 const x=Math.cos(angle)*ring;
 const z=Math.sin(angle)*ring;
 const w=22+Math.random()*10,d=22+Math.random()*10;
 const h=210+Math.random()*390;
 createBuilding(i,x,z,w,d,h);
}

// 제이브 타워: 더위사냥처럼 길쭉하고 위로 갈수록 뾰족한 형태
const jave=new THREE.Group();scene.add(jave);
jave.position.set(0,0,0);

const towerHeight=3960;
const baseWidth=92;
const towerDepth=66;
const towerMat=new THREE.MeshPhysicalMaterial({
 color:0x183d5b,metalness:.72,roughness:.16,
 clearcoat:1,clearcoatRoughness:.08
});

// 사각형 단면이 점점 가늘어지는 매끈한 외형
function makeTaperedTower(){
 const verts=[],indices=[];
 const levels=90,segments=4;
 for(let i=0;i<=levels;i++){
  const t=i/levels;
  const width=baseWidth*(1-Math.pow(t,1.22)*.985);
  const depth=towerDepth*(1-Math.pow(t,1.22)*.985);
  const y=t*towerHeight;
  const corners=[
   [-width/2,-depth/2],[width/2,-depth/2],
   [width/2,depth/2],[-width/2,depth/2]
  ];
  for(const [xx,zz] of corners)verts.push(xx,y,zz);
 }
 for(let i=0;i<levels;i++){
  for(let s=0;s<4;s++){
   const a=i*4+s,b=i*4+(s+1)%4,c=(i+1)*4+(s+1)%4,d=(i+1)*4+s;
   indices.push(a,b,d,b,c,d);
  }
 }
 for(let s=0;s<4;s++)indices.push(levels*4,levels*4+((s+1)%4),s);
 const geo=new THREE.BufferGeometry();
 geo.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));
 geo.setIndex(indices);geo.computeVertexNormals();
 const mesh=new THREE.Mesh(geo,towerMat);jave.add(mesh);
}
makeTaperedTower();

// 타워 외벽의 빛나는 수직 라인
for(let side=0;side<4;side++){
 const pts=[];
 for(let i=0;i<=90;i++){
  const t=i/90,y=t*towerHeight;
  const w=baseWidth*(1-Math.pow(t,1.22)*.985);
  const d=towerDepth*(1-Math.pow(t,1.22)*.985);
  let x=0,z=0;
  if(side===0){x=-w/2-.35;z=0}
  if(side===1){x=w/2+.35;z=0}
  if(side===2){x=0;z=-d/2-.35}
  if(side===3){x=0;z=d/2+.35}
  pts.push(new THREE.Vector3(x,y,z));
 }
 const curve=new THREE.CatmullRomCurve3(pts);
 const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,180,.8,8,false),cyan);
 jave.add(tube);
}

// 타워의 수평 장식 링
for(let i=0;i<18;i++){
 const t=.12+i*.045;
 const w=baseWidth*(1-Math.pow(t,1.22)*.985);
 const d=towerDepth*(1-Math.pow(t,1.22)*.985);
 const ring=new THREE.Mesh(new THREE.BoxGeometry(w+.8,.8,d+.8),glow(i%2?0x168fff:0x8deeff,2.5));
 ring.position.y=t*towerHeight;
 ring.material.wireframe=true;jave.add(ring);
}

// 타워에 밀착된 엘리베이터 샤프트: 외벽 기울기를 따라감
const liftTrackPoints=[];
for(let i=0;i<=90;i++){
 const t=i/90;
 const y=t*towerHeight;
 const w=baseWidth*(1-Math.pow(t,1.22)*.985);
 liftTrackPoints.push(new THREE.Vector3(w/2+2,y,towerDepth*.16));
}
const trackCurve=new THREE.CatmullRomCurve3(liftTrackPoints);
const track=new THREE.Mesh(new THREE.TubeGeometry(trackCurve,240,2.4,10,false),glass);
jave.add(track);
const trackLight=new THREE.Mesh(new THREE.TubeGeometry(trackCurve,240,.32,8,false),cyan);
jave.add(trackLight);

const javeCabin=new THREE.Group();jave.add(javeCabin);
box(javeCabin,5,6,5,glow(0x17628b,1.4),0,0,0);
box(javeCabin,5.2,.18,5.2,cyan,0,-3,0);
box(javeCabin,5.2,.18,5.2,cyan,0,3,0);

// 꼭대기 전망대
const topY=towerHeight-65;
const observatory=new THREE.Group();observatory.position.y=topY;jave.add(observatory);
const deck=new THREE.Mesh(new THREE.CylinderGeometry(21,24,5,64),glow(0x173e5c,1));
observatory.add(deck);
deck.position.y=0;
const glassDome=new THREE.Mesh(new THREE.SphereGeometry(20,48,24,0,Math.PI*2,0,Math.PI/2),
 new THREE.MeshPhysicalMaterial({color:0x8bdfff,metalness:.3,roughness:.08,transparent:true,opacity:.28}));
glassDome.position.y=2.5;observatory.add(glassDome);
addGlowRing(observatory,23,0,1.2,gold);
addGlowRing(observatory,18,5,1,cyan);
for(let i=0;i<24;i++){
 const a=i*Math.PI*2/24;
 const post=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,8,8),gold);
 post.position.set(Math.cos(a)*20,4,Math.sin(a)*20);observatory.add(post);
}
const crown=new THREE.Mesh(new THREE.ConeGeometry(4,35,32),gold);
crown.position.y=27;observatory.add(crown);

// 제이브 타워의 강력한 빔
const beams=[];
function createBeam(parent,angle,length,color){
 const pivot=new THREE.Group();parent.add(pivot);
 const cone=new THREE.Mesh(new THREE.ConeGeometry(13,length,32,1,true),
 new THREE.MeshBasicMaterial({color,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false}));
 cone.rotation.x=-Math.PI/2;cone.position.z=-length/2;pivot.add(cone);
 const core=new THREE.Mesh(new THREE.CylinderGeometry(.45,.8,length,10),
 new THREE.MeshBasicMaterial({color,transparent:true,opacity:.7}));
 core.rotation.x=Math.PI/2;core.position.z=-length/2;pivot.add(core);
 const head=new THREE.Mesh(new THREE.SphereGeometry(2.5,12,12),glow(color,4));
 head.position.z=-length;pivot.add(head);
 pivot.rotation.y=angle;
 beams.push({pivot,phase:Math.random()*6.28,speed:.15+Math.random()*.13,range:.65});
 return pivot;
}
for(let i=0;i<6;i++)createBeam(observatory,i*Math.PI/3,680,0x9ceeff);

// 일반 건물의 빔 타워 10개
for(let i=0;i<10;i++){
 const b=buildings[i*6];
 const roof=new THREE.Group();roof.position.set(b.x,b.h,b.z);scene.add(roof);
 const base=box(roof,7,2,7,dark,0,0,0);
 addGlowRing(roof,4,1,0.35,cyan);
 createBeam(roof,i*.62,450,0x53bfff);
}

// 광장
const plaza=new THREE.Mesh(new THREE.CylinderGeometry(100,115,2,80),dark);
plaza.position.set(0,0,0);scene.add(plaza);
addGlowRing(scene,105,1.2,1.1,cyan);
for(let i=0;i<36;i++){
 const a=i*Math.PI*2/36;
 const p=new THREE.Mesh(new THREE.BoxGeometry(2,1,18),blue);
 p.position.set(Math.cos(a)*90,.9,Math.sin(a)*90);
 p.rotation.y=-a;p.position.y=1.1;scene.add(p);
}

// 폭죽
const fireworks=[];
function launchFirework(){
 const origin=new THREE.Vector3((Math.random()-.5)*30,towerHeight+20+Math.random()*70,(Math.random()-.5)*30);
 const color=new THREE.Color().setHSL(Math.random(),.8,.65);
 for(let i=0;i<75;i++){
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(.8,5,5),new THREE.MeshBasicMaterial({color}));
  mesh.position.copy(origin);scene.add(mesh);
  const v=new THREE.Vector3(Math.random()-.5,Math.random()-.2,Math.random()-.5).normalize().multiplyScalar(15+Math.random()*30);
  fireworks.push({mesh,v,life:1.5+Math.random()});
 }
}
let fireworkTimer=0;

// 플레이어 조작과 층 충돌
const keys={};
let velocityY=0;
let onGround=false;
let pointerLocked=false;
let yaw=0,pitch=0;
const player={x:0,y:2,z:130};
const rayDown=new THREE.Raycaster();
const down=new THREE.Vector3(0,-1,0);

function lockMouse(){
 renderer.domElement.requestPointerLock?.();
}
function unlockMouse(){
 if(document.pointerLockElement)document.exitPointerLock();
}
document.addEventListener("pointerlockchange",()=>{
 pointerLocked=document.pointerLockElement===renderer.domElement;
 document.getElementById("unlockHint").style.display=pointerLocked?"none":"block";
});
document.addEventListener("mousemove",e=>{
 if(!pointerLocked||inElevator)return;
 yaw-=e.movementX*.0022;
 pitch-=e.movementY*.0022;
 pitch=Math.max(-1.45,Math.min(1.45,pitch));
});
renderer.domElement.addEventListener("click",()=>{
 if(!pointerLocked&&!inElevator&&document.getElementById("start").style.display==="none")lockMouse();
});
document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="KeyE"&&!inElevator)tryEnterElevator();
 if(e.code==="Escape")unlockMouse();
});
document.addEventListener("keyup",e=>keys[e.code]=false);
document.addEventListener("click",e=>{
 if(e.target===renderer.domElement&&!pointerLocked&&!inElevator&&document.getElementById("start").style.display==="none")lockMouse();
});

// 바닥 판정: 모든 층 발판 위에 착지
function floorCollision(nextY){
 let best=-1000;
 for(const p of platforms){
  if(Math.abs(player.x-p.x)<p.w/2+.3&&Math.abs(player.z-p.z)<p.d/2+.3){
   if(p.y<=nextY+.4&&p.y>best)best=p.y;
  }
 }
 if(Math.abs(player.x)<2500&&Math.abs(player.z)<2500&&best<0)best=0;
 return best;
}

function findNearestLift(){
 let best=null,dist=Infinity;
 for(const b of buildings){
  const x=b.x+b.shaftX,z=b.z+b.shaftZ;
  const d=Math.hypot(player.x-x,player.z-z);
  if(d<dist){dist=d;best={type:"normal",building:b,x,z,dist:d};}
 }
 const t=Math.hypot(player.x-(baseWidth/2+4),player.z-towerDepth*.16);
 if(t<dist)best={type:"jave",x:baseWidth/2+4,z:towerDepth*.16,dist:t};
 return best;
}
function tryEnterElevator(){
 const lift=findNearestLift();
 if(!lift||lift.dist>15){toast("엘리베이터 가까이에서 E를 누르세요");return;}
 activeLift=lift;inElevator=true;unlockMouse();
 const ui=document.getElementById("elevator");
 ui.style.display="block";
 const list=document.getElementById("floorList");list.innerHTML="";
 let max,step;
 if(lift.type==="jave"){max=875;step=25;}
 else{max=lift.building.floors;step=Math.max(1,Math.ceil(max/24));}
 document.getElementById("liftTitle").textContent=lift.type==="jave"?"JAVE TOWER ELEVATOR":lift.building.name+" ELEVATOR";
 document.getElementById("liftInfo").textContent="이동할 층을 선택하세요. 모든 층에 발판이 있습니다.";
 const stops=[];
 for(let f=0;f<=max;f+=step)stops.push(f);
 if(!stops.includes(max))stops.push(max);
 for(const f of stops){
  const btn=document.createElement("button");
  btn.textContent=f===0?"G":f+"F";
  btn.onclick=()=>goFloor(f);
  list.appendChild(btn);
 }
}
function goFloor(f){
 if(!activeLift)return;
 elevatorTarget=f;
 elevatorMoving=true;
 const b=activeLift.building;
 if(activeLift.type==="jave"){
  elevatorY=f*4.5;
 }else{
  elevatorY=f*b.floorHeight;
 }
 document.getElementById("liftInfo").textContent=f+"층으로 이동 중...";
}
document.getElementById("closeElevator").onclick=exitElevator;
function exitElevator(){
 if(!activeLift)return;
 if(activeLift.type==="jave"){
  const y=elevatorY;
  const w=baseWidth*(1-Math.pow(y/towerHeight,1.22)*.985);
  player.x=w/2+8;player.z=towerDepth*.16;player.y=y+2;
 }else{
  const b=activeLift.building;
  player.x=b.x+b.shaftX-3;
  player.z=b.z+b.shaftZ;
  player.y=elevatorY+2;
 }
 inElevator=false;elevatorMoving=false;
 activeLift=null;
 document.getElementById("elevator").style.display="none";
 toast("층에 도착했습니다. 발판 위를 이동할 수 있습니다.");
}
function toast(msg){
 const el=document.getElementById("toast");
 el.textContent=msg;el.style.display="block";
 clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display="none",2200);
}

// 입장
document.getElementById("startBtn").onclick=()=>{
 document.getElementById("start").style.display="none";
 lockMouse();
};

// 엘리베이터 애니메이션
function updateElevator(dt){
 if(!inElevator||!activeLift||!elevatorMoving)return;
 const current=activeLift.type==="jave"?javeCabin.position.y:activeLift.building.cabin.position.y;
 const target=elevatorY;
 const next=THREE.MathUtils.damp(current,target,1.3,dt);
 if(activeLift.type==="jave")javeCabin.position.y=next;
 else activeLift.building.cabin.position.y=next;
 camera.position.y=next+2.2;
 if(Math.abs(next-target)<1.5){
  elevatorMoving=false;
  toast("도착했습니다. 닫기를 눌러 내리세요.");
  document.getElementById("liftInfo").textContent="도착했습니다.";
 }
}

// 카메라와 이동
const clock=new THREE.Clock();
function updatePlayer(dt){
 if(inElevator)return;
 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;camera.rotation.x=pitch;
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 let move=new THREE.Vector3();
 if(keys.KeyW)move.add(forward);
 if(keys.KeyS)move.sub(forward);
 if(keys.KeyD)move.add(right);
 if(keys.KeyA)move.sub(right);
 if(move.lengthSq()>0){
  move.normalize().multiplyScalar((keys.ShiftLeft?34:19)*dt);
  player.x+=move.x;player.z+=move.z;
 }
 if(keys.Space&&onGround){velocityY=13;onGround=false;}
 velocityY-=30*dt;
 player.y+=velocityY*dt;
 const floor=floorCollision(player.y-1.7);
 if(player.y-1.7<=floor&&velocityY<0){
  player.y=floor+1.7;velocityY=0;onGround=true;
 }else onGround=false;
 player.x=THREE.MathUtils.clamp(player.x,-2400,2400);
 player.z=THREE.MathUtils.clamp(player.z,-2400,2400);
 camera.position.set(player.x,player.y,player.z);
 const lift=findNearestLift();
 nearestLift=lift;
 if(lift&&lift.dist<15){
  showMessage("E 키를 눌러 엘리베이터 이용");
 }else hideMessage();
}
function showMessage(t){
 const el=document.getElementById("message");el.textContent=t;el.style.display="block";
}
function hideMessage(){document.getElementById("message").style.display="none";}

// 애니메이션
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const time=clock.elapsedTime;
 if(!inElevator)updatePlayer(dt);
 else updateElevator(dt);

 beams.forEach((b,i)=>{
  b.pivot.rotation.y=Math.sin(time*b.speed+b.phase)*.85;
  b.pivot.rotation.x=Math.cos(time*b.speed*.8+b.phase)*.45;
  b.pivot.rotation.z=Math.sin(time*b.speed*.65+b.phase)*.3;
 });
 fireworkTimer+=dt;
 if(fireworkTimer>2.2){fireworkTimer=0;launchFirework();}
 for(let i=fireworks.length-1;i>=0;i--){
  const f=fireworks[i];
  f.life-=dt;
  f.v.y-=12*dt;
  f.mesh.position.addScaledVector(f.v,dt);
  f.mesh.material.opacity=Math.max(0,f.life);
  f.mesh.scale.setScalar(Math.max(.05,f.life));
  if(f.life<=0){scene.remove(f.mesh);f.mesh.geometry.dispose();f.mesh.material.dispose();fireworks.splice(i,1);}
 }
 document.getElementById("position").textContent=
  inElevator?"엘리베이터":Math.round(player.x)+", "+Math.round(player.z);
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
