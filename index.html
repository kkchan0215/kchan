<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말랑 점수판</title>

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#ffd6ec,#ffe8fb,#f3d9ff);
  font-family:"Comic Sans MS", cursive;
  min-height:100vh;
  padding:30px;
}

.title{
  text-align:center;
  font-size:50px;
  color:#ff4f95;
  font-weight:900;
  margin-bottom:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.add-box{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:30px;
  flex-wrap:wrap;
}

input{
  padding:15px;
  border:none;
  border-radius:20px;
  font-size:18px;
  outline:none;
  width:250px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
  border:none;
  border-radius:20px;
  padding:15px 20px;
  font-size:18px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

.add-btn{
  background:#ff73b3;
  color:white;
}

.card{
  background:white;
  border-radius:30px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 20px rgba(0,0,0,0.1);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

.name{
  font-size:30px;
  color:#ff4f95;
  font-weight:900;
}

.score{
  font-size:40px;
  color:#b14cff;
  font-weight:900;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.plus{
  background:#ff9ed0;
  color:white;
}

.minus{
  background:#caa6ff;
  color:white;
}

.delete{
  background:#ff5d5d;
  color:white;
}

.stopwatch{
  position:fixed;
  top:20px;
  right:20px;
  background:white;
  padding:15px;
  border-radius:25px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  text-align:center;
  width:180px;
}

.stopwatch h2{
  margin:0;
  color:#ff4f95;
}

#time{
  font-size:35px;
  margin:10px 0;
  color:#b14cff;
  font-weight:900;
}

.stop-btns{
  display:flex;
  gap:5px;
  justify-content:center;
}

.start{
  background:#ff73b3;
  color:white;
}

.reset{
  background:#b14cff;
  color:white;
}
</style>
</head>

<body>

<div class="stopwatch">
  <h2>⏱ 스톱워치</h2>
  <div id="time">00:00</div>

  <div class="stop-btns">
    <button class="start" onclick="startStop()">시작</button>
    <button class="reset" onclick="resetWatch()">초기화</button>
  </div>
</div>

<div class="container">

  <div class="title">
    💖 말랑 점수판 💖
  </div>

  <div class="add-box">
    <input type="text" id="nameInput" placeholder="이름 입력하기 ✨">
    <button class="add-btn" onclick="addPlayer()">추가</button>
  </div>

  <div id="scoreBoard"></div>

</div>

<script>
const scoreBoard = document.getElementById("scoreBoard");

function addPlayer(){
  const input = document.getElementById("nameInput");
  const name = input.value.trim();

  if(name === "") return;

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div>
      <div class="name">💖 ${name}</div>
      <div class="controls">
        <button class="plus">+1</button>
        <button class="minus">-1</button>
        <button class="delete">삭제</button>
      </div>
    </div>

    <div class="score">0</div>
  `;

  const scoreText = card.querySelector(".score");

  let score = 0;

  card.querySelector(".plus").onclick = () => {
    score++;
    scoreText.textContent = score;
  };

  card.querySelector(".minus").onclick = () => {
    score--;
    scoreText.textContent = score;
  };

  card.querySelector(".delete").onclick = () => {
    card.remove();
  };

  scoreBoard.appendChild(card);

  input.value = "";
}

let seconds = 0;
let running = false;
let interval;

function updateStopwatch(){
  const mins = String(Math.floor(seconds/60)).padStart(2,'0');
  const secs = String(seconds%60).padStart(2,'0');

  document.getElementById("time").textContent = `${mins}:${secs}`;
}

function startStop(){
  if(!running){
    running = true;

    interval = setInterval(() => {
      seconds++;
      updateStopwatch();
    },1000);
  }else{
    running = false;
    clearInterval(interval);
  }
}

function resetWatch(){
  running = false;
  clearInterval(interval);
  seconds = 0;
  updateStopwatch();
}
</script>

</body>
</html>
