<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍀 초화려 룰렛 🍀</title>

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Jua',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(
        135deg,
        #ffb6e1,
        #d8c2ff,
        #bdefff,
        #c9ffd8,
        #fff0a8
    );
}

.container{
    width:380px;
    text-align:center;
    background:rgba(255,255,255,.95);
    border-radius:30px;
    padding:25px;
    box-shadow:
        0 0 20px white,
        0 0 40px #ff69b4,
        0 0 70px #7dd3fc;
}

.top{
    font-size:55px;
    margin-bottom:10px;
}

h1{
    color:#ff1493;
    margin-bottom:20px;
}

.viewport{
    width:320px;
    height:100px;
    overflow:hidden;
    margin:auto;
    border-radius:20px;
    border:5px solid white;
    background:white;
}

.viewport.spinning{
    animation:rainbow .4s linear infinite;
}

@keyframes rainbow{
    0%{box-shadow:0 0 20px red;}
    20%{box-shadow:0 0 20px orange;}
    40%{box-shadow:0 0 20px yellow;}
    60%{box-shadow:0 0 20px lime;}
    80%{box-shadow:0 0 20px cyan;}
    100%{box-shadow:0 0 20px violet;}
}

.track{
    display:flex;
    align-items:center;
    height:100%;
}

.item{
    min-width:320px;
    height:100px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    font-weight:bold;
}

.win{
    color:#00b050;
    text-shadow:
        0 0 10px #00ff88,
        0 0 20px #00ff88;
}

.lose{
    color:#ff3333;
    text-shadow:
        0 0 10px #ff8080,
        0 0 20px #ff8080;
}

button{
    margin-top:20px;
    border:none;
    border-radius:20px;
    padding:15px 35px;
    font-size:24px;
    color:white;
    cursor:pointer;
    background:linear-gradient(
        45deg,
        #ff69b4,
        #ff9800
    );
}

button:hover{
    transform:scale(1.05);
}

#result{
    min-height:80px;
    margin-top:20px;
}

.jackpot{
    color:gold;
    font-size:42px;
    text-shadow:
        0 0 10px white,
        0 0 20px gold,
        0 0 40px gold,
        0 0 60px gold;
}

.firework{
    position:fixed;
    font-size:50px;
    pointer-events:none;
    animation:boom 1.5s forwards;
}

@keyframes boom{
    from{
        transform:scale(0);
        opacity:1;
    }
    to{
        transform:scale(4);
        opacity:0;
    }
}
</style>
</head>
<body>

<div class="container">

<div class="top">🐰🍀🐻</div>

<h1>초화려 행운 룰렛</h1>

<div class="viewport">
    <div class="track" id="track"></div>
</div>

<button onclick="spin()">🎰 돌리기</button>

<div id="result"></div>

</div>

<script>

const itemsBase=[
"꽝","꽝","꽝","꽝","꽝",
"꽝","꽝","꽝","꽝","꽝",
"꽝","꽝","한번더",
"한번더",
"당첨","당첨","당첨",
"당첨","당첨","당첨"
];

const track=document.getElementById("track");

for(let r=0;r<40;r++){

    const mix=[...itemsBase]
    .sort(()=>Math.random()-0.5);

    mix.forEach(t=>{

        const d=document.createElement("div");

        d.className="item";

        if(t==="당첨"){
            d.classList.add("win");
            d.innerHTML="🍀 당첨 🍀";
        }else{
            d.classList.add("lose");
            d.innerHTML="💥 꽝 💥";
        }

        track.appendChild(d);

    });
}

let spinning=false;

function spin(){

    if(spinning) return;

    spinning=true;

    document.getElementById("result").innerHTML="";

    document.querySelector(".viewport")
    .classList.add("spinning");

    const items=document.querySelectorAll(".item");

    const target=Math.floor(
        Math.random()*items.length
    );

    const move=target*320;

    track.style.transition=
    "transform 5s cubic-bezier(.12,.85,.18,1)";

    track.style.transform=
    `translateX(-${move}px)`;

    setTimeout(()=>{

        document.querySelector(".viewport")
        .classList.remove("spinning");

        const result=
        items[target].textContent;

        if(result.includes("당첨")){

            document.getElementById("result").innerHTML=
            '<div id="jackpot" class="jackpot">🏆🍀 JACKPOT 🍀🏆</div>';

            const jackpot=
            document.getElementById("jackpot");

            const rect=
            jackpot.getBoundingClientRect();

            for(let i=0;i<30;i++){

                const f=
                document.createElement("div");

                f.className="firework";

                f.innerHTML=
                ["🎉","🎊","✨","🌟","💎","🍀"]
                [Math.floor(Math.random()*6)];

                f.style.left=
                (rect.left+rect.width/2+
                (Math.random()-0.5)*180)
                +"px";

                f.style.top=
                (rect.top+rect.height/2+
                (Math.random()-0.5)*120)
                +"px";

                document.body.appendChild(f);

                setTimeout(()=>{
                    f.remove();
                },1500);
            }

        }else{

            document.getElementById("result").innerHTML=
            "😭💥 꽝 💥😭";

        }

        spinning=false;

    },5000);
}
</script>

</body>
</html>
