
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON COAST V6</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#020615;color:white;font-family:Arial,"Malgun Gothic",sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(3,13,32,.86);border:1px solid #38cfff66;border-radius:15px;backdrop-filter:blur(12px);box-shadow:0 0 25px #00baff22;padding:13px 17px}
#brand{position:absolute;top:15px;left:15px}
#brand b{font-size:21px;letter-spacing:4px;color:#8af5ff;text-shadow:0 0 18px #00dfff}
#brand small{display:block;font-size:10px;letter-spacing:3px;color:#9bbbd3;margin-top:5px}
#stats{position:absolute;right:15px;top:15px;text-align:right;font-size:12px;line-height:1.9}
#help{position:absolute;left:15px;bottom:15px;font-size:12px;line-height:1.9;color:#c5eaff}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#b9f8ff;font-size:20px}
#notice{position:absolute;bottom:105px;left:50%;transform:translateX(-50%);color:#c7faff;text-shadow:0 0 12px #00dfff;font-size:14px;white-space:nowrap}
#prompt{display:none;position:absolute;left:50%;top:58%;transform:translateX(-50%);padding:11px 18px;border:1px solid #4beaff;border-radius:12px;background:#041b35ed;color:#d8fbff;font-size:14px;white-space:nowrap}
#elevator{display:none;pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,92vw);text-align:center}
#elevator h2{color:#8af5ff;letter-spacing:3px}
#floorDisplay{font-size:34px;margin:10px;text-shadow:0 0 15px #00dfff}
#floorInfo{font-size:12px;color:#9bbbd2;margin-bottom:13px}
#floors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#floors button,#exitLift{border:1px solid #48dfff;background:#092846;color:white;padding:12px;border-radius:9px;cursor:pointer;font-size:14px}
#floors button:hover,#exitLift:hover{background:#12628b;box-shadow:0 0 15px #00cfff}
#exitLift{width:100%;margin-top:12px}
#lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#020817dd;pointer-events:auto}
#start{border:1px solid #54eaff;background:linear-gradient(120deg,#073451,#075a78);color:white;padding:18px 30px;border-radius:14px;font-size:17px;cursor:pointer;box-shadow:0 0 35px #00cfff33}
#start:hover{box-shadow:0 0 45px #00dfff88}
</style>
</head>
<body>
<div id="hud">
 <div id="brand" class="panel"><b>NEON COAST</b><small>ULTRA LUMINOUS · V6</small></div>
 <div id="stats" class="panel">
  <div>도시 건물 <b>100개</b></div>
  <div>빔 타워 <b>10개</b></div>
  <div>시민 <b>200명</b></div>
  <div id="heightText">고도 0m</div>
  <div id="buildingText">주변 건물 탐색 중</div>
 </div>
 <div id="help" class="panel">
  <b>CONTROL</b><br>
  W A S D 이동 · 마우스 시점<br>
  SPACE 점프 · SHIFT 달리기<br>
  E 엘리베이터 이용<br>
  ESC 마우스 잠금 해제
 </div>
 <div id="cross">+</div>
 <div id="notice"></div>
 <div id="prompt">E 키를 눌러 엘리베이터 탑승</div>
 <div id="elevator" class="panel">
  <h2>SKY ELEVATOR</h2>
  <div id="floorDisplay">1F</div>
  <div id="floorInfo">건물 엘리베이터</div>
  <div id="floors"></div>
  <button id="exitLift">엘리베이터에서 내리기</button>
 </div>
 <div id="lock"><button id="start">NEON COAST 입장하기</button></div>
</div>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from "three";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020817);
scene.fog=new THREE.FogExp2(0x07152c,.0009);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,2500);
camera.position.set(0,2,75);

const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,.9));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.45;
document.body.appendChild(renderer.domElement);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.45,.55,.12));

scene.add(new THREE.HemisphereLight(0x9bdcff,0x101225,1.7));
const sun=new THREE.DirectionalLight(0x83caff,1.5);
sun.position.set(-150,300,100);
scene.add(sun);

const clock=new THREE.Clock();
const boxGeo=new THREE.BoxGeometry(1,1,1);
const sphereGeo=new THREE.SphereGeometry(1,10,10);

function mat(color,opacity=1){
 return new THREE.MeshBasicMaterial({
  color,transparent:opacity<1,opacity,
  blending:opacity<1?THREE.AdditiveBlending:THREE.NormalBlending,
  depthWrite:opacity>=1
 });
}
function box(w,h,d,m,x,y,z,parent=scene){
 const o=new THREE.Mesh(boxGeo,m);
 o.scale.set(w,h,d);
 o.position.set(x,y,z);
 parent.add(o);
 return o;
}
function line(parent,x,y,z,w,h,d,m){
 return box(w,h,d,m,x,y,z,parent);
}
const M={
 cyan:mat(0x49eaff),blue:mat(0x238dff),
 pink:mat(0xff48d2),purple:mat(0x9c7aff),
 gold:mat(0xffd77a),white:mat(0xdffaff),
 dark:new THREE.MeshStandardMaterial({color:0x09192c,metalness:.8,roughness:.25}),
 road:new THREE.MeshStandardMaterial({color:0x101c2d,roughness:.9}),
 glow:mat(0x4ceaff,.12)
};
const glowColors=[0x4ceaff,0xff53d5,0x9d80ff,0xffd77a,0x8affdc];
const glowMats=glowColors.map(c=>mat(c));

// 별
const starPositions=[];
for(let i=0;i<900;i++){
 starPositions.push((Math.random()-.5)*2000,100+Math.random()*800,(Math.random()-.5)*1600);
}
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute("position",new THREE.Float32BufferAttribute(starPositions,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xb7eaff,size:1.5,transparent:true,opacity:.8})));

// 바다와 도시 바닥
box(2200,2,1800,new THREE.MeshStandardMaterial({color:0x03182e,metalness:.8,roughness:.2}),0,-2,-700);
box(1800,2,1100,new THREE.MeshStandardMaterial({color:0x111d30,roughness:.85}),0,-1,0);

// 도로와 차선
for(let x=-850;x<=850;x+=150){
 box(9,.08,1100,M.road,x,.1,0);
 for(let z=-520;z<540;z+=42)box(.15,.04,12,M.gold,x,.17,z);
}
for(let z=-500;z<=500;z+=150)box(1700,.08,8,M.road,0,.1,z);

// 가로등
for(let x=-800;x<=800;x+=100){
 for(let z=-450;z<=450;z+=150){
  box(.16,5,.16,M.dark,x,2.5,z);
  box(.55,.12,.55,M.cyan,x,5,z);
 }
}

// 건물 높이: 50쌍의 합이 각각 600m이므로 평균 300m
const heights=[];
for(let i=0;i<50;i++){
 const h=120+Math.random()*360;
 heights.push(h,600-h);
}
// 섞기
for(let i=heights.length-1;i>0;i--){
 const j=Math.floor(Math.random()*(i+1));
 [heights[i],heights[j]]=[heights[j],heights[i]];
}

const buildings=[];
const beamUnits=[];
const buildingPulse=[];
const buildingPositions=[];

// 건물 엘리베이터 승강로와 캐빈은 건물별로 독립 생성
function makeBuilding(index,x,z,w,d,h,isBeam){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);

 const color=new THREE.Color().setHSL(.56+(index%8)*.012,.42,.12+(index%3)*.025);
 const bodyMat=new THREE.MeshStandardMaterial({color,metalness:.82,roughness:.23});
 box(w,h,d,bodyMat,0,h/2,0,g);

 const lm=glowMats[index%glowMats.length];

 // 네 모서리 광섬유
 for(const sx of [-1,1])for(const sz of [-1,1]){
  line(g,sx*(w/2-.18),h/2,sz*(d/2-.18),.13,h,.13,lm);
 }

 // 층별 창문 조명
 const floors=Math.max(3,Math.floor(h/4.5));
 for(let f=1;f<floors;f++){
  const y=f*4.5;
  const windowMat=(f+index)%7===0?M.gold:(f+index)%4===0?M.pink:M.cyan;
  line(g,0,y,d/2+.08,w*.88,.075,.075,windowMat);
  line(g,0,y,-d/2-.08,w*.88,.075,.075,windowMat);
  line(g,w/2+.08,y,0,.075,.075,d*.88,windowMat);
  line(g,-w/2-.08,y,0,.075,.075,d*.88,windowMat);

  // 창문 일부에 세로 조명
  if(f%3===0){
   const xx=(Math.sin(f*index+1))*(w*.28);
   line(g,xx,y+1,d/2+.1,.08,2,.08,M.white);
  }
 }

 // 옥상 테두리
 line(g,0,h+.12,d/2,w,.16,.16,lm);
 line(g,0,h+.12,-d/2,w,.16,.16,lm);
 line(g,w/2,h+.12,0,.16,.16,d,lm);
 line(g,-w/2,h+.12,0,.16,.16,d,lm);

 // 옥상 장식
 box(w*.25,1.2,d*.25,M.dark,0,h+.65,0,g);
 box(w*.15,.13,d*.15,M.gold,0,h+1.3,0,g);
 for(let k=0;k<4;k++){
  const a=k*Math.PI/2;
  line(g,Math.cos(a)*w*.18,h+2,Math.sin(a)*d*.18,.08,2,.08,M.cyan);
 }

 // 입구 프레임
 const front=d/2+.08;
 box(w*.4,.18,.25,M.cyan,0,4.1,front,g);
 box(.16,4,.25,M.pink,-w*.2,2,front,g);
 box(.16,4,.25,M.pink,w*.2,2,front,g);

 // 엘리베이터 승강로: 건물 오른쪽 내부에 설치
 const liftX=w*.23;
 const liftZ=-d*.12;
 const shaftMat=new THREE.MeshStandardMaterial({
  color:0x17617c,metalness:.85,roughness:.2,transparent:true,opacity:.35
 });
 box(3.2,h,3.2,shaftMat,liftX,h/2,liftZ,g);
 for(const sx of [-1,1])for(const sz of [-1,1]){
  line(g,liftX+sx*1.6,h/2,liftZ+sz*1.6,.12,h,.12,M.cyan);
 }

 // 개별 캐빈
 const cabin=new THREE.Group();
 cabin.position.set(liftX,0,liftZ);
 g.add(cabin);
 box(2.8,.22,2.8,M.gold,0,.12,0,cabin);
 box(2.8,.18,2.8,M.dark,0,3.4,0,cabin);
 const glass=new THREE.MeshStandardMaterial({
  color:0x54dfff,metalness:.7,roughness:.15,transparent:true,opacity:.24
 });
 box(2.8,3.1,.1,glass,0,1.8,-1.35,cabin);
 box(.1,3.1,2.8,glass,-1.35,1.8,0,cabin);
 box(.1,3.1,2.8,glass,1.35,1.8,0,cabin);
 const cabLight=new THREE.PointLight(0x4ceaff,1.2,10);
 cabLight.position.set(0,2.5,0);
 cabin.add(cabLight);

 // 출입구 문
 const doorL=box(1.35,3,.12,M.blue,-.7,1.7,1.4,cabin);
 const doorR=box(1.35,3,.12,M.blue,.7,1.7,1.4,cabin);

 // 이 건물에서 정차 가능한 층
 const maxFloor=Math.max(2,Math.floor(h/4.5));
 const stops=[1,
  Math.max(2,Math.round(maxFloor*.25)),
  Math.max(3,Math.round(maxFloor*.5)),
  Math.max(4,Math.round(maxFloor*.75)),
  maxFloor
 ].filter((v,i,a)=>a.indexOf(v)===i);

 // 정차 층별 외부 발코니
 stops.forEach(f=>{
  const fy=f*4.5;
  box(w*.58,.35,5,M.dark,0,fy,front+2.2,g);
  line(g,0,fy+.22,front+4.6,w*.58,.08,.08,M.cyan);
  box(w*.58,.12,.12,M.cyan,0,fy+1.1,front+4.6,g);
 });

 // 빔 설치
 let beamData=null;
 if(isBeam){
  const emitter=new THREE.Group();
  emitter.position.set(0,h+3,0);
  g.add(emitter);

  const pivot=new THREE.Group();
  emitter.add(pivot);

  // 부드러운 빔 외곽
  const outer=new THREE.Mesh(
   new THREE.CylinderGeometry(.12,13,310,24,1,true),
   new THREE.MeshBasicMaterial({
    color:glowColors[index%5],transparent:true,opacity:.105,
    blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
   })
  );
  outer.position.y=155;
  pivot.add(outer);

  // 중심 광선
  const core=new THREE.Mesh(
   new THREE.CylinderGeometry(.04,1.1,310,14,1,true),
   new THREE.MeshBasicMaterial({
    color:0xd5fbff,transparent:true,opacity:.3,
    blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
   })
  );
  core.position.y=155;
  pivot.add(core);

  // 넓은 빛 안개
  const haze=new THREE.Mesh(
   new THREE.CylinderGeometry(.3,21,310,20,1,true),
   new THREE.MeshBasicMaterial({
    color:glowColors[(index+2)%5],transparent:true,opacity:.035,
    blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
   })
  );
  haze.position.y=155;
  pivot.add(haze);

  const emitterLight=new THREE.PointLight(glowColors[index%5],2,65);
  emitterLight.position.y=2;
  emitter.add(emitterLight);

  beamData={pivot,outer,core,haze,phase:index*.8};
  beamUnits.push(beamData);
 }

 const data={
  index,x,z,w,d,h,g,cabin,doorL,doorR,
  liftX,liftZ,maxFloor,stops,
  isBeam,beamData,
  lm,phase:index*.73,
  activeFloor:1,
  moving:false,targetY:0,door:1,doorTarget:1
 };
 buildings.push(data);
 buildingPositions.push({x,z,h});
 return data;
}

// 100개 건물 배치
for(let i=0;i<100;i++){
 let x,z;
 const ring=i%4;
 const radius=150+ring*100+Math.random()*100;
 const angle=i*2.39996;
 x=Math.cos(angle)*radius+(Math.random()-.5)*50;
 z=Math.sin(angle)*radius+(Math.random()-.5)*50;
 const w=15+Math.random()*15;
 const d=15+Math.random()*15;
 makeBuilding(i,x,z,w,d,heights[i],i<10);
}

// 시민 200명
const crowdGeo=new THREE.CapsuleGeometry(.32,.85,2,5);
const crowdMat=new THREE.MeshStandardMaterial({color:0x4a9fc9,roughness:.8});
const crowd=new THREE.InstancedMesh(crowdGeo,crowdMat,200);
scene.add(crowd);
const crowdData=[];
const dummy=new THREE.Object3D();
for(let i=0;i<200;i++){
 const x=(Math.random()-.5)*1400;
 const z=(Math.random()-.5)*850;
 crowdData.push({x,z,phase:Math.random()*6,speed:.4+Math.random()*.5});
 dummy.position.set(x,.8,z);
 dummy.updateMatrix();
 crowd.setMatrixAt(i,dummy.matrix);
}
crowd.instanceMatrix.needsUpdate=true;

// 공중 교통 8대
const vehicles=[];
for(let i=0;i<8;i++){
 const g=new THREE.Group();
 scene.add(g);
 box(7,1,3,M.dark,0,0,0,g);
 box(6,.15,2.6,M.cyan,0,.6,0,g);
 vehicles.push({g,r:250+Math.random()*500,a:Math.random()*6.28,y:50+Math.random()*140,s:.025+Math.random()*.012});
}

// 바다 반사선
const seaLines=[];
for(let i=0;i<35;i++){
 seaLines.push(box(1800,.025,.12,mat(i%2?0x087cba:0x12558d,.4),0,-.8,-100-i*25));
}

// UI 및 상태
const elevatorEl=document.getElementById("elevator");
const floorsEl=document.getElementById("floors");
const floorDisplay=document.getElementById("floorDisplay");
const floorInfo=document.getElementById("floorInfo");
const promptEl=document.getElementById("prompt");
const notice=document.getElementById("notice");
const lock=document.getElementById("lock");

let selectedBuilding=null;
let inElevator=false;
let gameStarted=false;
let pointerLocked=false;
let elevatorUI=false;
let yaw=0,pitch=0,velocityY=0,grounded=true;
const keys={};

function showNotice(s){
 notice.textContent=s;
 clearTimeout(showNotice.timer);
 showNotice.timer=setTimeout(()=>notice.textContent="",2400);
}

function openUI(){
 elevatorUI=true;
 elevatorEl.style.display="block";
 if(document.pointerLockElement)document.exitPointerLock();
 renderFloorButtons();
}
function closeUI(){
 elevatorUI=false;
 elevatorEl.style.display="none";
 if(gameStarted)renderer.domElement.requestPointerLock();
}

function renderFloorButtons(){
 if(!selectedBuilding)return;
 const b=selectedBuilding;
 floorsEl.innerHTML="";
 floorDisplay.textContent=b.activeFloor+"F";
 floorInfo.textContent=
  "건물 "+(b.index+1)+" · 높이 "+Math.round(b.h)+"m · 총 "+b.maxFloor+"층";

 b.stops.forEach(f=>{
  const btn=document.createElement("button");
  btn.textContent=f+"F";
  btn.onclick=()=>goFloor(f);
  floorsEl.appendChild(btn);
 });
}

function goFloor(f){
 const b=selectedBuilding;
 if(!b||b.moving)return;
 if(f===b.activeFloor){
  showNotice("이미 도착한 층이야");
  return;
 }
 b.activeFloor=f;
 b.targetY=f*4.5;
 b.moving=true;
 b.doorTarget=0;
 closeUI();
 showNotice(f+"층으로 이동합니다");
}

function leaveElevator(){
 if(!inElevator||!selectedBuilding||selectedBuilding.moving)return;
 const b=selectedBuilding;
 if(b.door<.94)return;

 inElevator=false;
 elevatorUI=false;
 elevatorEl.style.display="none";

 const y=b.activeFloor*4.5+2.1;
 camera.position.set(
  b.x,
  y,
  b.z+b.d/2+7
 );
 yaw=Math.PI;
 pitch=0;
 camera.rotation.set(0,Math.PI,0);
 renderer.domElement.requestPointerLock();
 showNotice("건물 "+(b.index+1)+" · "+b.activeFloor+"층 도착");
}
document.getElementById("exitLift").onclick=leaveElevator;

function enterElevator(b){
 selectedBuilding=b;
 inElevator=true;
 b.cabin.position.y=b.activeFloor*4.5;
 camera.position.set(
  b.x+b.liftX,
  b.cabin.position.y+2,
  b.z+b.liftZ
 );
 yaw=0;
 pitch=0;
 openUI();
 showNotice("건물 "+(b.index+1)+" 엘리베이터 탑승");
}

// 시작
document.getElementById("start").onclick=()=>{
 gameStarted=true;
 lock.style.display="none";
 renderer.domElement.requestPointerLock();
};
document.addEventListener("pointerlockchange",()=>{
 pointerLocked=document.pointerLockElement===renderer.domElement;
 lock.style.display=gameStarted?"none":"flex";
});
document.addEventListener("mousemove",e=>{
 if(!pointerLocked||inElevator)return;
 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=THREE.MathUtils.clamp(pitch,-1.4,1.4);
});
document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="Space")e.preventDefault();
 if(e.code==="KeyE"&&!e.repeat)interact();
});
document.addEventListener("keyup",e=>keys[e.code]=false);

// 가장 가까운 건물 찾기
function nearestBuilding(){
 let best=null,dist=Infinity;
 for(const b of buildings){
  const d=Math.hypot(camera.position.x-b.x,camera.position.z-(b.z+b.d/2+5));
  if(d<dist){dist=d;best=b;}
 }
 return {building:best,distance:dist};
}

function interact(){
 if(inElevator){
  if(!elevatorUI)openUI();
  else closeUI();
  return;
 }
 const {building,distance}=nearestBuilding();
 if(building&&distance<9&&camera.position.y<7){
  enterElevator(building);
 }else{
  showNotice("가까운 건물의 빛나는 입구로 이동해!");
 }
}

// 플레이어 이동
function updatePlayer(dt){
 if(inElevator){
  if(selectedBuilding){
   const b=selectedBuilding;
   camera.position.set(
    b.x+b.liftX,
    b.cabin.position.y+2,
    b.z+b.liftZ
   );
   camera.rotation.set(0,0,0);
  }
  return;
 }
 if(!pointerLocked)return;

 const speed=keys.ShiftLeft?29:15;
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const move=new THREE.Vector3();

 if(keys.KeyW)move.add(forward);
 if(keys.KeyS)move.sub(forward);
 if(keys.KeyD)move.add(right);
 if(keys.KeyA)move.sub(right);

 if(move.length()>0){
  move.normalize().multiplyScalar(speed*dt);
  camera.position.add(move);
 }

 if(keys.Space&&grounded){
  velocityY=9;
  grounded=false;
 }
 velocityY-=24*dt;
 camera.position.y+=velocityY*dt;

 if(camera.position.y<2){
  camera.position.y=2;
  velocityY=0;
  grounded=true;
 }

 camera.position.x=THREE.MathUtils.clamp(camera.position.x,-870,870);
 camera.position.z=THREE.MathUtils.clamp(camera.position.z,-570,570);

 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
}

// 모든 건물의 엘리베이터 애니메이션
function updateAllElevators(dt){
 for(const b of buildings){
  b.door=THREE.MathUtils.damp(b.door,b.doorTarget,5,dt);
  b.doorL.position.x=-.7-b.door*1.15;
  b.doorR.position.x=.7+b.door*1.15;

  if(b.moving){
   const diff=b.targetY-b.cabin.position.y;
   b.cabin.position.y+=Math.sign(diff)*Math.min(Math.abs(diff),85*dt);

   if(Math.abs(diff)<.5){
    b.cabin.position.y=b.targetY;
    b.moving=false;
    b.doorTarget=1;
    showNotice(b.activeFloor+"층 도착!");
    if(selectedBuilding===b&&inElevator){
     // 도착 후 층 선택/하차 UI 표시
     openUI();
    }
   }
  }
 }
}

// 메인 애니메이션
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const t=clock.elapsedTime;

 // 건물별 조명 맥동
 for(const b of buildings){
  const pulse=.65+Math.sin(t*1.7+b.phase)*.3;
  b.lm.opacity=pulse;
  b.g.children.forEach((obj,i)=>{
   if(obj.material&&obj.material.transparent&&obj.material.blending===THREE.AdditiveBlending){
    // 건물마다 다른 속도로 반짝임
   }
  });
 }

 // 빔이 좌우 회전 + 위아래 기울기 + 밝기 변화
 beamUnits.forEach((b,i)=>{
  b.pivot.rotation.y=Math.sin(t*.34+b.phase)*1.3;
  b.pivot.rotation.z=Math.sin(t*.58+b.phase*1.7)*.85;
  b.outer.material.opacity=.07+(.05*(.5+.5*Math.sin(t*2+b.phase)));
  b.core.material.opacity=.2+(.15*(.5+.5*Math.sin(t*2.5+b.phase)));
  b.haze.material.opacity=.025+(.025*(.5+.5*Math.sin(t*1.4+b.phase)));
 });

 // 시민 이동
 for(let i=0;i<200;i++){
  const p=crowdData[i];
  p.phase+=dt*p.speed*.12;
  dummy.position.set(p.x+Math.sin(p.phase)*1.2,.8,p.z+Math.cos(p.phase)*1.2);
  dummy.rotation.set(0,p.phase,0);
  dummy.scale.set(1,1,1);
  dummy.updateMatrix();
  crowd.setMatrixAt(i,dummy.matrix);
 }
 crowd.instanceMatrix.needsUpdate=true;

 // 공중 교통
 vehicles.forEach(v=>{
  v.a+=dt*v.s;
  v.g.position.set(Math.cos(v.a)*v.r,v.y+Math.sin(t+v.a)*2,Math.sin(v.a)*v.r);
  v.g.rotation.y=-v.a;
 });

 // 바다 반사선
 seaLines.forEach((l,i)=>{
  l.position.x=Math.sin(t*.18+i)*18;
 });

 updateAllElevators(dt);
 updatePlayer(dt);

 if(!inElevator){
  const near=nearestBuilding();
  const visible=near.distance<10&&camera.position.y<7;
  promptEl.style.display=visible?"block":"none";
  document.getElementById("buildingText").textContent=
   visible?"건물 "+(near.building.index+1)+" · E 키":"주변 건물 탐색 중";
 }else{
  promptEl.style.display="none";
  document.getElementById("buildingText").textContent=
   "건물 "+(selectedBuilding.index+1)+" 엘리베이터";
 }

 document.getElementById("heightText").textContent=
  "고도 "+Math.max(0,Math.round(camera.position.y))+"m";

 composer.render();
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 composer.setSize(innerWidth,innerHeight);
});
</script>
</body>
