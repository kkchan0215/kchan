<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>글 게시판</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f3e5f5; color: #4a148c; }
  header { background: #ce93d8; padding: 10px; margin-bottom: 20px; color: white; }
  button { padding: 8px 16px; font-size: 14px; cursor: pointer; background: #ab47bc; color: white; border: none; border-radius: 4px; margin-top: 5px; }
  button:hover { background: #8e24aa; }
  section { margin-bottom: 30px; }
  .post { border: 1px solid #ba68c8; padding: 10px; margin-bottom: 10px; background: #f3e5f5; border-radius: 5px; position: relative; }
  .post h3 { margin: 0 0 5px 0; }
  .author { font-size: 12px; font-weight: bold; margin-bottom: 5px; }
  .like-btn { color: #4a148c; cursor: pointer; margin-left: 5px; }
  .delete-btn { color: red; cursor: pointer; position: absolute; top: 10px; right: 10px; font-size: 12px; }

  /* 모달 스타일 */
  .modal {
    display: none; 
    position: fixed; 
    z-index: 100; 
    left: 0; top: 0; width: 100%; height: 100%; 
    background-color: rgba(0,0,0,0.5); 
  }
  .modal-content {
    background-color: #f3e5f5;
    margin: 10% auto; 
    padding: 20px; 
    border: 1px solid #ba68c8; 
    width: 300px; 
    border-radius: 8px;
    color: #4a148c;
  }
  .modal-content input, .modal-content textarea {
    width: 100%;
    margin-bottom: 10px;
    padding: 5px;
    border: 1px solid #ce93d8;
    border-radius: 4px;
  }
</style>
<script>
  const ADMIN_ID = "kkchan0215";
  const ADMIN_PW = "kk215gksk!!^^";
  let currentUser = null;

  // 회원가입
  function signUp() {
    const nickname = prompt("닉네임을 입력하세요");
    if (!nickname) return;
    currentUser = nickname;
    alert(`환영합니다, ${currentUser}! ✅`);
  }

  // 관리자 로그인
  function adminLogin() {
    const id = prompt("관리자 아이디 입력");
    const pw = prompt("관리자 비밀번호 입력");

    if(id === ADMIN_ID && pw === ADMIN_PW) {
      currentUser = ADMIN_ID;
      alert("관리자 로그인 성공! 🎉");
    } else {
      alert("아이디 또는 비밀번호 틀림 ❌");
    }
  }

  // 글쓰기 모달 열기
  function openPostModal() {
    if(!currentUser) {
      alert("글 작성하려면 먼저 회원가입 또는 관리자 로그인 해주세요!");
      return;
    }
    document.getElementById("postModal").style.display = "block";
  }

  // 글쓰기 모달 닫기
  function closePostModal() {
    document.getElementById("postModal").style.display = "none";
  }

  // 글 추가
  function submitPost() {
    const titleInput = document.getElementById("postTitle");
    const contentInput = document.getElementById("postContent");
    const title = titleInput.value.trim();
    const content = contentInput.value.trim();
    if(!title || !content) {
      alert("제목과 내용을 모두 입력해주세요!");
      return;
    }

    const feed = document.getElementById("feed");
    const postDiv = document.createElement("div");
    postDiv.className = "post";
    postDiv.dataset.author = currentUser;

    postDiv.innerHTML = `
      <div class="author">작성자: ${currentUser}</div>
      <h3>${title}</h3>
      <p>${content}</p>
      <span class="like-btn" onclick="likePost(this)">👍 0</span>
      <span class="delete-btn" onclick="deletePost(this)">삭제</span>
    `;

    feed.insertBefore(postDiv, feed.firstChild);

    // 모달 닫기 및 입력 초기화
    titleInput.value = "";
    contentInput.value = "";
    closePostModal();
  }

  // 좋아요 기능
  function likePost(el) {
    let text = el.textContent;
    let parts = text.split(" ");
    let count = parseInt(parts[1]) || 0;
    count++;
    el.textContent = `👍 ${count}`;
  }

  // 글 삭제 기능
  function deletePost(el) {
    const postDiv = el.parentElement;
    const author = postDiv.dataset.author;
    if(currentUser === ADMIN_ID || currentUser === author) {
      if(confirm("정말 삭제하시겠습니까?")) {
        postDiv.remove();
      }
    } else {
      alert("삭제 권한이 없습니다 ❌");
    }
  }

  // 모달 클릭 시 닫기
  window.onclick = function(event) {
    const modal = document.getElementById("postModal");
    if(event.target == modal) {
      modal.style.display = "none";
    }
  }
</script>
</head>
<body>
  <header>
    <h1>글 게시판</h1>
    <button onclick="adminLogin()">관리자 로그인</button>
  </header>

  <section>
    <h2>회원가입</h2>
    <button onclick="signUp()">회원가입 / 닉네임 설정</button>
  </section>

  <section>
    <h2>글쓰기</h2>
    <button onclick="openPostModal()">글쓰기</button>
  </section>

  <!-- 모달 창 -->
  <div id="postModal" class="modal">
    <div class="modal-content">
      <h3>새 글 작성</h3>
      <input type="text" id="postTitle" placeholder="제목 입력">
      <textarea id="postContent" rows="5" placeholder="내용 입력"></textarea>
      <button onclick="submitPost()">작성 완료</button>
      <button onclick="closePostModal()">취소</button>
    </div>
  </div>

  <section>
    <h2>피드</h2>
    <div id="feed">
      <!-- 글들이 피드형으로 표시 -->
    </div>
  </section>
</body>
</html>
