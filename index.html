<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍀 행운 룰렛 🍀</title>

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    font-family:'Jua',sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ffd6f5,#c9f4ff,#fff3b0,#d8ffd8);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.star{
    position:fixed;
    animation:float 8s linear infinite;
    pointer-events:none;
}

@keyframes float{
    from{
        transform:translateY(110vh) rotate(0deg);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    to{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}

.container{
    width:340px;
    text-align:center;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(10px);
    border-radius:30px;
    padding:25px;
    box-shadow:
    0 0 20px #ff8fd9,
    0 0 50px #9be7ff,
    0 0 80px #ffe37d;
}

h1{
    color:#ff5db1;
    margin-bottom:10px;
}

.top{
    font-size:50px;
    margin-bottom:10px;
}

.viewport{
    width:280px;
    height:90px;
    overflow:hidden;
    margin:auto;
    border-radius:20px;
    border:5px solid #ff9ad8;
    background:white;
    box-shadow:0 0 20px #ff9ad8;
}

.track{
    display:flex;
    align-items:center;
    height:100%;
}

.item{
    min-width:280px;
    height:90px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
}

.win{
    color:#00b050;
    text-shadow:
    0 0 10px #00ff88,
    0 0 20px #00ff88;
}

.lose{
    color:#ff4040;
    text-shadow:
    0 0 10px #ff8080,
    0 0 20px #ff8080;
}

button{
    margin-top:20px;
    border:none;
    border-radius:20px;
    padding:14px 30px;
    font-size:24px;
    color:white;
    background:linear-gradient(45deg,#ff7ac8,#ff9e5d);
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.08);
}

#result{
    margin-top:15px;
    font-size:34px;
    min-height:50px;
}

.jackpot{
    animation:glow .8s infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:
        0 0 10px #fff,
        0 0 20px #00ff88;
    }
    to{
        text-shadow:
        0 0 20px #fff,
        0 0 50px #00ff88;
    }
}

.firework{
    position:fixed;
    font-size:45px;
    animation:boom 1.5s forwards;
    pointer-events:none;
}

@keyframes boom{
    from{
        transform:scale(0);
        opacity:1;
    }
    to{
        transform:scale(4);
        opacity:0;
    }
}
</style>
</head>
<body>

<div class="container">

<div class="top">🐰🍀🐻</div>

<h1>행운 룰렛</h1>

<div class="viewport">
    <div class="track" id="track"></div>
</div>

<button onclick="spin()">🎰 돌리기</button>

<div id="result"></div>

</div>

<script>

for(let i=0;i<30;i++){
    const s=document.createElement("div");
    s.className="star";
    s.innerHTML=Math.random()>0.5?"⭐":"✨";
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=(15+Math.random()*25)+"px";
    s.style.animationDuration=(5+Math.random()*8)+"s";
    s.style.animationDelay=Math.random()*5+"s";
    document.body.appendChild(s);
}

const itemsBase=[
"꽝","꽝","꽝","꽝","꽝",
"꽝","꽝","꽝","꽝","꽝",
"당첨","당첨","당첨","당첨","당첨"
];

const track=document.getElementById("track");

for(let r=0;r<40;r++){

    const mix=[...itemsBase]
    .sort(()=>Math.random()-0.5);

    mix.forEach(t=>{

        const d=document.createElement("div");

        d.className="item";

        if(t==="당첨"){
            d.classList.add("win");
            d.innerHTML="🍀 당첨 🍀";
        }else{
            d.classList.add("lose");
            d.innerHTML="💥 꽝 💥";
        }

        track.appendChild(d);

    });

}

let spinning=false;

function spin(){

    if(spinning) return;

    spinning=true;

    document.getElementById("result").innerHTML="";

    const items=document.querySelectorAll(".item");

    const target=Math.floor(Math.random()*items.length);

    const move=target*280;

    track.style.transition=
    "transform 5s cubic-bezier(.12,.85,.18,1)";

    track.style.transform=
    `translateX(-${move}px)`;

    setTimeout(()=>{

        const result=items[target].textContent;

        if(result.includes("당첨")){

            document.getElementById("result").innerHTML=
            '<div class="jackpot">🏆🍀 JACKPOT 🍀🏆</div>';

            for(let i=0;i<20;i++){

                const f=document.createElement("div");

                f.className="firework";

                f.innerHTML=
                ["🎉","✨","🎊","🌟"][Math.floor(Math.random()*4)];

                f.style.left=Math.random()*100+"vw";
                f.style.top=Math.random()*100+"vh";

                document.body.appendChild(f);

                setTimeout(()=>{
                    f.remove();
                },1500);
            }

        }else{

            document.getElementById("result").innerHTML=
            "😭💥 꽝 💥😭";

        }

        spinning=false;

    },5000);

}

</script>

</body>
</html>
