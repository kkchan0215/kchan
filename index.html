<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>룰렛 스핀</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f5f5ff;
    padding-top:50px;
}

.viewport{
    width:250px;
    height:80px;
    margin:auto;
    overflow:hidden;
    border:4px solid #333;
    border-radius:15px;
    background:white;
    position:relative;
}

.track{
    display:flex;
    align-items:center;
    height:100%;
    transition:none;
}

.item{
    min-width:250px;
    height:80px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    font-weight:bold;
}

button{
    margin-top:20px;
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-size:24px;
}
</style>
</head>
<body>

<h1>🎰 룰렛 스핀</h1>

<div class="viewport">
    <div class="track" id="track"></div>
</div>

<button onclick="spin()">돌리기</button>

<div id="result"></div>

<script>

const baseItems=[
"꽝","꽝","꽝","꽝","꽝",
"꽝","꽝","꽝","꽝","꽝",
"당첨","당첨","당첨","당첨","당첨"
];

const track=document.getElementById("track");

for(let i=0;i<20;i++){
    let shuffled=[...baseItems].sort(()=>Math.random()-0.5);

    shuffled.forEach(text=>{
        const div=document.createElement("div");
        div.className="item";
        div.textContent=text;
        track.appendChild(div);
    });
}

let spinning=false;

function spin(){

    if(spinning) return;

    spinning=true;

    const items=document.querySelectorAll(".item");

    const target=Math.floor(Math.random()*items.length);

    const move=target*250;

    track.style.transition="transform 4s cubic-bezier(.1,.8,.2,1)";
    track.style.transform=`translateX(-${move}px)`;

    setTimeout(()=>{

        const result=items[target].textContent;

        document.getElementById("result").innerHTML=
        result==="당첨"
        ? "🎉 당첨!"
        : "❌ 꽝";

        spinning=false;

    },4000);
}

</script>

</body>
</html>
