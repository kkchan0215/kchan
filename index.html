<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Score Board</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 150px);
    gap: 20px;
  }

  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    transition: transform 0.15s, background 0.15s;
  }

  .card.active {
    background: #3b82f6;
    transform: scale(1.08);
  }

  .country {
    font-size: 14px;
    opacity: 0.7;
  }

  .score {
    font-size: 28px;
    font-weight: bold;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="grid" id="board"></div>

<script>
const scores = {
  Korea: 0,
  Thailand: 0,
  Japan: 0,
  USA: 0,
  Vietnam: 0,
  China: 0
};

const keyMap = {
  "1": ["Korea", 5],   "2": ["Korea", 50000],
  "3": ["Thailand", 5],"4": ["Thailand", 50],
  "5": ["Japan", 5],   "6": ["Japan", 50],
  "7": ["USA", 5],     "8": ["USA", 50],
  "9": ["Vietnam", 5], "0": ["Vietnam", 50],
  "-": ["China", 5],   "=": ["China", 50]
};

const board = document.getElementById("board");

// 카드 생성
Object.keys(scores).forEach(country => {
  const card = document.createElement("div");
  card.className = "card";
  card.id = country;

  card.innerHTML = `
    <div class="country">${country}</div>
    <div class="score">0</div>
  `;

  board.appendChild(card);
});

// 키 입력
document.addEventListener("keydown", ({ key }) => {
  const data = keyMap[key];
  if (!data) return;

  const [country, point] = data;
  scores[country] += point;

  const card = document.getElementById(country);
  const scoreEl = card.querySelector(".score");

  scoreEl.textContent = scores[country];

  card.classList.add("active");
  setTimeout(() => card.classList.remove("active"), 150);
});
</script>

</body>
</html>
