<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제2회 성경퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5fa;color:#273047;font-family:'Gowun Dodum',sans-serif}
header{background:linear-gradient(135deg,#4359ad,#8998e5);color:white;text-align:center;padding:35px 15px;border-radius:0 0 28px 28px}
header h1{margin:0;font-size:27px}
header p{margin:8px 0 0;font-size:14px}
main{max-width:760px;margin:22px auto;padding:0 14px}
.card{background:white;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 5px 22px #25345a10}
h2{margin:0 0 16px}
button{font-family:inherit;font-size:16px;font-weight:bold;border:0;border-radius:13px;padding:14px;cursor:pointer}
.primary{background:#5065c4;color:white}
.secondary{background:#edf0fc;color:#465bb5}
.full{width:100%;margin-top:12px}
.hidden{display:none!important}
.small{font-size:13px;color:#858ca0;line-height:1.6}
.tag{display:inline-block;background:#eef0ff;color:#4c60bb;padding:6px 12px;border-radius:20px;font-size:13px}
.progress{height:8px;background:#eceef5;border-radius:20px;margin:17px 0;overflow:hidden}
.progress div{height:100%;background:#5b70d0;width:0;transition:.2s}
.question{font-size:21px;line-height:1.7;margin:25px 0}
input{width:100%;padding:16px;border:2px solid #e4e7f0;border-radius:13px;font:17px 'Gowun Dodum';outline:none}
input:focus{border-color:#586dcc}
.actions{display:flex;gap:10px;margin-top:12px}
.actions button{flex:1}
.feedback{margin-top:14px;line-height:1.6}
.good{color:#19845a}.bad{color:#d34b58}
.score{text-align:center;font-size:43px;color:#5065c4;font-weight:bold}
.table-wrap{overflow-x:auto;margin-top:15px}
table{border-collapse:collapse;width:100%;min-width:590px;font-size:14px}
th,td{padding:12px;border-bottom:1px solid #e9ebf2;text-align:left;vertical-align:top}
th{background:#eef0fc}
td:last-child{color:#4359b1;font-weight:bold}
.review{padding:13px 0;border-bottom:1px solid #eee;line-height:1.6}
@media(max-width:450px){.card{padding:18px}.question{font-size:19px}}
</style>
</head>
<body>
<header>
<h1>📖 제2회 성경퀴즈</h1>
<p>원본 예상문제 50문항 · 주관식 퀴즈</p>
</header>
<main>
<section class="card" id="home">
<span class="tag">BIBLE QUIZ</span>
<h2 style="margin-top:15px">말씀 퀴즈에 도전해 보세요!</h2>
<p>원본 문제 문장을 그대로 사용합니다. 문제 순서는 매번 무작위로 섞입니다.</p>
<p class="small">총 50문제 · 쉬움·보통·어려움 섞어서 출제</p>
<button class="primary full" onclick="startQuiz()">퀴즈 시작하기 →</button>
<button class="secondary full" onclick="openAnswers()">정답지 보기</button>
</section>

<section class="card hidden" id="quiz">
<div style="display:flex;justify-content:space-between">
<span class="tag" id="level"></span>
<span class="small" id="counter"></span>
</div>
<div class="progress"><div id="bar"></div></div>
<div class="question" id="question"></div>
<input id="answer" placeholder="정답을 입력하세요" autocomplete="off">
<div class="actions">
<button class="secondary" onclick="skip()">건너뛰기</button>
<button class="primary" onclick="checkAnswer()">정답 확인</button>
</div>
<div class="feedback" id="feedback"></div>
</section>

<section class="card hidden" id="result">
<h2 style="text-align:center">퀴즈 완료!</h2>
<div class="score" id="score"></div>
<p id="summary" style="text-align:center"></p>
<button class="primary full" onclick="showReview()">채점 결과 보기</button>
<button class="secondary full" onclick="goHome()">처음으로</button>
</section>

<section class="card hidden" id="review">
<h2>채점 결과</h2>
<div id="reviewList"></div>
<button class="primary full" onclick="goHome()">처음으로</button>
</section>

<section class="card hidden" id="answers">
<h2>📋 전체 정답지</h2>
<p class="small">원본 문제 번호와 문장, 정답입니다.</p>
<div class="table-wrap">
<table>
<thead><tr><th>번호</th><th>난이도</th><th>문제</th><th>정답</th></tr></thead>
<tbody id="answerRows"></tbody>
</table>
</div>
<button class="secondary full" onclick="goHome()">닫기</button>
</section>
</main>

<script>
const data = [
[1,"보혜사 성령님은 누구를 증언하고 누구를 잘 믿을 수 있도록 도와주실까요?","예수님",1],
[2,"우리가 무슨 일을 할 때마다 하나님께서 ( )인지 물으며 행동해야 하나요?","기뻐하시는 일",1],
[3,"보혜사 곧 아버지께서 내 이름으로 보내실 ( ) 그가 너희에게 모든 것을 가르치고 내가 너희에게 말한 모든 것을 ( )나게 하리라","성령, 생각",2],
[4,"성부 하나님, 성자 예수님, 성령 하나님은 ( )이신 하나님입니다.","삼위일체",2],
[5,"성령 하나님께서 우리를 ( ) 가운데로 인도하십니다.","진리",1],
[6,"하나님께서 우리에게 주시는 가장 좋은 선물은 무엇일까요?","성령",1],
[7,"우리는 연약합니다. 오직 성령이 우리의 연약함과 ( )를 도우십니다.","기도",1],
[8,"로마서 8:16 ( )안을 쓰세요. 성령이 친히 우리의 영과 더불어 우리가 ( )인 것을 증언하시나니","하나님의 자녀",2],
[9,"성령으로 충만하면 성령님께서 알려주시는 ( )을 전할 수 있습니까?","복음",1],
[10,"하나님의 성령을 근심하게 하는 것은 무엇일까요?","죄, 불순종",1],
[11,"하나님은 ( )을 통해 우리에게 하나님의 뜻을 알게 하실까요? 우리의 마음을 밝히셔서 ( )을 깨닫게 하시는 분은 누구실까요?","말씀, 성령",2],
[12,"로마서 3장 23절을 쓰세요.","모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니",3],
[13,"(OX문제) 자신의 힘과 노력으로 하나님 나라에 들어갈 수 없어서 예수님이 세상에 오셨다.","O",1],
[14,"싸움과 다툼이 일어나는 것은 우리 속에 무엇이 있기 때문일까요?","욕심",1],
[15,"마음속에 일어나는 여러 가지 욕구들을 무엇으로 다스려야 할까요?","성령",2],
[16,"베드로전서 5장 8절을 쓰세요. ( ) 너희 대적 마귀가 우는 사자 같이 두루 다니며 삼킬 자를 찾나니","근신하라 깨어라",3],
[17,"사자가 사냥감을 노리듯이 우리를 공격할 기회를 노리는 우리의 원수는 무엇일까요?","마귀",1],
[18,"아담 이후 모든 사람이 죄를 지었고 무엇과 무엇이 죽게 되었습니까?","몸과 영혼",2],
[19,"만일 우리가 우리 죄를 자백하면 우리 죄를 용서하시고 우리 죄를 어떻게 해주실까요?","깨끗하게 하신다",2],
[20,"자기의 죄나 잘못을 다른 사람이나 하나님께 스스로 고백하는 것을 무엇이라 하는가?","자백",1],
[21,"아무리 큰 죄를 지었어도 진심으로 회개하고 악에서 돌이키면 하나님은 ( )하십니다.","용서",1],
[22,"이스라엘 백성들은 광야에서 이동하기 쉽게 무엇을 치고 지냈을까요?","천막",1],
[23,"하나님은 광야에서 열두 지파에게 어디로 모이고 함께 행진하라고 하셨나요?","회막",2],
[24,"유다 백성들은 바벨론 포로로 끌려가 하나님의 은혜로 몇 년 만에 고향에 돌아왔나요?","70년",1],
[25,"이스라엘 백성들은 절기 (명절)를 지키려고 어디에 모였나요?","예루살렘",1],
[26,"이방의 여러 교회들이 어려워진 예루살렘 교회를 도왔어요. 서로 함께 도우는 것은 무엇 때문일까요?","연대감",2],
[27,"사도행전 16:31을 쓰세요.","주 예수를 믿으라 그리하면 너와 네 집이 구원을 받으리라 하고",3],
[28,"빈칸을 채워보세요. 여호와를 ( )하며 그의 길을 걷는 자마다 ( )이 있도다.","경외, 복",2],
[29,"하나님과 화목하기 위해 내가 할 수 있는 일은 무엇인가요?","회개 기도",1],
[30,"다툰 친구와 화목하기 위해 내가 할 수 있는 일은 무엇인가요?","내가 먼저 사과한다",1],
[31,"이스라엘 백성에게 가나안에 가면 그들을 불쌍히 여기지 말고 어떻게 하라고 하셨나요?","진멸",2],
[32,"임마누엘의 뜻은 무엇입니까?","하나님이 우리와 함께 계시다",1],
[33,"예수님이 태어난 마을 이름은 무엇입니까?","베들레헴",1],
[34,"동방박사들이 마리아를 찾아와 아기 예수께 무엇을 드렸나요?","황금, 유향, 몰약",1],
[35,"유대 광야에서 천국이 가까이 왔다고 외친 사람은 누구입니까?","세례 요한",1],
[36,"요한 자신은 물로 세례를 베풀었지만 자기 뒤에 오시는 분은 무엇으로 세례를 주신다고 하였나요?","성령과 불",2],
[37,"예수님은 마귀에게 시험받기 전에 며칠을 금식하셨습니까?","40일",1],
[38,"예수님은 마귀의 세 번째 시험에서 어떤 말로 마귀를 물리치셨습니까?","사탄아 물러가라",2],
[39,"자신들의 아버지 세베대와 그물을 깁다가 예수님께 부름받고 제자가 된 두 사람은?","야고보, 요한",2],
[40,"예수님은 산상수훈에서 온유한 자는 어떤 복을 받을 것이라고 하셨습니까?","땅을 기업으로 받는다",2],
[41,"예물을 드리다가 형제에게 원망들을 만한 일이 있으면 어떻게 해야 한다고 하셨나요?","형제와 먼저 화해하라",2],
[42,"주님은 우리가 기도 때 어디에 들어가서 문을 닫고 은밀히 기도하라고 하셨습니까?","골방",1],
[43,"주님은 무엇을 구해야 모든 것을 우리에게 더하신다고 말씀하셨습니까?","그의 나라와 그의 의",2],
[44,"이 문은 좁고 협착하여 그곳을 찾는 사람이 적다고 하신 이 문은 어떤 문입니까?","생명으로 인도하는 문",2],
[45,"씨뿌리는 자의 비유에서 좋은 땅에 떨어진 씨는 몇 배의 결실을 맺게 됩니까?","100배, 60배, 30배",2],
[46,"떡 다섯 개와 물고기 두 마리로 오천 명을 먹이고 남은 음식은 얼마나 되었나요?","12바구니",1],
[47,"주는 그리스도시오 살아계신 하나님의 아들이라 고백한 예수님의 제자는 누구인가요?","베드로",1],
[48,"혼인 잔치 비유에서 임금이 마련한 혼인 잔치에 참석한 사람 중 밖으로 쫓겨난 사람은 어떤 사람인가요?","예복을 입지 않은 사람",2],
[49,"율법사가 주님께 여쭤본 계명이 가장 큰 문자 주님이 말씀하신 두 가지는 무엇인가요?","하나님사랑, 이웃사랑",2],
[50,"빌라도에게 예수의 시체를 달라고 하여 바위 속 무덤에 넣어둔 사람은 누구입니까?","아리마대 요셉",2]
];

let deck=[],index=0,records=[],locked=false;

function hideAll(){
 ["home","quiz","result","review","answers"].forEach(id=>document.getElementById(id).classList.add("hidden"));
}
function shuffle(arr){
 let a=[...arr];
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function startQuiz(){
 deck=shuffle(data);
 index=0;records=[];
 hideAll();
 document.getElementById("quiz").classList.remove("hidden");
 render();
}
function render(){
 locked=false;
 const q=deck[index];
 document.getElementById("level").textContent=["","쉬움","보통","어려움"][q[3]];
 document.getElementById("counter").textContent=(index+1)+" / "+deck.length;
 document.getElementById("bar").style.width=(index/deck.length*100)+"%";
 document.getElementById("question").textContent=q[0]+". "+q[1];
 document.getElementById("answer").value="";
 document.getElementById("answer").disabled=false;
 document.getElementById("feedback").textContent="";
 document.getElementById("answer").focus();
}
function normalize(s){
 return s.toLowerCase().replace(/\s/g,"").replace(/[.,!?·~'"]/g,"");
}
function checkAnswer(){
 if(locked)return;
 let val=document.getElementById("answer").value.trim();
 if(!val){document.getElementById("feedback").textContent="정답을 입력해 주세요.";return;}
 const q=deck[index];
 const ok=normalize(val)===normalize(q[2]);
 records.push({number:q[0],question:q[1],input:val,answer:q[2],ok});
 locked=true;
 document.getElementById("answer").disabled=true;
 document.getElementById("feedback").innerHTML=ok?
 '<span class="good">정답입니다! 다음 문제로 넘어갑니다.</span>':
 '<span class="bad">오답입니다. 정답: '+q[2]+'</span>';
 setTimeout(nextQuestion,1100);
}
function skip(){
 if(locked)return;
 const q=deck[index];
 records.push({number:q[0],question:q[1],input:"건너뜀",answer:q[2],ok:false});
 locked=true;
 document.getElementById("answer").disabled=true;
 document.getElementById("feedback").innerHTML='<span class="bad">정답: '+q[2]+'</span>';
 setTimeout(nextQuestion,1100);
}
function nextQuestion(){
 index++;
 if(index>=deck.length){finish();return;}
 render();
}
function finish(){
 hideAll();
 document.getElementById("result").classList.remove("hidden");
 let correct=records.filter(x=>x.ok).length;
 document.getElementById("score").textContent=correct+" / 50";
 document.getElementById("summary").textContent="정답률 "+Math.round(correct/50*100)+"%";
 document.getElementById("bar").style.width="100%";
}
function showReview(){
 hideAll();
 document.getElementById("review").classList.remove("hidden");
 const wrong=records.filter(x=>!x.ok);
 document.getElementById("reviewList").innerHTML=wrong.length?
 wrong.map(x=>`<div class="review">
 <b>${x.number}. ${x.question}</b>
 <p class="bad">내 답: ${x.input}</p>
 <p class="good">정답: ${x.answer}</p>
 </div>`).join(""):"<p class='good'>모든 문제를 맞혔어요!</p>";
}
function openAnswers(){
 hideAll();
 document.getElementById("answers").classList.remove("hidden");
 document.getElementById("answerRows").innerHTML=data.map(q=>`
 <tr><td>${q[0]}</td><td>${["","쉬움","보통","어려움"][q[3]]}</td><td>${q[1]}</td><td>${q[2]}</td></tr>
 `).join("");
}
function goHome(){
 hideAll();
 document.getElementById("home").classList.remove("hidden");
}
document.getElementById("answer").addEventListener("keydown",e=>{
 if(e.key==="Enter")checkAnswer();
});
</script>
</body>
</html>
