<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>글 게시판</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{font-family:sans-serif;background:#f3ecff;margin:0;padding:20px}
.card{background:#E6D6FF;padding:15px;margin-bottom:15px;border-radius:15px}
button{padding:6px 10px;border:none;border-radius:8px;background:#b57cff;color:white;margin-top:5px;cursor:pointer}
input,textarea{width:100%;margin:5px 0;padding:8px;border-radius:8px;border:1px solid #ccc}
</style>
</head>
<body>

<h2>💜 글 게시판 💜</h2>

<div id="auth">
  <input id="email" placeholder="이메일">
  <input id="password" type="password" placeholder="비밀번호">
  <button onclick="signup()">회원가입</button>
  <button onclick="login()">로그인</button>
</div>

<div id="write" style="display:none">
  <input id="title" placeholder="제목">
  <textarea id="content" placeholder="내용"></textarea>
  <button onclick="addPost()">글 추가</button>
  <button id="adminDeleteAll" style="display:none;background:red" onclick="deleteAll()">전체 글 삭제</button>
</div>

<div id="feed"></div>

<script>
const firebaseConfig = {
  apiKey: "여기에넣기",
  authDomain: "여기에넣기",
  projectId: "여기에넣기",
  storageBucket: "여기에넣기",
  messagingSenderId: "여기에넣기",
  appId: "여기에넣기"
};
firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

const ADMIN_EMAIL="kkchan0215";
const ADMIN_CODE="강차니k215";
let currentUser=null;
let currentName="";
let isAdmin=false;

function safe(t){return (t||"").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

auth.onAuthStateChanged(async user=>{
  if(user){
    currentUser=user;
    document.getElementById("auth").style.display="none";
    document.getElementById("write").style.display="block";

    const doc=await db.collection("users").doc(user.uid).get();
    currentName=doc.data()?.name || "익명";

    if(user.email===ADMIN_EMAIL){
      const code=prompt("관리자 비밀번호 입력");
      if(code===ADMIN_CODE){
        isAdmin=true;
        adminDeleteAll.style.display="block";
      }else{
        alert("관리자 비밀번호 틀림");
      }
    }
    loadPosts();
  }
});

function signup(){
  auth.createUserWithEmailAndPassword(email.value,password.value)
  .then(cred=>{
    const name=prompt("닉네임 입력");
    db.collection("users").doc(cred.user.uid).set({name:name});
  });
}

function login(){auth.signInWithEmailAndPassword(email.value,password.value);}

function addPost(){
  db.collection("posts").add({
    title:title.value,
    content:content.value,
    uid:currentUser.uid,
    name:currentName,
    time:new Date(),
    likes:[]
  });
  title.value="";content.value="";
}

function loadPosts(){
  db.collection("posts").orderBy("time","desc")
  .onSnapshot(snap=>{
    feed.innerHTML="";
    snap.forEach(doc=>{
      const p=doc.data();
      feed.innerHTML+=`
      <div class="card">
        <h3>${safe(p.title)}</h3>
        <p>${safe(p.content)}</p>
        <div>작성자: ${safe(p.name)}</div>

        <button onclick="like('${doc.id}')">❤️ ${p.likes?.length||0}</button>

        ${(p.uid===currentUser.uid || isAdmin)
          ? `<button onclick="del('${doc.id}')">삭제</button>`:""}

        <div>
          <input id="cmt-${doc.id}" placeholder="댓글쓰기">
          <button onclick="addComment('${doc.id}')">댓글</button>
          <div id="comments-${doc.id}"></div>
        </div>
      </div>`;
      loadComments(doc.id);
    });
  });
}

function del(id){db.collection("posts").doc(id).delete();}

function deleteAll(){
  db.collection("posts").get().then(snap=>snap.forEach(d=>d.ref.delete()));
}

function like(id){
  const ref=db.collection("posts").doc(id);
  ref.get().then(doc=>{
    const likes=doc.data().likes||[];
    if(likes.includes(currentUser.uid)){
      ref.update({likes:firebase.firestore.FieldValue.arrayRemove(currentUser.uid)});
    }else{
      ref.update({likes:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)});
    }
  });
}

function addComment(postId){
  const text=document.getElementById("cmt-"+postId).value;
  db.collection("posts").doc(postId).collection("comments").add({
    text:text,name:currentName,time:new Date()
  });
}

function loadComments(postId){
  db.collection("posts").doc(postId).collection("comments")
  .orderBy("time")
  .onSnapshot(snap=>{
    const box=document.getElementById("comments-"+postId);
    box.innerHTML="";
    snap.forEach(d=>{
      box.innerHTML+=`<div>💬 ${safe(d.data().name)}: ${safe(d.data().text)}</div>`;
    });
  });
}
</script>
</body>
</html>
