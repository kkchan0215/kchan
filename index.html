<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>틱톡 좋아요 순위</title>

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Jua',sans-serif;
}

body{
  background:linear-gradient(180deg,#ffd7ea,#fff1f7);
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:750px;
  margin:auto;
}

.title{
  text-align:center;
  font-size:48px;
  color:#ff2f6d;
  margin-bottom:20px;
}

.live{
  text-align:center;
  color:#ff2f6d;
  margin-bottom:20px;
  font-size:20px;
}

.box{
  background:white;
  padding:20px;
  border-radius:25px;
  margin-bottom:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.input-group{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

input{
  flex:1;
  padding:14px;
  border:none;
  border-radius:15px;
  background:#ffe4ef;
  font-size:18px;
  outline:none;
}

button{
  border:none;
  border-radius:15px;
  padding:14px 18px;
  background:#ff4f88;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:hover{
  transform:scale(1.03);
}

.ranking{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.card{
  background:white;
  border-radius:22px;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 6px 15px rgba(0,0,0,0.08);
  animation:pop .3s ease;
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.9);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.left{
  display:flex;
  align-items:center;
  gap:15px;
}

.rank{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#ff4f88;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
}

.name{
  font-size:25px;
  color:#333;
}

.likes{
  font-size:33px;
  color:#ff2f6d;
}

.actions{
  margin-top:8px;
  display:flex;
  gap:8px;
}

.small-btn{
  padding:8px 12px;
  font-size:14px;
}

.gold{
  background:linear-gradient(90deg,#ffe27a,#fff3bc);
}

.silver{
  background:linear-gradient(90deg,#e1e1e1,#f8f8f8);
}

.bronze{
  background:linear-gradient(90deg,#ffc08f,#ffe0c4);
}

</style>
</head>
<body>

<div class="container">

  <div class="title">
    💖 틱톡 좋아요 순위 💖
  </div>

  <div class="live">
    🔴 실시간 느낌 수동 랭킹
  </div>

  <div class="box">

    <div class="input-group">
      <input type="text" id="name" placeholder="닉네임">
      <input type="number" id="likes" placeholder="좋아요 수">
    </div>

    <button onclick="addUser()">
      추가하기 ✨
    </button>

  </div>

  <div class="ranking" id="ranking"></div>

</div>

<script>

//////////////////////////////////////////////////
// 저장된 데이터 불러오기
//////////////////////////////////////////////////

let users = JSON.parse(localStorage.getItem("ranking")) || [];

//////////////////////////////////////////////////
// 저장
//////////////////////////////////////////////////

function saveData(){
  localStorage.setItem("ranking", JSON.stringify(users));
}

//////////////////////////////////////////////////
// 화면 출력
//////////////////////////////////////////////////

function render(){

  users.sort((a,b)=>b.likes-a.likes);

  const ranking = document.getElementById("ranking");

  ranking.innerHTML = "";

  users.forEach((user,index)=>{

    let bg = "";

    if(index===0) bg="gold";
    if(index===1) bg="silver";
    if(index===2) bg="bronze";

    ranking.innerHTML += `

    <div class="card ${bg}">

      <div class="left">

        <div class="rank">
          ${index+1}
        </div>

        <div>

          <div class="name">
            ❤️ ${user.name}
          </div>

          <div class="actions">

            <button class="small-btn"
              onclick="addLike(${index})">
              +1 ❤️
            </button>

            <button class="small-btn"
              onclick="minusLike(${index})">
              -1 💔
            </button>

            <button class="small-btn"
              onclick="removeUser(${index})">
              삭제 🗑️
            </button>

          </div>

        </div>

      </div>

      <div class="likes">
        ${user.likes.toLocaleString()}
      </div>

    </div>

    `;
  });

}

//////////////////////////////////////////////////
// 유저 추가
//////////////////////////////////////////////////

function addUser(){

  const name = document.getElementById("name").value;
  const likes = Number(document.getElementById("likes").value);

  if(name === "" || likes === ""){
    alert("입력해!");
    return;
  }

  users.push({
    name,
    likes
  });

  saveData();

  render();

  document.getElementById("name").value = "";
  document.getElementById("likes").value = "";

}

//////////////////////////////////////////////////
// 좋아요 증가
//////////////////////////////////////////////////

function addLike(index){

  users[index].likes++;

  saveData();

  render();

}

//////////////////////////////////////////////////
// 좋아요 감소
//////////////////////////////////////////////////

function minusLike(index){

  if(users[index].likes > 0){
    users[index].likes--;
  }

  saveData();

  render();

}

//////////////////////////////////////////////////
// 삭제
//////////////////////////////////////////////////

function removeUser(index){

  users.splice(index,1);

  saveData();

  render();

}

//////////////////////////////////////////////////
// 자동 새로고침 느낌
//////////////////////////////////////////////////

setInterval(()=>{
  render();
},1000);

render();

</script>

</body>
</html>
