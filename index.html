<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ 좋아요 순위 ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Jua',sans-serif;
}

body{
  background:linear-gradient(180deg,#ffd9eb,#fff3f8);
  padding:12px;
}

.container{
  max-width:500px;
  margin:auto;
}

.title{
  text-align:center;
  font-size:32px;
  color:#ff2f6d;
  margin-bottom:12px;
}

.box{
  background:white;
  padding:12px;
  border-radius:18px;
  margin-bottom:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.add-text{
  text-align:center;
  color:#ff4f88;
  font-size:20px;
  margin-bottom:10px;
}

.input-group{
  display:flex;
  gap:8px;
}

input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:12px;
  background:#ffe5ef;
  font-size:15px;
  outline:none;
}

.add-btn{
  border:none;
  border-radius:12px;
  background:#ff4f88;
  color:white;
  padding:10px 14px;
  font-size:15px;
  cursor:pointer;
}

.ranking{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.card{
  background:white;
  border-radius:18px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.07);
}

.left{
  display:flex;
  align-items:center;
  gap:10px;
}

.rank{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#ff4f88;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:16px;
}

.name{
  font-size:20px;
  color:#333;
  cursor:pointer;
  transition:0.15s;
  user-select:none;
}

.name:active{
  transform:scale(0.95);
}

.likes{
  color:#ff2f6d;
  font-size:24px;
}

.gold{
  background:linear-gradient(90deg,#ffe27a,#fff5c4);
}

.silver{
  background:linear-gradient(90deg,#e3e3e3,#fafafa);
}

.bronze{
  background:linear-gradient(90deg,#ffc08f,#ffe3cc);
}

.delete{
  margin-left:8px;
  color:#999;
  cursor:pointer;
  font-size:14px;
}

.tip{
  text-align:center;
  color:#ff5d95;
  font-size:15px;
  margin-bottom:10px;
}

</style>
</head>
<body>

<div class="container">

  <div class="title">
    ❤️ 좋아요 순위 ❤️
  </div>

  <div class="tip">
    💖 이름 누르면 +10 💖
  </div>

  <div class="box">

    <div class="add-text">
      ✨ 추가 ✨
    </div>

    <div class="input-group">

      <input type="text" id="name" placeholder="닉네임">

      <input type="number" id="likes" placeholder="점수">

      <button class="add-btn" onclick="addUser()">
        추가
      </button>

    </div>

  </div>

  <div class="ranking" id="ranking"></div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("ranking")) || [];

function saveData(){
  localStorage.setItem("ranking", JSON.stringify(users));
}

function render(){

  users.sort((a,b)=>b.likes-a.likes);

  const ranking = document.getElementById("ranking");

  let html = "";

  users.forEach((user,index)=>{

    let bg = "";

    if(index===0) bg="gold";
    else if(index===1) bg="silver";
    else if(index===2) bg="bronze";

    html += `

    <div class="card ${bg}">

      <div class="left">

        <div class="rank">
          ${index+1}
        </div>

        <div class="name"
          onclick="addLike(${index})">

          ❤️ ${user.name}

        </div>

        <div class="delete"
          onclick="removeUser(${index})">

          🗑️

        </div>

      </div>

      <div class="likes">
        ${user.likes}
      </div>

    </div>

    `;
  });

  ranking.innerHTML = html;

}

function addUser(){

  const name = document.getElementById("name").value;

  const likes = Number(document.getElementById("likes").value);

  if(name === "" || likes === ""){
    alert("입력해!");
    return;
  }

  users.push({
    name,
    likes
  });

  saveData();

  render();

  document.getElementById("name").value = "";
  document.getElementById("likes").value = "";

}

function addLike(index){

  users[index].likes += 10;

  saveData();

  render();

}

function removeUser(index){

  users.splice(index,1);

  saveData();

  render();

}

render();

</script>

</body>
</html>
