<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>나만의 일기장</title>

<style>
@font-face {
  font-family: 'SchoolSafetyWing';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/SchoolSafetyWing.woff') format('woff');
}

body{margin:0;font-family:'SchoolSafetyWing';background:#2e1065;color:white}
header{background:#4c1d95;padding:15px;text-align:center;font-size:24px}
.container{padding:15px}
input,button,textarea{font-family:'SchoolSafetyWing';padding:8px;margin:5px 0;border:none;border-radius:8px}
button{background:#7c3aed;color:white;cursor:pointer}
.group{background:#5b21b6;padding:15px;border-radius:12px;display:inline-block;margin:8px;cursor:pointer}
.post{background:#6d28d9;padding:12px;border-radius:10px;margin:8px 0;cursor:pointer}
.hidden{display:none}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000000aa;display:flex;justify-content:center;align-items:center}
.modal-content{background:#4c1d95;padding:20px;border-radius:15px;width:300px}
.menu{float:right;cursor:pointer}
</style>
</head>
<body>

<header>💜 나만의 일기장 💜</header>

<div class="container" id="auth">
<h3>로그인 / 회원가입</h3>
<input id="idInput" placeholder="아이디">
<input id="pwInput" type="password" placeholder="비밀번호">
<button id="signupBtn">회원가입</button>
<button id="loginBtn">로그인</button>
<p id="msg"></p>
</div>

<div class="container hidden" id="app">
<button id="logoutBtn">로그아웃</button>

<h3>📁 그룹 만들기</h3>
<input id="groupName" placeholder="그룹 이름">
<button id="addGroupBtn">추가</button>
<div id="groups"></div>

<div id="groupSection" class="hidden">
<h3>✏ 글 작성</h3>
<textarea id="content" placeholder="내용"></textarea>
<input type="file" id="img">
<button id="addPostBtn">작성</button>
<div id="posts"></div>
</div>
</div>

<div id="modal" class="modal hidden">
<div class="modal-content">
<div id="modalBody"></div>
<button onclick="closeModal()">닫기</button>
</div>
</div>

<script>
const idInput = document.getElementById('idInput');
const pwInput = document.getElementById('pwInput');
const msg = document.getElementById('msg');
const auth = document.getElementById('auth');
const app = document.getElementById('app');
const groupsDiv = document.getElementById('groups');
const postsDiv = document.getElementById('posts');
const groupSection = document.getElementById('groupSection');

let currentUser=null,currentGroup=null;

function getData(){return JSON.parse(localStorage.getItem('diary')||'{}')}
function saveData(d){localStorage.setItem('diary',JSON.stringify(d))}

document.getElementById('signupBtn').onclick=function(){
let d=getData();
if(d[idInput.value]) return msg.innerText="이미 있음";
d[idInput.value]={pw:pwInput.value,groups:{}};
saveData(d);
msg.innerText="회원가입 완료!";
}

document.getElementById('loginBtn').onclick=function(){
let d=getData();
if(d[idInput.value]&&d[idInput.value].pw===pwInput.value){
currentUser=idInput.value;
auth.classList.add('hidden');
app.classList.remove('hidden');
msg.innerText="로그인 성공!";
renderGroups();
}else msg.innerText="로그인 실패";
}

document.getElementById('logoutBtn').onclick=function(){
currentUser=null;
app.classList.add('hidden');
auth.classList.remove('hidden');
groupSection.classList.add('hidden');
}

document.getElementById('addGroupBtn').onclick=function(){
let d=getData();
d[currentUser].groups[groupName.value]={posts:[]};
saveData(d);
renderGroups();
}

function renderGroups(){
groupsDiv.innerHTML="";
let g=getData()[currentUser].groups;
for(let name in g){
let div=document.createElement('div');
div.className='group';
div.innerText=name;
div.onclick=()=>{currentGroup=name;groupSection.classList.remove('hidden');renderPosts();}
groupsDiv.appendChild(div);
}
}

document.getElementById('addPostBtn').onclick=function(){
let reader=new FileReader();
reader.onload=function(){
let d=getData();
d[currentUser].groups[currentGroup].posts.push({text:content.value,img:reader.result});
saveData(d);
renderPosts();
}
if(img.files[0]) reader.readAsDataURL(img.files[0]);
else reader.onload();
}

function renderPosts(){
postsDiv.innerHTML="";
let p=getData()[currentUser].groups[currentGroup].posts;
p.forEach((post,i)=>{
let div=document.createElement('div');
div.className='post';
div.innerText=post.text.substring(0,20);
div.onclick=()=>openPost(post,i);
postsDiv.appendChild(div);
})
}

function openPost(post,i){
modal.classList.remove('hidden');
modalBody.innerHTML=`<span class="menu" onclick="deletePost(${i})">삭제</span>
<p>${post.text}</p>
${post.img?`<img src="${post.img}" width="100%">`:''}`;
}

function deletePost(i){
let d=getData();
d[currentUser].groups[currentGroup].posts.splice(i,1);
saveData(d);
closeModal();
renderPosts();
}

function closeModal(){modal.classList.add('hidden')}
</script>

</body>
</html>
