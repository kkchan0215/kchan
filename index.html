<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>나만의 일기장</title>

<link href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/SchoolSafetyWing.woff" rel="stylesheet">

<style>
body{margin:0;font-family:'SchoolSafetyWing';background:#2e1065;color:white}
header{background:#4c1d95;padding:15px;text-align:center;font-size:24px}
.container{padding:15px}
input,button,textarea{font-family:'SchoolSafetyWing';padding:8px;margin:5px 0;border:none;border-radius:8px}
button{background:#7c3aed;color:white;cursor:pointer}
button:hover{opacity:.8}
.group{background:#5b21b6;padding:15px;border-radius:12px;display:inline-block;margin:8px;cursor:pointer}
.post{background:#6d28d9;padding:12px;border-radius:10px;margin:8px 0;cursor:pointer}
.hidden{display:none}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000000aa;display:flex;justify-content:center;align-items:center}
.modal-content{background:#4c1d95;padding:20px;border-radius:15px;width:300px}
.menu{float:right;cursor:pointer}
</style>
</head>
<body>

<header>💜 나만의 일기장 💜</header>

<div class="container" id="auth">
<h3>로그인 / 회원가입</h3>
<input id="id" placeholder="아이디">
<input id="pw" type="password" placeholder="비밀번호">
<button onclick="signup()">회원가입</button>
<button onclick="login()">로그인</button>
<p id="msg"></p>
</div>

<div class="container hidden" id="app">
<button onclick="logout()">로그아웃</button>

<h3>📁 그룹 만들기</h3>
<input id="groupName" placeholder="그룹 이름">
<button onclick="addGroup()">추가</button>
<div id="groups"></div>

<div id="groupSection" class="hidden">
<h3>✏ 글 작성</h3>
<textarea id="content" placeholder="내용"></textarea>
<input type="file" id="img">
<button onclick="addPost()">작성</button>
<div id="posts"></div>
</div>
</div>

<div id="modal" class="modal hidden">
<div class="modal-content">
<span onclick="closeModal()">닫기</span>
<div id="modalBody"></div>
</div>
</div>

<script>
let currentUser=null,currentGroup=null;

function getData(){return JSON.parse(localStorage.getItem('diary')||'{}')}
function saveData(d){localStorage.setItem('diary',JSON.stringify(d))}

function signup(){
let d=getData();
if(d[id.value]) return msg.innerText="이미 있음";
d[id.value]={pw:pw.value,groups:{}};
saveData(d);
msg.innerText="회원가입 완료!";
}

function login(){
let d=getData();
if(d[id.value]&&d[id.value].pw===pw.value){
currentUser=id.value;
auth.classList.add('hidden');
app.classList.remove('hidden');
msg.innerText="로그인 성공!";
renderGroups();
}else msg.innerText="실패";
}

function logout(){
currentUser=null;
app.classList.add('hidden');
auth.classList.remove('hidden');
groupSection.classList.add('hidden');
}

function addGroup(){
let d=getData();
d[currentUser].groups[groupName.value]={posts:[]};
saveData(d);
renderGroups();
}

function deleteGroup(name){
let d=getData();
delete d[currentUser].groups[name];
saveData(d);
renderGroups();
}

function renderGroups(){
groups.innerHTML="";
let g=getData()[currentUser].groups;
for(let name in g){
let div=document.createElement('div');
div.className='group';
div.innerHTML=name+" ❌";
div.onclick=()=>openGroup(name);
div.ondblclick=()=>deleteGroup(name);
groups.appendChild(div);
}
}

function openGroup(name){
currentGroup=name;
groupSection.classList.remove('hidden');
renderPosts();
}

function addPost(){
let reader=new FileReader();
reader.onload=function(){
let d=getData();
d[currentUser].groups[currentGroup].posts.push({text:content.value,img:reader.result});
saveData(d);
renderPosts();
}
if(img.files[0]) reader.readAsDataURL(img.files[0]);
else reader.onload();
}

function renderPosts(){
posts.innerHTML="";
let p=getData()[currentUser].groups[currentGroup].posts;
p.forEach((post,i)=>{
let div=document.createElement('div');
div.className='post';
div.innerHTML=post.text.substring(0,20)+"...";
div.onclick=()=>openPost(post,i);
posts.appendChild(div);
})
}

function openPost(post,i){
modal.classList.remove('hidden');
modalBody.innerHTML=`<span class="menu" onclick="deletePost(${i})">⋮ 삭제</span>
<p>${post.text}</p>
${post.img?`<img src="${post.img}" width="100%">`:''}`;
}

function deletePost(i){
let d=getData();
d[currentUser].groups[currentGroup].posts.splice(i,1);
saveData(d);
closeModal();
renderPosts();
}

function closeModal(){modal.classList.add('hidden')}
</script>

</body>
</html>
