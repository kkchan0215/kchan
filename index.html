<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐰 귀여운 타이머</title>

<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#fff5f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:'Gaegu',cursive;
}

.box{
    background:white;
    border:8px solid #ffb6d9;
    border-radius:35px;
    padding:35px;
    width:420px;
    text-align:center;
    box-shadow:0 15px 35px rgba(255,120,180,.25);
}

h1{
    margin-top:0;
    color:#ff5fa2;
    font-size:45px;
}

#timer{
    font-size:78px;
    color:#444;
    margin:25px 0;
}

button{
    font-family:'Gaegu',cursive;
    font-size:28px;
    padding:12px 28px;
    margin:6px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    background:#ff9fc9;
    color:white;
    transition:.2s;
}

button:hover{
    transform:scale(1.08);
}

.info{
    margin-top:25px;
    font-size:20px;
    color:#666;
    line-height:1.8;
}
</style>
</head>

<body>

<div class="box">

<h1>⏰ 타이머</h1>

<div id="timer">00:00</div>

<button onclick="start()">▶ 시작</button>
<button onclick="pause()">⏸ 일시정지</button>
<button onclick="reset()">🔄 초기화</button>

<div class="info">
<b>키보드</b><br><br>

1️⃣ +10초<br>
2️⃣ +1분<br>
3️⃣ +5분<br>
4️⃣ +10분<br>
5️⃣ +30분<br><br>

6️⃣ -10초<br>
7️⃣ -1분<br>
8️⃣ -5분<br>
9️⃣ -10분<br>
0️⃣ -30분

</div>

</div>

<script>

let time=0;
let timer=null;

function format(sec){

if(sec<0) sec=0;

let m=Math.floor(sec/60);
let s=sec%60;

return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

}

function update(){
document.getElementById("timer").innerText=format(time);
}

function start(){

if(timer) return;

timer=setInterval(()=>{

if(time>0){

time--;
update();

}else{

clearInterval(timer);
timer=null;
alert("⏰ 시간 종료!");

}

},1000);

}

function pause(){

clearInterval(timer);
timer=null;

}

function reset(){

pause();
time=0;
update();

}

document.addEventListener("keydown",e=>{

switch(e.key){

case "1":
time+=10;
break;

case "2":
time+=60;
break;

case "3":
time+=300;
break;

case "4":
time+=600;
break;

case "5":
time+=1800;
break;

case "6":
time-=10;
break;

case "7":
time-=60;
break;

case "8":
time-=300;
break;

case "9":
time-=600;
break;

case "0":
time-=1800;
break;

default:
return;

}

if(time<0) time=0;

update();

});

update();

</script>

</body>
</html>
