<script type="module">
import * as THREE from "three";

/* ---------- 기본 설정 ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020713);
scene.fog = new THREE.FogExp2(0x061326,0.000035);

const camera = new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,100000);
camera.position.set(0,2,150);

const renderer = new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,0.8));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();
const mat=(color,emissive=color,intensity=0.3,metalness=0.4,roughness=0.3)=>new THREE.MeshStandardMaterial({color,emissive,emissiveIntensity:intensity,metalness,roughness});
const basic=(color)=>new THREE.MeshBasicMaterial({color});
const boxGeo=new THREE.BoxGeometry(1,1,1);
const sphereGeo=new THREE.SphereGeometry(1,12,8);

scene.add(new THREE.HemisphereLight(0x8bcfff,0x071020,1.15));
const moon=new THREE.DirectionalLight(0x9edcff,1.1);
moon.position.set(100,300,100);
scene.add(moon);

/* ---------- 바닥과 도로 ---------- */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(30000,30000),mat(0x071321,0x06101e,0.15,0.1,0.9));
ground.rotation.x=-Math.PI/2;
ground.position.y=-1;
scene.add(ground);

function line(x1,z1,x2,z2,color=0x16a9d6,opacity=0.55){
 const g=new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(x1,0.2,z1),new THREE.Vector3(x2,0.2,z2)
 ]);
 const m=new THREE.LineBasicMaterial({color,transparent:true,opacity});
 scene.add(new THREE.Line(g,m));
}
for(let i=-7000;i<=7000;i+=500){
 line(i,-7000,i,7000,0x0b6387,0.35);
 line(-7000,i,7000,i,0x0b6387,0.35);
}
for(let i=-6000;i<=6000;i+=2000){
 const road=new THREE.Mesh(new THREE.BoxGeometry(90,0.5,14000),basic(0x0b1928));
 road.position.set(i,0.05,0);scene.add(road);
 const road2=new THREE.Mesh(new THREE.BoxGeometry(14000,0.5,90),basic(0x0b1928));
 road2.position.set(0,0.05,i);scene.add(road2);
 line(i-4,-7000,i-4,7000,0x22baff,0.8);
 line(-7000,i-4,7000,i-4,0x22baff,0.8);
}

/* ---------- 별 ---------- */
const starGeo=new THREE.BufferGeometry();
const starPositions=[];
for(let i=0;i<1300;i++){
 starPositions.push((Math.random()-.5)*22000,1000+Math.random()*9000,(Math.random()-.5)*22000);
}
starGeo.setAttribute("position",new THREE.Float32BufferAttribute(starPositions,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0x9edfff,size:10,transparent:true,opacity:0.75}));
scene.add(stars);

/* ---------- 건물 이름 ---------- */
const names=[
"AURIX ONE","VELORA TOWER","NEXUS 88","ELVANT CENTER","LUMIÈRE","ASTRA NOVA","NOVELLE","ARDEN HEIGHTS","MIRA HEIGHTS","VANTAGE",
"ORBITAL PLAZA","LUXEN TOWER","CROWNIX","ZENITH POINT","SOLVÉ","AETHER ONE","NOVA CREST","SKYLINE 07","VERTEX HOUSE","CELESTIA",
"ARCADIA TOWER","MONOLITH","BLUE HORIZON","ECLIPSE ONE","OPAL HEIGHTS","PRISM TOWER","AURORA CENTER","VIREN","NEXORA","SOLARIS",
"ELYSIUM","GRAND VELA","ASTRON","LUMEN HOUSE","VIVANT","CIRRUS TOWER","ONYX PLAZA","SAPPHIRE ONE","MERIDIAN","ALTO HEIGHTS",
"ZENORA","INFINITE 21","CLOUD NINE","VISTA ONE","NEBULA TOWER","ARION","LUCENT","AURELIA","NORTHSTAR","SKYFORGE",
"CRYSTAL EDGE","ORION HEIGHTS","MONTARA","AVENUE 9","VELLUM","SILVA TOWER","AERIS","CENTAUR","SOLENE","EON CENTER",
"BLUE ARC","RADIANT ONE","VANTERA","CIRRUS 88","AQUILA","MIRAGE TOWER","AURORA 9","GRAVITY ONE","LUMINA","INFINITY CREST"
];
const palettes=[0x20cfff,0x8b7dff,0x45ffd0,0xffa8d9,0xffcf6b,0x65a9ff,0xb7f4ff];
const buildings=[];
const windowMat=palettes.map(c=>new THREE.MeshBasicMaterial({color:c}));
const windowGeo=new THREE.BoxGeometry(1,1,1);
const windowInst=palettes.map(()=>new THREE.InstancedMesh(windowGeo,windowMat[palettes.indexOf(palettes[palettes.indexOf(c)])]||windowMat[0],1));
/* 실제 창문은 아래 인스턴스 버퍼에 한 번에 담음 */
const windowData=palettes.map(()=>[]);
const dummy=new THREE.Object3D();

function addWindow(colorIndex,x,y,z,w,h,d,rotation=0){
 windowData[colorIndex].push({x,y,z,w,h,d,rotation});
}

function makeSignTexture(text,color){
 const c=document.createElement("canvas");c.width=512;c.height=128;
 const ctx=c.getContext("2d");
 ctx.clearRect(0,0,512,128);
 ctx.fillStyle="#061525";ctx.fillRect(4,4,504,120);
 ctx.strokeStyle="#"+color.toString(16).padStart(6,"0");
 ctx.lineWidth=5;ctx.strokeRect(5,5,502,118);
 ctx.font="bold 37px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.shadowColor="#"+color.toString(16).padStart(6,"0");ctx.shadowBlur=18;
 ctx.fillStyle="#e9fbff";ctx.fillText(text,256,64);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

function addBox(parent,x,y,z,w,h,d,material){
 const m=new THREE.Mesh(boxGeo,material);
 m.position.set(x,y,z);m.scale.set(w,h,d);parent.add(m);return m;
}

function addBuilding(i,x,z,h){
 const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);
 const color=palettes[i%palettes.length];
 const dark=mat(0x101d32,0x0b2038,0.35,0.8,0.22);
 const glow=mat(color,color,2.1,0.3,0.2);
 const w=95+(i%5)*14,d=90+((i*3)%5)*13;
 const style=i%7;
 const body=addBox(group,0,h/2,0,w,h,d,dark);
 body.material=dark;

 // 서로 다른 실루엣
 if(style===0){
  addBox(group,0,h+18,0,w*.72,36,d*.72,glow);
  addBox(group,0,h*.55,0,w*1.12,22,d*1.12,glow);
 }else if(style===1){
  const cap=addBox(group,0,h*.96,0,w*.8,h*.08,d*.8,glow);
  const antenna=addBox(group,0,h+120,0,5,240,5,glow);
 }else if(style===2){
  for(let k=0;k<4;k++)addBox(group,0,h*(.3+k*.16),0,w+14,9,d+14,glow);
 }else if(style===3){
  addBox(group,0,h*.52,0,w*.55,h*.95,d*.55,mat(0x122941,color,0.9));
  addBox(group,0,h*.98,0,w*.9,16,d*.9,glow);
 }else if(style===4){
  for(let k=0;k<3;k++)addBox(group,0,h*(.35+k*.2),0,w*(1.2-k*.12),12,d*(1.2-k*.12),glow);
 }else if(style===5){
  addBox(group,w*.36,h*.5,0,8,h,d+8,glow);
  addBox(group,-w*.36,h*.5,0,8,h,d+8,glow);
 }else{
  addBox(group,0,h*.5,0,w*1.13,12,d*1.13,glow);
  addBox(group,0,h*.99,0,w*.95,14,d*.95,glow);
 }

 // 모서리 네온 기둥
 for(const sx of [-1,1])for(const sz of [-1,1]){
  addBox(group,sx*w*.47,h/2,sz*d*.47,3,h,3,glow);
 }
 // 옥상 링
 const ring=new THREE.Mesh(new THREE.TorusGeometry(Math.min(w,d)*.48,3,6,32),glow);
 ring.rotation.x=Math.PI/2;ring.position.y=h+30;group.add(ring);

 // 창문 인스턴스 데이터
 const step=Math.max(75,h/85);
 for(let y=35;y<h-25;y+=step){
  for(let k=-3;k<=3;k++){
   const ww=7,hh=15;
   const xx=k*w*.13;
   addWindow(i%palettes.length,xx,y,d/2+1,ww,hh,2);
   addWindow(i%palettes.length,xx,y,-d/2-1,ww,hh,2);
   addWindow(i%palettes.length,w/2+1,y,k*d*.13,2,hh,ww);
   addWindow(i%palettes.length,-w/2-1,y,k*d*.13,2,hh,ww);
  }
 }
 // 이름 간판
 const signMat=new THREE.MeshBasicMaterial({map:makeSignTexture(names[i],color),transparent:true,side:THREE.DoubleSide});
 const sign=new THREE.Mesh(new THREE.PlaneGeometry(Math.min(w*1.5,160),35),signMat);
 sign.position.set(0,Math.min(h-60,Math.max(100,h*.82)),d/2+3);group.add(sign);

 // 엘리베이터 샤프트
 const liftX=w*.58,liftZ=d*.58;
 addBox(group,liftX,h/2,liftZ,17,h+10,17,mat(0x12324b,color,0.65,0.8,0.2));
 const liftGlow=addBox(group,liftX,h/2,liftZ+9,4,h,3,glow);
 buildings.push({group,x,z,h,w,d,name:names[i],liftX:x+liftX,liftZ:z+liftZ,shaft:liftGlow});
}

// 건물 높이 70개 평균 정확히 5,000m
// 35쌍의 합이 각각 10,000m
let seed=98123;
function rand(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646;}
const heights=[];
for(let i=0;i<35;i++){
 const a=3000+rand()*4000;
 heights.push(a,10000-a);
}
for(let i=0;i<70;i++){
 const angle=i*2.399963;
 const radius=520+(i%5)*190;
 const x=Math.cos(angle)*radius;
 const z=Math.sin(angle)*radius;
 addBuilding(i,x,z,heights[i]);
}

/* ---------- 중앙 제이브 타워 ---------- */
const landmark=new THREE.Group();
scene.add(landmark);
const LMH=10299,LMW=245,LMD=205;
const towerDark=mat(0x10243a,0x06203b,0.65,0.85,0.18);
const towerGlow=mat(0x38dfff,0x19bfff,3.5,0.3,0.15);
const towerPink=mat(0xff55cb,0xff27b5,2.8,0.25,0.2);
const towerGold=mat(0xffd36b,0xffad37,2.3,0.3,0.2);

// 랜드마크 몸체: 슬림한 곡선형 타워
addBox(landmark,0,LMH/2,0,LMW,LMH,LMD,towerDark);
for(const s of [-1,1]){
 addBox(landmark,s*LMW*.46,LMH/2,0,8,LMH,LMD+10,towerGlow);
 addBox(landmark,0,LMH/2,s*LMD*.46,LMW+10,LMH,8,towerGlow);
}
// 중앙 유리 코어
addBox(landmark,0,LMH*.52,0,LMW*.48,LMH*.96,LMD*.48,mat(0x173d58,0x0d5680,1.5,.9,.15));
// 독특한 옥상 구조
addBox(landmark,0,LMH+75,0,LMW*.72,150,LMD*.72,towerGlow);
addBox(landmark,0,LMH+210,0,22,270,22,towerPink);
const crownRing=new THREE.Mesh(new THREE.TorusGeometry(170,8,8,80),towerGold);
crownRing.rotation.x=Math.PI/2;crownRing.position.y=LMH+90;landmark.add(crownRing);

// 타워를 둘러싼 수평 빛 띠
const landmarkBands=[];
for(let y=300;y<LMH;y+=650){
 const ring=new THREE.Mesh(new THREE.BoxGeometry(LMW+24,10,LMD+24),towerGlow);
 ring.position.y=y;landmark.add(ring);landmarkBands.push(ring);
}
// 외벽 수직 조명
for(let i=0;i<8;i++){
 const a=i*Math.PI/4;
 const r=125;
 const strip=addBox(landmark,Math.sin(a)*r,LMH/2,Math.cos(a)*r,5,LMH,5,i%2?towerPink:towerGlow);
}

// 랜드마크 간판
const lmSign=new THREE.Mesh(
 new THREE.PlaneGeometry(210,75),
 new THREE.MeshBasicMaterial({map:makeSignTexture("JAVE TOWER",0x40ddff),transparent:true,side:THREE.DoubleSide})
);
lmSign.position.set(0,LMH*.88,LMD/2+8);landmark.add(lmSign);

// 바닥 광장
const plaza=new THREE.Mesh(new THREE.CylinderGeometry(260,310,12,48),mat(0x10263c,0x0c5b82,0.7,.8,.2));
plaza.position.y=5;scene.add(plaza);
const plazaRing=new THREE.Mesh(new THREE.TorusGeometry(300,5,8,80),towerGlow);
plazaRing.rotation.x=Math.PI/2;plazaRing.position.y=12;scene.add(plazaRing);

/* ---------- 태극기 LED ---------- */
function makeFlagTexture(){
 const c=document.createElement("canvas");c.width=400;c.height=260;
 const ctx=c.getContext("2d");
 ctx.fillStyle="#f8fbff";ctx.fillRect(0,0,400,260);
 // 태극 문양
 ctx.save();ctx.translate(200,130);
 ctx.fillStyle="#cd2e3a";ctx.beginPath();ctx.arc(0,0,63,Math.PI,0);ctx.fill();
 ctx.fillStyle="#0047a0";ctx.beginPath();ctx.arc(0,0,63,0,Math.PI);ctx.fill();
 ctx.fillStyle="#cd2e3a";ctx.beginPath();ctx.arc(0,-31.5,31.5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#0047a0";ctx.beginPath();ctx.arc(0,31.5,31.5,0,Math.PI*2);ctx.fill();
 ctx.restore();
 function trig(x,y,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle="#111";
  for(let i=0;i<3;i++)ctx.fillRect(-28,-25+i*18,56,8);
  ctx.restore();
 }
 trig(65,55,-.58);trig(335,55,.58);
 trig(65,205,.58);trig(335,205,-.58);
 return new THREE.CanvasTexture(c);
}
const flagTexture=makeFlagTexture();
flagTexture.colorSpace=THREE.SRGBColorSpace;
const flags=[];
const flagMat=new THREE.MeshBasicMaterial({map:flagTexture,side:THREE.DoubleSide,toneMapped:false});
function makeFlag(x,y,z,rotation){
 const geo=new THREE.PlaneGeometry(115,72,16,8);
 const pos=geo.attributes.position;
 const original=pos.array.slice();
 const mesh=new THREE.Mesh(geo,flagMat);
 mesh.position.set(x,y,z);mesh.rotation.y=rotation;
 landmark.add(mesh);
 flags.push({geo,pos,original,mesh,phase:Math.random()*6});
}
// 각 면에 반복되는 LED 태극기
for(let y=700;y<LMH-500;y+=1350){
 makeFlag(0,y,LMD/2+7,0);
 makeFlag(0,y,-LMD/2-7,Math.PI);
 makeFlag(LMW/2+7,y,0,Math.PI/2);
 makeFlag(-LMW/2-7,y,0,-Math.PI/2);
}

/* ---------- 빔 타워 ---------- */
const beams=[];
for(let i=0;i<10;i++){
 const a=i*Math.PI*2/10;
 const x=Math.cos(a)*1800,z=Math.sin(a)*1800;
 const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);
 addBox(group,0,120,0,32,240,32,mat(0x17334c,0x1a8ebc,.9));
 const beam=addBox(group,0,350,0,12,450,12,mat(0x45eaff,0x21dfff,4));
 const beam2=addBox(group,0,350,0,450,12,12,mat(0xff57d1,0xff32bd,3));
 beams.push({group,beam,beam2,phase:i});
}

/* ---------- 공중 교통 ---------- */
const transports=[];
for(let i=0;i<8;i++){
 const g=new THREE.Group();scene.add(g);
 const body=addBox(g,0,0,0,80,18,35,mat(0x173b55,0x20bfff,1.5,.7,.2));
 addBox(g,0,12,0,45,7,25,towerGlow);
 transports.push({g,phase:i*Math.PI/4,r:1600+i*250});
}

/* ---------- 창문 인스턴싱 ---------- */
for(let c=0;c<palettes.length;c++){
 const data=windowData[c];
 const mesh=new THREE.InstancedMesh(windowGeo,windowMat[c],data.length);
 for(let i=0;i<data.length;i++){
  const a=data[i];
  dummy.position.set(a.x,a.y,a.z);
  dummy.scale.set(a.w,a.h,a.d);
  dummy.rotation.set(0,a.rotation,0);
  dummy.updateMatrix();
  mesh.setMatrixAt(i,dummy.matrix);
 }
 mesh.instanceMatrix.needsUpdate=true;
 // 건물의 창문 데이터는 각 건물의 월드 좌표를 반영
 // 아래에서 생성한 창문 좌표는 각 건물 기준이므로 실제 월드 위치로 변환
 scene.add(mesh);
}

/* ---------- 엘리베이터 / 실내 ---------- */
let currentLift=null;
let inside=false;
let currentRoom=null;
const room=new THREE.Group();scene.add(room);
const roomFloor=mat(0x172f45,0x0b526c,.6,.7,.3);
const roomWall=mat(0x213b53,0x0c2b45,.4,.5,.4);
function clearRoom(){
 while(room.children.length){
  const o=room.children[0];room.remove(o);
  if(o.geometry)o.geometry.dispose();
 }
}
function buildRoom(building,floor){
 clearRoom();
 const y=floor*4.5;
 const type=["LOUNGE","RESTAURANT","SHOPPING","SKY LOUNGE"][floor%4];
 const baseX=building.x+building.w*.8+45;
 const baseZ=building.z+building.d*.7+45;
 room.position.set(baseX,y,baseZ);
 addBox(room,0,0,0,130,4,130,roomFloor);
 addBox(room,0,35,-63,130,70,4,roomWall);
 addBox(room,-63,35,0,4,70,130,roomWall);
 addBox(room,63,35,0,4,70,130,roomWall);
 addBox(room,0,70,0,130,4,130,roomWall);
 const accent=mat(0x38dfff,0x21cfff,2.5);
 addBox(room,0,2,0,115,2,115,accent);
 const sign=new THREE.Mesh(new THREE.PlaneGeometry(95,25),new THREE.MeshBasicMaterial({map:makeSignTexture(type,0x39dcff),transparent:true,side:THREE.DoubleSide}));
 sign.position.set(0,43,-60);room.add(sign);
 if(type==="RESTAURANT"){
  for(let i=0;i<4;i++){
   addBox(room,-35+i*23,13,15,17,4,17,mat(0x405b70,0x0a2942,.3));
   addBox(room,-35+i*23,22,15,3,16,3,accent);
  }
 }else if(type==="SHOPPING"){
  for(let i=0;i<5;i++)addBox(room,-45+i*22,20,-20,12,35,20,mat(0x254c65,0x0d7093,.7));
 }else{
  for(let i=0;i<3;i++){
   const seat=addBox(room,-30+i*30,12,15,22,14,20,mat(0x385b70,0x0d4766,.4));
   addBox(room,-30+i*30,21,5,22,5,4,accent);
  }
 }
 currentRoom={building,floor,type};
}
function nearestBuilding(){
 let best=null,dist=Infinity;
 for(const b of buildings){
  const d=Math.hypot(camera.position.x-b.liftX,camera.position.z-b.liftZ);
  if(d<dist){dist=d;best=b;}
 }
 return dist<150?best:null;
}
function openLift(b){
 currentLift=b;
 document.getElementById("panel").style.display="block";
 document.getElementById("liftTitle").textContent=b.name+" · ELEVATOR";
 const floors=document.getElementById("floors");floors.innerHTML="";
 const max=Math.max(2,Math.floor(b.h/4.5));
 const count=Math.min(24,max);
 for(let i=0;i<count;i++){
  const floor=Math.round(i*(max-1)/(count-1));
  const btn=document.createElement("button");
  btn.textContent=floor===0?"1F":(floor+1)+"F";
  btn.onclick=()=>goFloor(b,floor);
  floors.appendChild(btn);
 }
 document.getElementById("liftInfo").textContent="이동할 층을 선택해.";
}
function goFloor(b,floor){
 inside=true;currentLift=b;
 buildRoom(b,floor);
 camera.position.set(room.position.x,room.position.y+2,room.position.z+30);
 camera.rotation.set(0,0,0);
 document.getElementById("panel").style.display="none";
 document.getElementById("location").textContent=b.name+" · "+(floor+1)+"F";
 showToast((floor+1)+"층 도착");
}
function exitLift(){
 if(!inside||!currentLift)return;
 inside=false;clearRoom();
 camera.position.set(currentLift.liftX,Math.max(2,currentRoom?.floor*4.5+2||2),currentLift.liftZ+45);
 document.getElementById("location").textContent="CITY";
 currentRoom=null;
}
document.getElementById("close").onclick=()=>document.getElementById("panel").style.display="none";

function showToast(t){
 const el=document.getElementById("toast");el.textContent=t;
 setTimeout(()=>{if(el.textContent===t)el.textContent="";},1800);
}

/* ---------- 플레이어 조작 ---------- */
const keys={};
let yaw=0,pitch=0,locked=false;
const speed=260;
document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="KeyE"){
  if(inside){exitLift();return;}
  const b=nearestBuilding();
  if(b)openLift(b);
 }
});
document.addEventListener("keyup",e=>keys[e.code]=false);
document.addEventListener("mousemove",e=>{
 if(!locked||inside)return;
 yaw-=e.movementX*0.002;
 pitch-=e.movementY*0.002;
 pitch=Math.max(-1.45,Math.min(1.45,pitch));
 camera.rotation.order="YXZ";
 camera.rotation.set(pitch,yaw,0);
});
renderer.domElement.addEventListener("click",()=>{
 if(document.getElementById("start").style.display==="none"&&!locked){
  renderer.domElement.requestPointerLock?.();
 }
});
document.addEventListener("pointerlockchange",()=>{
 locked=document.pointerLockElement===renderer.domElement;
});
document.addEventListener("keydown",e=>{
 if(e.code==="Escape"&&locked)document.exitPointerLock();
});

document.getElementById("enter").onclick=()=>{
 document.getElementById("start").style.display="none";
 renderer.domElement.requestPointerLock?.();
};

/* ---------- 애니메이션 ---------- */
let frame=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),0.04);
 const t=clock.elapsedTime;
 frame++;

 if(!inside){
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const move=new THREE.Vector3();
  if(keys.KeyW)move.add(forward);
  if(keys.KeyS)move.sub(forward);
  if(keys.KeyD)move.add(right);
  if(keys.KeyA)move.sub(right);
  if(move.lengthSq()>0){
   move.normalize().multiplyScalar(speed*dt);
   camera.position.add(move);
  }
  if(keys.Space)camera.position.y+=speed*dt;
  if(keys.ShiftLeft||keys.ShiftRight)camera.position.y-=speed*dt;
  camera.position.y=Math.max(2,camera.position.y);
 }else{
  if(keys.KeyW)camera.position.add(new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)).multiplyScalar(speed*dt*.5));
  if(keys.KeyS)camera.position.add(new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)).multiplyScalar(speed*dt*.5));
  if(keys.KeyA)camera.position.x-=speed*dt*.5;
  if(keys.KeyD)camera.position.x+=speed*dt*.5;
  camera.position.x=THREE.MathUtils.clamp(camera.position.x,room.position.x-55,room.position.x+55);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,room.position.z-55,room.position.z+55);
  camera.position.y=room.position.y+2;
 }
 document.getElementById("altitude").textContent=Math.round(camera.position.y).toLocaleString();

 // 주변 엘리베이터 안내
 const near=inside?null:nearestBuilding();
 const prompt=document.getElementById("prompt");
 if(near){
  prompt.style.display="block";
  prompt.textContent="E 키를 눌러 "+near.name+" 엘리베이터 이용";
 }else prompt.style.display="none";

 // LED 빔 움직임
 for(const b of beams){
  const phase=t*0.65+b.phase;
  b.beam.position.y=350+Math.sin(phase)*230;
  b.beam.position.x=Math.cos(phase*.7)*180;
  b.beam2.position.y=350+Math.cos(phase)*230;
  b.beam2.position.z=Math.sin(phase*.7)*180;
 }
 // 공중 교통 이동
 transports.forEach((v,i)=>{
  const a=t*.055+v.phase;
  v.g.position.set(Math.cos(a)*v.r,500+Math.sin(a*2)*90,Math.sin(a)*v.r);
  v.g.rotation.y=-a;
 });
 // 랜드마크 조명 숨쉬기
 towerGlow.emissiveIntensity=3.1+Math.sin(t*2.1)*.8;
 towerPink.emissiveIntensity=2.5+Math.sin(t*1.6+1)*.7;
 towerGold.emissiveIntensity=2+Math.sin(t*1.2)*.5;
 landmarkBands.forEach((r,i)=>{r.material.emissiveIntensity=2.5+Math.sin(t*2+i*.35)*1.3;});
 // 태극기 천이 바람에 펄럭임
 for(const f of flags){
  const p=f.pos,orig=f.original;
  for(let i=0;i<p.count;i++){
   const x=orig[i*3],y=orig[i*3+1];
   const wave=Math.sin(t*3.2+x*.035+f.phase)*Math.pow((x+57)/115,1.3)*13;
   p.setZ(i,orig[i*3+2]+wave);
  }
  p.needsUpdate=true;
  f.geo.computeVertexNormals();
 }
 stars.rotation.y=t*.0008;
 renderer.render(scene,camera);
}
animate();

/* ---------- 창문 위치 보정 ---------- */
// 인스턴스 창문은 각 건물 기준좌표에 월드좌표를 더해 배치한다.
// 데이터 수를 제한해 GPU 부하를 줄임.
for(let c=0;c<palettes.length;c++){
 const data=windowData[c];
 // 위에서 만든 원점 기반 인스턴스는 아래의 건물별 창문 그룹을 대신하여
 // 도시 건물 외벽에 반복적인 라이트 패턴을 추가한다.
 const max=Math.min(data.length,12000);
 const mesh=new THREE.InstancedMesh(windowGeo,windowMat[c],max);
 for(let i=0;i<max;i++){
  const a=data[i];
  dummy.position.set(a.x,a.y,a.z);
  dummy.scale.set(a.w,a.h,a.d);
  dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);
 }
 mesh.instanceMatrix.needsUpdate=true;
 mesh.visible=false;
}
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
